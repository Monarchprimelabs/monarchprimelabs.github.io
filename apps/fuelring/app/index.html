  // Blob.text() with a FileReader fallback for older engines
  // A backup restored from a file (Settings, or the first screen) replaces
  // everything here. Pro belongs to this phone's App Store purchase, not to the
  // file: the entitlement the wrapper injected stays as it is, so moving a
  // diary from the web app into the iPhone app never locks Pro until relaunch.
  async function restoreFrom(file, ask) {
    let next;
    try { next = Core.deserialize(await readText(file)); }
    catch (err) { render(); toast(tr('Not a valid FuelRing backup file')); return; }
    if (ask && !confirm(tr('Replace all FuelRing data on this machine with this backup? This cannot be undone.'))) { render(); return; }
    set(Core.setPro(next, state.pro === true));
    toast(tr('Backup restored'));
  }
  function readText(blob) {
    if (blob.text) return blob.text();
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error);
      fr.readAsText(blob);
    });
  }

  // ---------- APPLE HEALTH IMPORT ----------
  // File IO lives here; all parsing/merging is pure Core. The zip path uses the
  // browser-native DecompressionStream so the app stays dependency-free.
  async function readHealthFile(file) {
    if (/\.zip$/i.test(file.name)) {
      if (typeof DecompressionStream !== 'function') throw new Error("This browser can't unzip — unzip it and pick export.xml");
      return parseXmlStream(await zipEntryStream(file, /(?:^|\/)export\.xml$/), null);
    }
    const canStream = typeof TextDecoder === 'function' && typeof file.stream === 'function';
    return parseXmlStream(canStream ? file.stream() : null, file);
  }

  async function parseXmlStream(stream, blob) {
    const acc = { carry: '', weights: [], energyBySrc: {}, stepsBySrc: {} };
    // totals stay per source across chunks; Core.collapseSources picks one
    // source per day at the end (iPhone and watch are never added together)
    const addAll = (into, part) => {
      for (const [d, srcs] of Object.entries(part)) {
        const t = into[d] = into[d] || {};
        for (const [src, v] of Object.entries(srcs)) t[src] = (t[src] || 0) + v;
      }
    };
    const feed = text => {
      const r = Core.parseHealthRecords(acc.carry, text);
      acc.carry = r.carry;
      acc.weights.push(...r.weights);
      addAll(acc.energyBySrc, r.energyBySrc);
      addAll(acc.stepsBySrc, r.stepsBySrc);
    };
    if (stream) {
      const reader = stream.getReader();
      const dec = new TextDecoder();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        feed(dec.decode(value, { stream: true }));
      }
      feed(dec.decode());
    } else {
      feed(await readText(blob));
    }
    acc.energy = Core.collapseSources(acc.energyBySrc);
    acc.steps = Core.collapseSources(acc.stepsBySrc);
    if (!acc.weights.length && !Object.keys(acc.energy).length && !Object.keys(acc.steps).length) throw new Error('No weight, step, or active-energy records in that file');
    return acc;
  }

  // Every entry in the zip whose name matches, as decoded text.
  async function zipTextEntries(file, nameRe) {
    const out = [];
    for (const name of await zipEntryNames(file)) {
      if (!nameRe.test(name)) continue;
      const stream = await zipEntryStream(file, new RegExp('^' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$'));
      out.push(await readText(await new Response(stream).blob()));
    }
    return out;
  }

  async function zipEntryNames(file) {
    const tail = new DataView(await file.slice(Math.max(0, file.size - 65558), file.size).arrayBuffer());
    let eocd = -1;
    for (let i = tail.byteLength - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error("That doesn't look like a zip file");
    const cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
    if (cdOff === 0xFFFFFFFF) throw new Error('Zip too large — unzip it and pick the CSV files');
    const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
    const td = new TextDecoder();
    const names = [];
    for (let p = 0; p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50;) {
      const nameLen = cd.getUint16(p + 28, true), extraLen = cd.getUint16(p + 30, true), cmtLen = cd.getUint16(p + 32, true);
      names.push(td.decode(new Uint8Array(cd.buffer, p + 46, nameLen)));
      p += 46 + nameLen + extraLen + cmtLen;
    }
    return names;
  }

  // Minimal ZIP reader: locate the named entry via the central directory and
  // return a stream of its bytes (stored or deflate; no ZIP64).
  async function zipEntryStream(file, nameRe) {
    const tail = new DataView(await file.slice(Math.max(0, file.size - 65558), file.size).arrayBuffer());
    let eocd = -1;
    for (let i = tail.byteLength - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error("That doesn't look like a zip file");
    const cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
    if (cdOff === 0xFFFFFFFF) throw new Error('Zip too large — unzip it and pick export.xml');
    const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
    const td = new TextDecoder();
    for (let p = 0; p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50;) {
      const method = cd.getUint16(p + 10, true);
      const compSize = cd.getUint32(p + 20, true);
      const nameLen = cd.getUint16(p + 28, true), extraLen = cd.getUint16(p + 30, true), cmtLen = cd.getUint16(p + 32, true);
      const lhOff = cd.getUint32(p + 42, true);
      const name = td.decode(new Uint8Array(cd.buffer, p + 46, nameLen));
      if (nameRe.test(name)) {
        const lh = new DataView(await file.slice(lhOff, lhOff + 30).arrayBuffer());
        const dataStart = lhOff + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
        const comp = file.slice(dataStart, dataStart + compSize);
        if (method === 0) return comp.stream();
        if (method === 8) return comp.stream().pipeThrough(new DecompressionStream('deflate-raw'));
        throw new Error('Unsupported zip compression');
      }
      p += 46 + nameLen + extraLen + cmtLen;
    }
    throw new Error('export.xml not found in that zip');
  }

        if (r.addedExercises) parts.push(`${r.addedExercises} ${r.addedExercises === 1 ? tr('workout') : tr('workouts')}`);
        let msg = `${tr('Imported')} ${parts.join(', ')}`;
        // a very large history is trimmed to what this phone can store — say so
        if (r.trimmedDays) msg += ` · ${tr('kept your most recent history from')} ${r.oldestKept}`;
        toast(msg);
      } catch (err) {
        render();
        toast(err && err.message === "That doesn't look like a zip file"
          ? tr("Couldn't read that export — pick the .zip or a .csv from MyFitnessPal or Cronometer")
          : (err && err.message ? tr(err.message) : tr("Couldn't read that export — pick the .zip or a .csv from MyFitnessPal or Cronometer")));
      }
    });
    $('#st-export')?.addEventListener('click', () => {
      const stamped = Core.markExported(state, Core.todayISO()); // stamp travels inside the export too
      if (!saveFile('fuelring-export.json', 'application/json', Core.serialize(stamped))) return toast(tr('Not supported in this browser'));
      state = stamped; save(); toast(tr('Exported'));
    });
    const postToWrapper = msg => window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(msg));
    $('#proOpen')?.addEventListener('click', openPro);
    $('#st-install')?.addEventListener('click', installNow);
    $('#tipInstall')?.addEventListener('click', installNow);
    $('#tipClose')?.addEventListener('click', () => { try { localStorage.setItem(TIP_KEY, '1'); } catch (e) { /* storage blocked */ } render(); });
    // instant feedback: the store sheet can take a beat to appear, and a tap
    // that shows nothing gets tapped again (or reported as broken)
    $('#proBuy')?.addEventListener('click', () => { toast(tr('Opening the App Store…')); postToWrapper({ type: 'purchasePro' }); });
    const restore = () => { toast(tr('Checking your purchases…'), 3000); postToWrapper({ type: 'restorePurchases' }); };
    $('#proRestore')?.addEventListener('click', restore);
    $('#proRestore2')?.addEventListener('click', restore);
    $('#ah-connect')?.addEventListener('click', () => {
      if (!isPro()) return openPro();
      healthAsked = true; // the wrapper asks for Health access here, in context, then syncs
      postToWrapper({ type: 'connectHealth' });
    });
    $('#st-theme')?.addEventListener('change', e => set(Core.setTheme(state, e.target.value)));
    $('#st-water')?.addEventListener('change', e => { set(Core.setWaterGoal(state, e.target.value)); toast(tr('Water goal updated')); });
    $('#st-lang')?.addEventListener('change', e => set(Core.setLang(state, e.target.value)));
    $('#st-units')?.addEventListener('change', e => set(Core.setUnits(state, e.target.value)));
    // goals by day: chips toggle in place, the note follows live
    const pickedDays = () => [...document.querySelectorAll('[data-dayhigh].on')].map(b => +b.dataset.dayhigh);
    const dayNoteRefresh = () => { if ($('#dayGoalsNote')) $('#dayGoalsNote').innerHTML = dayGoalsNote(pickedDays(), +$('#st-boost').value); };
    document.querySelectorAll('[data-dayhigh]').forEach(b => b.addEventListener('click', () => {
      b.classList.toggle('on'); b.setAttribute('aria-pressed', String(b.classList.contains('on'))); dayNoteRefresh();
    }));
    $('#st-boost')?.addEventListener('change', dayNoteRefresh);
    $('#dayGoalsLocked')?.addEventListener('click', openPro);
    // % <-> grams: toggled in place (no re-render) so edits elsewhere in the form survive
    document.querySelectorAll('[data-macromode]').forEach(b => b.addEventListener('click', () => {
      const grams = b.dataset.macromode === 'grams';
      if (grams && !isPro() && $('#macroGrams').hidden) return openPro();
      $('#macroGrams').hidden = !grams; $('#macroPct').hidden = grams;
      document.querySelectorAll('[data-macromode]').forEach(x => x.classList.toggle('on', x === b));
    }));
    ['#st-gc', '#st-gp', '#st-gf'].forEach(id => $(id)?.addEventListener('input', () => {
      $('#gramsNote').innerHTML = gramsNote({ carbs: +$('#st-gc').value || 0, protein: +$('#st-gp').value || 0, fat: +$('#st-gf').value || 0 }, state.goals.calories);
    }));
    $('#st-hx')?.addEventListener('change', e => set(Core.setHealthExercise(state, e.target.checked)));
    $('#trackerGuide')?.addEventListener('toggle', e => { ui.trackerGuideOpen = e.target.open; });
    // reminders (iPhone app): on/off, times (changing a time turns it on), the Pro fast alert
    document.querySelectorAll('[data-rem]').forEach(b => b.addEventListener('change', e =>
      set(Core.setReminder(state, b.dataset.rem, { on: e.target.checked }))));
    document.querySelectorAll('[data-remat]').forEach(b => b.addEventListener('change', e => {
      if (e.target.value) set(Core.setReminder(state, b.dataset.remat, { at: e.target.value, on: true }));
    }));
    const fastAlert = e => { if (!isPro()) { e.target.checked = false; return openPro(); } set(Core.setReminder(state, 'fastEnd', e.target.checked)); };
    $('#remFast')?.addEventListener('change', fastAlert);
    $('#fastNotify')?.addEventListener('change', fastAlert);
    $('#widgetLocked')?.addEventListener('click', openPro);
    // color theme and app icon (Pro; Classic is always there to go back to)
    document.querySelectorAll('[data-acc]').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.acc !== 'classic' && !isPro()) return openPro();
      set(Core.setAccent(state, b.dataset.acc));
    }));
    document.querySelectorAll('[data-appicon]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.appicon;
      if (k !== 'classic' && !isPro()) return openPro();
      toWrapper({ type: 'appIcon', name: k === 'classic' ? null : k[0].toUpperCase() + k.slice(1) });
    }));
    $('#st-netcarbs')?.addEventListener('change', e => {
      if (!isPro()) { e.target.checked = false; return openPro(); }
      set(Core.setNetCarbs(state, e.target.checked));
    });
    $('#st-csv')?.addEventListener('click', () => {
      if (!isPro()) return openPro();
      // BOM so Excel reads it as UTF-8 (otherwise "Plátano" arrives mangled)
      if (!saveFile('fuelring-diary.csv', 'text/csv;charset=utf-8', '\ufeff' + Core.diaryCSV(state))) return toast(tr('Not supported in this browser'));
      toast(tr('Diary exported as CSV'));
    });
    $('#st-online')?.addEventListener('change', e => {
      set(Core.setOnlineLookup(state, e.target.checked));
      toast(e.target.checked ? tr('Online barcode lookup on') : tr('Fully offline — lookup off'));
    });
    $('#st-import')?.addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) restoreFrom(f, true); });
    $('#st-reset')?.addEventListener('click', () => {
      if (confirm(tr('Erase all FuelRing data on this machine? This cannot be undone.'))) {
        localStorage.removeItem(KEY); state = Core.newState(); ui = { tab:'diary', date: Core.todayISO(), modal:null, modalTab:'search', selFood:null, servings:1, query:'', scanBarcode:null, scanPrefill:null, nutritionOpen:false, range:'week', editFoodId:null }; render();
      }
    });
  }

  render();
  if (Core.needsBackupNudge(state, Core.todayISO(), WEB ? 14 : 30)) toast(tr('Backup overdue — Settings → Back up my data'));
  keepStorage(); // web: ask the browser to keep the diary (a returning visitor with a profile)
  // test hooks
  return { get state() { return state; }, reinit() { state = load(); render(); }, render, _ui: ui };
})();
window.__app = App;
</script>
</body>
</html>
