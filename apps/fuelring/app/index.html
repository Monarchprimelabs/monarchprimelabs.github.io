<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --navy:#002850; --ink:#0A1B2E; --blue:#0078C8; --orange:#F07800;
    --bg:#EEF2F6; --card:#FFFFFF; --line:#DDE5EC; --mut:#5B7186;
    --green:#1B9E4B; --red:#D8433B;
    --viol:#7C4DBE; /* fat ring — brand navy is too dark to read as a data mark */
    --deep:#283593; /* deep-sleep stage: darkest of the stage colors in both themes */
    --field:#FFFFFF; /* input/tile surfaces that sit on cards */
    --chrome1:#002850; --chrome2:#003C74; /* app chrome (header, toast); color themes swap these only */
  }
  /* color themes (Pro): chrome only — data marks keep their meaning */
  :root[data-accent="midnight"]{--chrome1:#0B0F14;--chrome2:#1E2733}
  :root[data-accent="forest"]{--chrome1:#0E3B2C;--chrome2:#17583F}
  :root[data-accent="berry"]{--chrome1:#3A1442;--chrome2:#5B1F63}
  /* dark theme — set by applyTheme(); brand chrome (header, primary buttons)
     stays constant, text/surfaces/data-marks flip. Mark colors validated for
     the dark surface (lightness band, chroma, CVD, contrast). */
  :root[data-theme="dark"]{
    --navy:#DFEAF5; --ink:#E7EEF5; --blue:#2E8FD6; --orange:#CE7300;
    --bg:#0B1826; --card:#132539; --line:#26425F; --mut:#93A9BF;
    --green:#2FA45C; --red:#E4574D;
    --viol:#9578E0;
    --deep:#7986CB;
    --field:#0F2033;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow-x:hidden}
  body{
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; justify-content:center;
  }
  #app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  main{flex:1;padding:0 14px calc(84px + env(safe-area-inset-bottom))}

  /* header */
  header{background:linear-gradient(160deg,var(--chrome1) 0%,var(--chrome2) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 18px 18px}
  .brand{display:flex;align-items:baseline;justify-content:space-between}
  .brand h1{font-size:17px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .brand h1 em{color:#F07800;font-style:normal}
  .datebar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
  .datebar button{background:rgba(255,255,255,.14);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
  .datebar .dlabel{font-weight:700;min-width:150px;text-align:center}

  /* signature: calorie equation */
  .equation{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:2px}
  .eq-part{text-align:center;flex:1}
  .eq-part .n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .eq-part .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-top:1px}
  .eq-op{font-size:16px;opacity:.6;padding:0 1px}
  .eq-remaining .n{font-size:26px;color:#FF8A1E}
  .eq-remaining.over .n{color:#FF6B61}
  .goalbar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:12px;overflow:hidden}
  .goalbar i{display:block;height:100%;background:#F07800;border-radius:3px;transition:width .3s}
  .goalbar i.over{background:#FF6B61}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .card-h{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
  .card-h h2{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
  .card-h .kcal{font-weight:700;color:var(--mut);font-size:13px}
  .entry{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
  .entry:last-of-type{border-bottom:0}
  .entry .en{font-weight:600;font-size:14px}
  .entry .es{font-size:12px;color:var(--mut)}
  .entry .ecal{font-weight:700;font-variant-numeric:tabular-nums}
  .entry .del{background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer;padding:4px}
  .addrow{display:block;width:100%;padding:11px 14px;background:none;border:0;color:var(--blue);font-weight:700;font-size:14px;text-align:left;cursor:pointer}
  .mealrow{display:flex;align-items:center}
  .mealrow .addrow{width:auto;flex:1}
  .mealrow .tool{flex:0 0 auto;color:var(--mut);font-weight:600;font-size:13px;text-align:right}
  .empty-meal{padding:10px 14px;color:var(--mut);font-size:13px}
  .entry.tapme{cursor:pointer}
  .entry.tapme:active{background:var(--field)}
  .entry.tapme .en::after{content:'›';color:var(--mut);font-weight:700;margin-left:6px;opacity:.55}
  .entry.tapme:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .mmac{display:flex;gap:14px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
  .mmac b{color:var(--ink);font-weight:700}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
  .mrow:last-of-type{border-bottom:0}
  .mrow.on{background:var(--field)}
  .mrow .ml{font-weight:600;font-size:14px}
  .mrow .mv{font-weight:800;font-size:15px;color:var(--navy)}
  .mrow .mc{font-size:12px;font-weight:700;color:var(--mut)}

  /* ring gauges */
  .ring circle{transition:stroke-dasharray .4s}
  .ring .ring-n{font-weight:800;fill:var(--navy);font-variant-numeric:tabular-nums}
  .ring .ring-s{font-size:10px;fill:var(--mut)}
  .ring-big .ring-n{font-size:24px}
  .ring-sm .ring-n{font-size:15px}
  .ring-mini .ring-n{font-size:13px}
  .ringcell{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
  .ringcell .rl{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ringcell .rv{font-size:12px;font-variant-numeric:tabular-nums;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ringcell .rv b{color:var(--navy)}
  .ringcell .rv.over b{color:var(--red)}

  /* macros dashboard */
  .dash{display:flex;align-items:center;gap:12px;padding:14px}
  .dash-macros{display:flex;flex:1;gap:6px;min-width:0}
  /* the macro rings shrink only when the row runs out of room (375 pt phones, Display Zoom) */
  .dash-macros .ring{width:100%;max-width:66px;height:auto}
  /* 320 pt (Display Zoom on a small iPhone): tighten what doesn't fit */
  @media (max-width:340px){.dash{gap:6px;padding:12px 8px}.dash .ring-big{width:86px;height:86px}.dash-macros{gap:3px}
    .dash-macros .rl{font-size:10px;letter-spacing:0}.dash-macros .rv{font-size:11px}
    .stat-row .bignum{font-size:24px}.mealrow .tool{padding-left:6px;padding-right:8px}}

  /* micronutrients */
  .nut-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 14px;background:none;border:0;border-top:1px solid var(--line);color:var(--navy);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .nut-toggle .car{color:var(--mut);font-size:11px;transition:transform .2s}
  .nut-toggle[aria-expanded="true"] .car{transform:rotate(180deg)}
  .nutrings{display:flex;gap:4px;padding:4px 10px 14px}
  .nutring{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
  .nutring .nl{font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .nutring .nv{font-size:11px;font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .nutring .nv b{color:var(--navy)}
  .nutring .nv.over b{color:var(--red)}

  /* tabs */
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;padding:10px 0 12px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);cursor:pointer}
  nav button.on{color:var(--orange)}
  .navplus{flex:0 0 64px;background:none;border:0;position:relative;cursor:pointer;padding:0}
  .navplus span{position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:54px;height:54px;
    border-radius:50%;background:linear-gradient(160deg,#FF8A1E,#E06A00);color:#fff;font-size:30px;
    font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(240,120,0,.45);border:3px solid var(--card)}
  .navplus:active span{transform:translateX(-50%) scale(.93)}
  .wbdots{display:flex;gap:5px}
  .wbd{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;color:var(--mut);background:var(--bg);border:1.5px solid var(--line)}
  .wbd.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .wbd.now{border-color:var(--orange);color:var(--orange)}
  .wbd.fut{opacity:.45}
  .pro-cta{position:sticky;bottom:0;background:var(--bg);padding:10px 0 2px;margin-top:4px}
  .daypick{gap:6px;justify-content:space-between;margin-top:2px}
  .daypick .wbd{width:36px;height:36px;font-size:12px;cursor:pointer}
  .nrow .ml{flex:0 0 92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nrow .nbar{flex:1;min-width:40px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .nrow .nbar i{display:block;height:100%;border-radius:3px}
  .nrow .mv{flex:0 0 124px;text-align:right;white-space:nowrap}
  .nrow .mv small{font-weight:600;font-size:12px;color:var(--mut)}
  .nrow .mv.over{color:var(--red)}
  .msplit{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);flex:1}
  .msplit i{display:block;height:100%}
  .msplit-row{display:flex;align-items:center;gap:10px;padding:4px 14px}
  .msplit-row .rl{width:44px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
  .qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .qa-tile{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:14px 4px 11px;
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit;color:var(--ink)}
  .qa-tile:active{background:var(--line)}
  .qa-tile .qi{font-size:24px;line-height:1}
  .qa-tile .ql{font-size:12px;font-weight:700;text-align:center}
  nav button .ic{display:block;font-size:20px;margin-bottom:2px}

  /* forms */
  .field{margin-top:12px}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
  /* 16px minimum on form controls: below that, iOS auto-zooms on focus and
     leaves the page zoomed + horizontally pannable */
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--field);color:var(--ink)}
  .field input:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
  .row2{display:flex;gap:10px}.row2>.field{flex:1}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:#F07800;color:#fff;font-size:15px;font-weight:800;letter-spacing:.03em;cursor:pointer;margin-top:16px}
  .btn.sec{background:#113C66}
  .btn.ghost{background:none;color:var(--red);font-weight:700}
  .hint{font-size:12px;color:var(--mut);margin-top:6px}
  .sect{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 4px 0}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;cursor:pointer}
  .guide{margin-top:12px;font-size:12px;color:var(--mut)}
  .stagebar{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin-top:12px}
  .stagebar span{display:block;min-width:3px}
  .stagelegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--mut)}
  .stagelegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .sleepstrip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:0;cursor:pointer;font:inherit;color:var(--ink)}
  .guide summary{font-size:13px;font-weight:800;color:var(--blue);cursor:pointer}
  .guide ul{margin:6px 0 0;padding-left:18px}
  .guide li{margin:5px 0}
  .guide b{color:var(--ink)}
  .checkline input{width:16px;height:16px;accent-color:var(--orange)}
  /* first-run tour */
  .tour{position:fixed;inset:0;background:rgba(4,12,22,.72);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
  .tour-card{background:var(--card);border-radius:16px;padding:22px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4)}
  .tour-card .tic{font-size:38px}
  .tour-card h3{color:var(--navy);font-size:17px;margin:8px 0 6px}
  .tour-card p{color:var(--mut);font-size:14px;line-height:1.5}
  .tour-dots{display:flex;justify-content:center;gap:6px;margin:14px 0 2px}
  .tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .tour-dots i.on{background:var(--orange)}
  .tour-skip{background:none;border:0;color:var(--mut);font-size:13px;margin-top:10px;cursor:pointer}
  .coach{padding:11px 14px;font-size:13px;line-height:1.5;border-left:4px solid var(--blue);color:var(--ink);font-family:inherit}
  .coach-push{border-left-color:var(--orange)}
  .coach-warn{border-left-color:var(--red)}
  .coach-good{border-left-color:var(--green)}

  /* onboarding */
  .onb{padding:calc(26px + env(safe-area-inset-top)) 20px 26px}
  .onb h1{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
  .onb h1 em{color:#F07800;font-style:normal}
  .onb p{color:var(--mut);margin-top:6px}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(10,27,46,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
  .sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);border-radius:18px 18px 0 0}
  .sheet-h h3{font-size:15px;font-weight:800;color:var(--navy)}
  .sheet-h button{background:none;border:0;font-size:22px;color:var(--mut);cursor:pointer}
  .sheet-b{overflow-y:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
  .seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}
  .seg button.on{background:var(--field);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .search input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--field);color:var(--ink)}
  .fresult{display:flex;justify-content:space-between;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
  .fresult:hover{border-color:var(--blue)}
  .fresult .fn{font-weight:600;font-size:14px}
  .fresult .fs{font-size:12px;color:var(--mut)}
  .fresult .fc{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px}
  .stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--field);font-size:20px;cursor:pointer;color:var(--navy)}
  .stepper input{width:72px;text-align:center;font-size:20px;font-weight:800;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--field);color:var(--navy)}
  /* barcode scanner */
  .scanbox video{display:none;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#000;margin-bottom:10px}
  .selfood{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px}
  .selfood .fn{font-weight:800;color:var(--navy)}
  .macro-preview{display:flex;justify-content:space-around;margin-top:10px;font-size:13px;color:var(--mut)}
  .macro-preview b{color:var(--ink)}

  /* progress */
  .chart-wrap{padding:14px}
  .bignum{font-size:30px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .stat-row{display:flex;text-align:center;padding:14px}
  .stat-row>div{flex:1}
  .stat-row .sl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}

  .swatches{display:flex;flex-wrap:wrap;gap:8px}

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>
<script>
// ===== CORE (pure logic, no DOM) =====
const Core = (() => {
  const LB_PER_KG = 2.20462;
  const ACTIVITY = { sedentary: 1.2, light: 1.375, active: 1.55, very: 1.725 };
  const MACRO_SPLIT = { carbs: 0.5, protein: 0.2, fat: 0.3 }; // MFP default

  // Mifflin-St Jeor. weightLbs, heightIn, age, sex: 'male'|'female'
  function bmr(p) {
    const kg = p.weightLbs / LB_PER_KG;
    const cm = p.heightIn * 2.54;
    const base = 10 * kg + 6.25 * cm - 5 * p.age;
    return base + (p.sex === 'male' ? 5 : -161);
  }

  function tdee(p) {
    return bmr(p) * (ACTIVITY[p.activity] || 1.2);
  }

  // rateLbsPerWeek: negative = lose (e.g. -1), positive = gain.
  // profile.tdeeOverride (set from the adaptive-TDEE card, Pro) replaces the
  // formula estimate with the user's measured burn; every recalc path flows
  // through here, so the override survives weight check-ins and profile edits
  // until the user clears it.
  function calorieGoal(p) {
    const base = Number.isFinite(p.tdeeOverride) ? p.tdeeOverride : tdee(p);
    let goal = base + 500 * p.rateLbsPerWeek;
    const floor = p.sex === 'male' ? 1500 : 1200;
    goal = Math.max(goal, floor);
    return Math.round(goal / 10) * 10;
  }

  // split: {carbs, protein, fat} percentages summing to 100 (profile.macroSplit)
  function macroGoals(calories, split) {
    const pct = split || { carbs: MACRO_SPLIT.carbs * 100, protein: MACRO_SPLIT.protein * 100, fat: MACRO_SPLIT.fat * 100 };
    return {
      carbs: Math.round((calories * pct.carbs / 100) / 4),
      protein: Math.round((calories * pct.protein / 100) / 4),
      fat: Math.round((calories * pct.fat / 100) / 9),
    };
  }

  function validMacroSplit(split) {
    return !!split && [split.carbs, split.protein, split.fat].every(n => Number.isFinite(n) && n >= 0) &&
      split.carbs + split.protein + split.fat === 100;
  }

  // Fixed gram targets (profile.macroGrams) — the alternative to a % split for
  // people who think "160 g protein", not "20%". Grams don't move when the
  // calorie goal does (a weigh-in shouldn't silently cut your protein), so
  // they can disagree with the calorie goal; macroGramsCal lets the UI say so.
  function validMacroGrams(g) {
    return !!g && [g.carbs, g.protein, g.fat].every(n => Number.isFinite(n) && n >= 0 && n <= 1000) &&
      g.carbs + g.protein + g.fat > 0;
  }
  function macroGramsCal(g) {
    return Math.round(g.carbs * 4 + g.protein * 4 + g.fat * 9);
  }

  // single source of truth for goal recalculation from a profile
  function goalsFor(profile) {
    const cal = calorieGoal(profile);
    if (validMacroGrams(profile.macroGrams)) {
      const g = profile.macroGrams;
      return { calories: cal, carbs: Math.round(g.carbs), protein: Math.round(g.protein), fat: Math.round(g.fat) };
    }
    return { calories: cal, ...macroGoals(cal, profile.macroSplit) };
  }

  // ----- calorie goals by day of week (Pro) -----
  // profile.dayShift = {days: weekday numbers (Sunday = 0), boost: kcal}. The
  // chosen days get `boost` more and the other days give the same total back,
  // so the WEEK's calories — and with them the rate of loss — never change.
  // No day drops under the 1,200 / 1,500 floor: when the base goal sits close
  // to it the shift shrinks to fit, re-checked on every read because weigh-ins
  // move the base. Numbers are rounded to 10 kcal (a few kcal a week of drift).
  function validDayShift(sh) {
    return !!sh && Array.isArray(sh.days) && sh.days.length >= 1 && sh.days.length <= 6 &&
      new Set(sh.days).size === sh.days.length && sh.days.every(d => Number.isInteger(d) && d >= 0 && d <= 6) &&
      Number.isFinite(sh.boost) && sh.boost > 0 && sh.boost <= 1000;
  }
  // {days, high, low, boost, cut, capped} for today's base goal, or null when
  // there's no (effective) shift
  function dayShiftPlan(state) {
    const p = state.profile, g = state.goals;
    if (!p || !g || !validDayShift(p.dayShift)) return null;
    const h = p.dayShift.days.length, l = 7 - h;
    const floor = p.sex === 'male' ? 1500 : 1200;
    const want = Math.round(p.dayShift.boost * h / l / 10) * 10;
    const cut = Math.max(0, Math.min(want, Math.floor((g.calories - floor) / 10) * 10));
    if (!cut) return null;
    const boost = Math.round(cut * l / h / 10) * 10;
    return { days: p.dayShift.days.slice().sort((a, b) => a - b), high: g.calories + boost, low: g.calories - cut, boost, cut, capped: cut < want };
  }
  // the goals for one date: the base goals, or that weekday's shifted calories
  // (macros follow the calories under a % split; gram targets stay fixed)
  function goalsForDate(state, date) {
    const g = state.goals;
    if (!g) return null;
    const plan = dayShiftPlan(state);
    if (!plan) return { ...g };
    const high = plan.days.includes(new Date(date + 'T12:00:00').getDay());
    const calories = high ? plan.high : plan.low;
    const p = state.profile;
    const macros = validMacroGrams(p.macroGrams)
      ? { carbs: g.carbs, protein: g.protein, fat: g.fat } : macroGoals(calories, p.macroSplit);
    return { calories, ...macros, shift: high ? 'high' : 'low' };
  }

  // Micronutrients tracked per food. fib/sug/sat in grams, sod/chol in mg.
  // Fiber is a "reach" target; the rest are daily limits.
  const MICROS = ['fib', 'sug', 'sod', 'sat', 'chol'];

  // Daily targets from standard US guidance, age/sex-aware:
  // fiber per IOM (38/25 g under 51, 30/21 g at 51+), sugar per AHA added-sugar
  // caps (36/25 g), sodium 2300 mg (AHA-ideal 1500 mg at 51+), saturated fat
  // <10% of calories, cholesterol 300 mg.
  function microTargets(profile, calories) {
    const male = profile.sex === 'male', over50 = profile.age > 50;
    return {
      fib: male ? (over50 ? 30 : 38) : (over50 ? 21 : 25),
      sug: male ? 36 : 25,
      sod: over50 ? 1500 : 2300,
      sat: Math.round((calories * 0.10) / 9),
      chol: 300,
    };
  }

  // ----- state -----
  function newState() {
    return {
      version: 7,
      profile: null, // {sex, age, heightIn, weightLbs, activity, rateLbsPerWeek, goalWeightLbs, macroSplit?}
      goals: null,   // {calories, carbs, protein, fat}
      customFoods: [],
      recents: [],   // food ids, most recent first
      diary: {},     // dateISO -> {meals:{breakfast:[],lunch:[],dinner:[],snacks:[]}, exercise:[]}
      weights: [],   // [{date, lbs}] sorted asc by date
      savedMeals: [],   // [{id, name, items:[diary-entry-shaped, no entryId]}]  (v2)
      steps: {},        // dateISO -> count, from Apple Health import           (v2)
      lastExportAt: null, // dateISO of last JSON export, for the backup nudge  (v2)
      water: {},        // dateISO -> cups                                      (v3)
      waterGoal: 8,     // daily cups target (additive pref, defaulted in deserialize)
      burn: {},         // dateISO -> active kcal (Move ring; earns exercise beyond the activity level — healthExercise) (v4)
      body: [],         // [{date, waist?, chest?, hips?, arm?, thigh?, neck?, bodyFat?}] (v5)
      fasts: [],        // completed fasts [{start, end, target}] (epoch ms, hours)  (v6)
      fast: null,       // the running fast {start, target} or null                 (v6)
      workouts: [],     // Apple Health workouts [{id, date, start, end, type, minutes, kcal, source}] (v7)
      sleep: {},        // dateISO (wake day) -> {minutes, nap, start, end, source, deep, rem, core, awake}  (v7)
      onlineLookup: true, // opt-out Open Food Facts lookup for unknown barcodes
      theme: 'auto',      // 'auto' | 'light' | 'dark'
      netCarbs: false,    // show carbs minus fiber on the dashboard
      healthExercise: true, // Apple Health activity beyond the activity level counts as exercise (additive pref)
      activityReview: false, // ask once to re-pick the activity level (set for v6 users, see deserialize)
      pro: false,         // entitlement cache, wrapper-injected (see setPro)
      tourDone: false,    // first-run guided tour dismissed
      lang: 'en',         // UI language: 'en' | 'es' (additive pref)
      units: 'imperial',  // display units: 'imperial' (lb/in) | 'metric' (kg/cm) (additive pref)
      accent: 'classic',  // color theme for the app chrome, Pro (additive pref, see ACCENTS)
      reminders: defaultReminders(), // local notifications the iPhone app schedules (additive pref)
    };
  }

  function completeOnboarding(state, profile) {
    const s = clone(state);
    s.profile = { ...profile };
    s.goals = goalsFor(s.profile);
    if (!s.weights.some(w => w.date === profile.startDate)) {
      s.weights.push({ date: profile.startDate, lbs: profile.weightLbs });
      s.weights.sort((a, b) => a.date.localeCompare(b.date));
    }
    return s;
  }

  function day(state, date) {
    return state.diary[date] || { meals: { breakfast: [], lunch: [], dinner: [], snacks: [] }, exercise: [] };
  }

  function ensureDay(s, date) {
    if (!s.diary[date]) s.diary[date] = { meals: { breakfast: [], lunch: [], dinner: [], snacks: [] }, exercise: [] };
    return s.diary[date];
  }

  // food: {id, name, serving, cal, c, p, f, fib?, sug?, sod?, sat?, chol?}; servings: number
  // word-level Spanish for serving descriptions ('1 cup (158g)' -> '1 taza (158g)').
  // Coverage of every word used in seed servings is test-enforced.
  const SERVING_ES = {
    apple: 'manzana', avocado: 'aguacate', bagel: 'bagel', banana: 'plátano', bar: 'barra',
    bars: 'barras', biscuit: 'panecillo', bottle: 'botella', bowl: 'tazón', breast: 'pechuga',
    burger: 'hamburguesa', burrito: 'burrito', cake: 'pastel', can: 'lata', chips: 'chips',
    chopped: 'picada', chunks: 'en trozos', container: 'envase', cookie: 'galleta', cookies: 'galletas',
    corn: 'corn', cup: 'taza', cups: 'tazas', dates: 'dátiles', diced: 'en cubos', dog: 'dog',
    donut: 'dona', drumstick: 'pierna', dry: 'seco', egg: 'huevo', eggs: 'huevos', fl: 'fl',
    frank: 'salchicha', fruit: 'fruta', hot: 'hot', leg: 'pierna', link: 'salchicha', links: 'salchichas',
    meatballs: 'albóndigas', medium: 'mediano', ml: 'ml', muffin: 'muffin', olives: 'aceitunas',
    orange: 'naranja', oz: 'oz', pack: 'paquete', packet: 'sobre', pancakes: 'panqueques',
    parfait: 'parfait', patty: 'pieza', peach: 'durazno', pear: 'pera', piece: 'pieza',
    pieces: 'piezas', pita: 'pita', plum: 'ciruela', pouch: 'bolsita', quesadilla: 'quesadilla',
    roll: 'rollo', sandwich: 'sándwich', scoop: 'medida', serving: 'porción', slice: 'rebanada',
    sliced: 'en rebanadas', slices: 'rebanadas', spear: 'pieza', square: 'cuadrito', stalks: 'tallos',
    stick: 'barrita', sticks: 'barritas', taco: 'taco', tbsp: 'cda', tenders: 'tiras',
    tortilla: 'tortilla', tortillas: 'tortillas', tsp: 'cdta', waffles: 'waffles', wings: 'alitas',
  };
  function servingEs(serving) {
    return String(serving).split(' ').map(w => {
      const m = w.match(/^([^A-Za-z]*)([A-Za-z]+)([^A-Za-z]*)$/);
      if (!m) return w;
      const t = SERVING_ES[m[2].toLowerCase()];
      return t ? m[1] + t + m[3] : w;
    }).join(' ');
  }

  function setLang(state, lang) {
    const s = clone(state);
    s.lang = lang === 'es' ? 'es' : 'en';
    return s;
  }

  // ----- display units -----
  // Storage is imperial forever (weightLbs, heightIn, {date, lbs}, body inches):
  // every formula, backup and import already speaks it, so metric is purely a
  // display/input layer — no schema change, and toggling is lossless.
  const UNITS = ['imperial', 'metric'];
  const CM_PER_IN = 2.54;
  function setUnits(state, units) {
    const s = clone(state);
    s.units = units === 'metric' ? 'metric' : 'imperial';
    return s;
  }
  // first-run default from a BCP-47 locale: only the US (plus Liberia and
  // Myanmar) weighs in pounds; no region tag at all stays imperial
  function defaultUnits(locale) {
    const m = String(locale || '').match(/^[a-z]{2,3}[-_](?:[a-z]{4}[-_])?([a-z]{2}|\d{3})\b/i);
    if (!m) return 'imperial';
    return ['US', 'LR', 'MM'].includes(m[1].toUpperCase()) ? 'imperial' : 'metric';
  }
  const isMetric = state => state.units === 'metric';
  function unitLabels(state) {
    return isMetric(state) ? { weight: 'kg', length: 'cm' } : { weight: 'lb', length: 'in' };
  }
  // lbs -> display number (1 decimal). Works for deltas and rates too (no offset).
  function toDisplayWeight(state, lbs) {
    return round1(isMetric(state) ? lbs / LB_PER_KG : lbs);
  }
  // display number -> lbs. Kept to 2 decimals so 70 kg round-trips to 70.0.
  function fromDisplayWeight(state, v) {
    const n = +v;
    return isMetric(state) ? Math.round(n * LB_PER_KG * 100) / 100 : n;
  }
  function toDisplayLength(state, inches) {
    return round1(isMetric(state) ? inches * CM_PER_IN : inches);
  }
  function fromDisplayLength(state, v) {
    const n = +v;
    return isMetric(state) ? Math.round(n / CM_PER_IN * 100) / 100 : n;
  }
  // height for the inputs: whole cm, or whole ft + in (rounded first so a
  // metric-entered 175 cm = 68.9 in shows as 5' 9", never 5' 8.9")
  function heightParts(state, heightIn) {
    if (isMetric(state)) return { cm: Math.round(heightIn * CM_PER_IN) };
    const total = Math.round(heightIn);
    return { ft: Math.floor(total / 12), in: total % 12 };
  }
  // protein per unit bodyweight, in the active unit (g/lb or g/kg)
  function proteinPerBodyweight(state, proteinG, weightLbs) {
    return proteinG / (isMetric(state) ? weightLbs / LB_PER_KG : weightLbs);
  }

  // display name/serving for the active language; entries are denormalized in
  // the language they were logged in, which is what the user actually picked
  function foodName(state, food) {
    return state.lang === 'es' ? (food.es || food.name) : food.name;
  }
  function foodServing(state, food) {
    return state.lang === 'es' ? servingEs(food.serving) : food.serving;
  }

  // ----- serving units -----
  // Every seed serving states its size: "1 banana (118g)", "1/2 cup (40g)",
  // "12 fl oz (355ml)", "4 oz (113g)". Reading that text gives a food's weight
  // and/or volume per serving, which is all it takes to log it in grams, ounces,
  // cups or spoons. Every conversion is anchored to the food's own serving, so
  // no density is ever guessed (coverage over the whole seed DB is test-enforced).
  const G_PER_OZ = 28.3495;
  const ML_PER = { ml: 1, floz: 29.5735, cup: 236.588, tbsp: 14.7868, tsp: 4.92892 };
  const UNIT_KEYS = ['g', 'oz', 'ml', 'floz', 'cup', 'tbsp', 'tsp'];
  const UNIT_LABELS = {
    en: { g: 'g', oz: 'oz', ml: 'ml', floz: 'fl oz', cup: ['cup', 'cups'], tbsp: 'tbsp', tsp: 'tsp' },
    es: { g: 'g', oz: 'oz', ml: 'ml', floz: 'fl oz', cup: ['taza', 'tazas'], tbsp: 'cda', tsp: 'cdta' },
  };
  const parseQty = t => { const m = String(t).match(/^(\d+(?:\.\d+)?)(?:\/(\d+))?$/); return m ? (m[2] ? +m[1] / +m[2] : +m[1]) : NaN; };
  // {g?, ml?} per serving. An explicit "(118g)" / "(355ml)" / "(12 fl oz)" wins
  // over the leading amount ("4 oz", "1/2 cup"), which fills whatever is missing.
  function servingSize(serving) {
    const s = String(serving || '').toLowerCase();
    const out = {};
    const pg = s.match(/\((\d+(?:\.\d+)?)\s*g\b[^)]*\)/);
    if (pg && +pg[1] > 0) out.g = +pg[1];
    const pml = s.match(/\((\d+(?:\.\d+)?)\s*ml\)/);
    if (pml && +pml[1] > 0) out.ml = +pml[1];
    const pfl = s.match(/\((\d+(?:\.\d+)?)\s*fl oz\)/);
    if (pfl && +pfl[1] > 0 && out.ml == null) out.ml = +pfl[1] * ML_PER.floz;
    const lead = s.match(/^(\d+(?:\.\d+)?(?:\/\d+)?)\s*(fl oz|oz|g|ml|cups?|tbsp|tsp)\b/);
    if (lead) {
      const n = parseQty(lead[1]), u = lead[2];
      if (n > 0) {
        if (u === 'oz' || u === 'g') { if (out.g == null) out.g = u === 'oz' ? n * G_PER_OZ : n; }
        else if (out.ml == null) out.ml = n * ML_PER[u === 'fl oz' ? 'floz' : u.startsWith('cup') ? 'cup' : u];
      }
    }
    return out;
  }
  function unitLabel(lang, key, amount) {
    const l = (UNIT_LABELS[lang] || UNIT_LABELS.en)[key];
    return Array.isArray(l) ? (amount === 1 ? l[0] : l[1]) : l;
  }
  // [{key, per}]: per = how many of the food's own servings one unit holds.
  // 'serving' (the food's own) is always first; then weight, then volume, with
  // g/ml leading for metric users. Spoons only where they make sense: tbsp for
  // servings up to about a cup, tsp up to about a quarter cup.
  function servingUnits(state, food) {
    const sz = servingSize(food && food.serving);
    const metric = state && state.units === 'metric';
    const out = [{ key: 'serving', per: 1 }];
    if (sz.g > 0) {
      const mass = [{ key: 'g', per: 1 / sz.g }, { key: 'oz', per: G_PER_OZ / sz.g }];
      out.push(...(metric ? mass : mass.reverse()));
    }
    if (sz.ml > 0) {
      const v = k => ({ key: k, per: ML_PER[k] / sz.ml });
      const vol = metric ? [v('ml'), v('cup')] : [v('cup'), v('floz')];
      if (sz.ml <= 250) vol.push(v('tbsp'));
      if (sz.ml <= 60) vol.push(v('tsp'));
      vol.push(metric ? v('floz') : v('ml'));
      out.push(...vol);
    }
    return out;
  }
  function unitPer(state, food, unit) {
    if (!unit || unit === 'serving') return 1;
    const u = servingUnits(state, food).find(x => x.key === unit);
    return u ? u.per : null;
  }
  // nutrition for `amount` of `unit` of a food (null when the food can't be
  // measured that way). The one place a portion is computed — logging, the
  // add-food preview and entry edits all go through it.
  function portion(state, food, amount, unit) {
    const per = unitPer(state, food, unit);
    const a = +amount;
    if (per == null || !(a > 0) || !isFinite(a)) return null;
    const n = a * per;
    const out = { servings: n, cal: Math.round(food.cal * n), c: round1(food.c * n), p: round1(food.p * n), f: round1(food.f * n) };
    for (const m of MICROS) out[m] = round1((food[m] || 0) * n);
    return out;
  }
  // amount rounding per unit: whole grams/ml, hundredths for everything else
  function roundAmount(unit, v) {
    return unit === 'g' || unit === 'ml' ? Math.max(1, Math.round(v)) : Math.max(0.01, Math.round(v * 100) / 100);
  }
  // the same quantity of food re-expressed in another unit (118 g -> 1 banana)
  function convertAmount(state, food, amount, from, to) {
    const a = unitPer(state, food, from), b = unitPer(state, food, to);
    if (a == null || b == null) return null;
    return roundAmount(to, (+amount) * a / b);
  }
  // "150 g", "2 tazas" for an entry logged by weight/volume; null for a plain
  // serving count (callers keep their own "1 banana (118g) × 2" wording)
  function entryUnitText(state, e) {
    if (!e || !UNIT_KEYS.includes(e.unit) || !(e.amount > 0)) return null;
    const a = Math.round(e.amount * 100) / 100;
    return `${a} ${unitLabel(state.lang, e.unit, a)}`;
  }
  // the unit this food was last logged in, so a food you weigh opens in grams
  // next time. Plain servings return null (the sheet keeps its 1-serving default).
  // (A unit the food can no longer do — say a custom food's serving was edited —
  // is ignored.)
  function lastUnit(state, food) {
    if (!food || !food.id) return null;
    for (const date of Object.keys(state.diary).sort().reverse()) {
      const meals = state.diary[date].meals || {};
      for (const m of ['snacks', 'dinner', 'lunch', 'breakfast']) {
        const list = meals[m] || [];
        for (let i = list.length - 1; i >= 0; i--) {
          const e = list[i];
          if (e.foodId !== food.id) continue;
          const ok = UNIT_KEYS.includes(e.unit) && e.amount > 0 && unitPer(state, food, e.unit) != null;
          return ok ? { unit: e.unit, amount: e.amount } : null;
        }
      }
    }
    return null;
  }

  // `servings` is an amount of `unit` (default: the food's own serving). The
  // entry always stores `servings` as the food's own servings — so every
  // existing reader stays correct — plus {unit, amount} when weighed/measured.
  function logFood(state, date, meal, food, servings, unit) {
    const byUnit = unit && unit !== 'serving';
    const pr = portion(state, food, servings, byUnit ? unit : 'serving');
    if (!pr) return state;
    const s = clone(state);
    const d = ensureDay(s, date);
    const entry = {
      entryId: uid(),
      foodId: food.id || null,
      name: foodName(s, food),
      serving: foodServing(s, food),
      servings: byUnit ? Math.round(pr.servings * 10000) / 10000 : servings,
      cal: pr.cal, c: pr.c, p: pr.p, f: pr.f,
    };
    for (const m of MICROS) entry[m] = pr[m];
    if (byUnit) { entry.unit = unit; entry.amount = Math.round(+servings * 100) / 100; }
    d.meals[meal].push(entry);
    if (food.id) {
      s.recents = [food.id, ...s.recents.filter(r => r !== food.id)].slice(0, 30);
    }
    return s;
  }

  // duplicate one meal's entries onto another day (fresh entryIds)
  function copyMeal(state, fromDate, toDate, meal) {
    const src = day(state, fromDate).meals[meal];
    if (!src.length || fromDate === toDate) return state;
    const s = clone(state);
    const d = ensureDay(s, toDate);
    for (const e of src) d.meals[meal].push({ ...clone(e), entryId: uid() });
    return s;
  }

  // ----- saved meals / recipes -----
  // A saved meal is a named snapshot of diary entries (already serving-scaled).
  // servings > 1 makes it a recipe: the snapshot is the whole batch, and you
  // log fractions of it.
  function saveMeal(state, name, entries, servings) {
    const s = clone(state);
    const items = entries.map(e => { const i = clone(e); delete i.entryId; return i; });
    const n = Number(servings);
    const meal = { id: 'meal-' + uid(), name, items, servings: Number.isFinite(n) && n >= 0.25 ? Math.round(n * 4) / 4 : 1 };
    s.savedMeals.push(meal);
    return { state: s, meal };
  }

  // count: servings to log (default = the whole snapshot). Items scale by
  // count / meal.servings, so 1 serving of a 4-serving recipe logs a quarter.
  function logSavedMeal(state, date, mealKey, savedMealId, count) {
    const sm = state.savedMeals.find(m => m.id === savedMealId);
    if (!sm) return state;
    const batch = sm.servings || 1;
    const scale = count == null ? 1 : count / batch;
    if (!(scale > 0)) return state;
    const s = clone(state);
    const d = ensureDay(s, date);
    for (const it of sm.items) {
      const e = { ...clone(it), entryId: uid() };
      if (scale !== 1) {
        e.cal = Math.round(it.cal * scale);
        e.servings = Math.round(it.servings * scale * 100) / 100;
        if (it.amount > 0) e.amount = Math.round(it.amount * scale * 100) / 100;
        for (const k of ['c', 'p', 'f', ...MICROS]) e[k] = round1((it[k] || 0) * scale);
      }
      d.meals[mealKey].push(e);
    }
    return s;
  }

  function removeSavedMeal(state, id) {
    const s = clone(state);
    s.savedMeals = s.savedMeals.filter(m => m.id !== id);
    return s;
  }

  function savedMealCal(meal) {
    return meal.items.reduce((t, i) => t + i.cal, 0);
  }

  function searchSavedMeals(state, query) {
    const q = query.trim().toLowerCase();
    const all = state.savedMeals;
    return (q ? all.filter(m => m.name.toLowerCase().includes(q)) : all).slice(0, 6);
  }

  // ----- water -----
  function addWater(state, date, delta) {
    const s = clone(state);
    if (!s.water) s.water = {};
    const next = Math.max(0, (s.water[date] || 0) + delta);
    if (next === 0) delete s.water[date]; else s.water[date] = next;
    return s;
  }

  function waterFor(state, date) {
    return (state.water || {})[date] || 0;
  }

  function setWaterGoal(state, cups) {
    const s = clone(state);
    const n = Math.round(+cups);
    s.waterGoal = isFinite(n) ? Math.min(30, Math.max(1, n)) : 8;
    return s;
  }

  // ----- exercise presets (MET-based, calories from the user's own weight) -----
  // MET values from the Compendium of Physical Activities. kcal = MET × kg × hours.
  const EXERCISES = [
    { name: 'Walking, casual', met: 3.5 },
    { name: 'Walking, brisk', met: 4.3 },
    { name: 'Running, 5 mph', met: 8.3 },
    { name: 'Running, 6 mph', met: 9.8 },
    { name: 'Running, 7.5 mph', met: 11.8 },
    { name: 'Cycling, moderate', met: 8 },
    { name: 'Cycling, vigorous', met: 10 },
    { name: 'Swimming, laps', met: 6 },
    { name: 'Weight lifting, general', met: 3.5 },
    { name: 'Weight lifting, vigorous', met: 6 },
    { name: 'HIIT / circuit training', met: 8 },
    { name: 'Elliptical', met: 5 },
    { name: 'Stair climber', met: 9 },
    { name: 'Rowing machine', met: 7 },
    { name: 'Jump rope', met: 11 },
    { name: 'Yoga', met: 2.5 },
    { name: 'Pilates', met: 3 },
    { name: 'Hiking', met: 6 },
    { name: 'Basketball', met: 6.5 },
    { name: 'Soccer', met: 7 },
    { name: 'Tennis', met: 7.3 },
    { name: 'Dancing', met: 5.5 },
    { name: 'Golf, walking', met: 4.3 },
    { name: 'Housework / cleaning', met: 3.3 },
  ];

  function exerciseOptions() { return EXERCISES.map(e => ({ ...e })); }

  function metCalories(profile, met, minutes) {
    const lbs = (profile && profile.weightLbs) || 170;
    const kg = lbs * 0.453592;
    return Math.round(met * kg * (minutes / 60));
  }

  // ----- goal forecast: when does the plan (and the actual trend) reach goal weight -----
  function addDaysISO(dateISO, days) {
    const d = new Date(dateISO + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + Math.round(days));
    return d.toISOString().slice(0, 10);
  }

  function goalForecast(state, todayISO) {
    const p = state.profile;
    if (!p || !p.goalWeightLbs || !state.weights.length) return null;
    const current = state.weights[state.weights.length - 1].lbs;
    const remaining = round1(p.goalWeightLbs - current); // negative = must lose
    if (Math.abs(remaining) < 1) return { reached: true, current, goal: p.goalWeightLbs };
    // plan line: the rate chosen in the profile
    const rate = p.rateLbsPerWeek || 0;
    let planDate = null;
    if (rate && Math.sign(rate) === Math.sign(remaining)) {
      const weeks = remaining / rate;
      if (weeks <= 260) planDate = addDaysISO(todayISO, weeks * 7);
    }
    // trend line: linear fit over the last 42 days of check-ins
    const cutoff = addDaysISO(todayISO, -42);
    const pts = state.weights.filter(w => w.date >= cutoff && w.date <= todayISO);
    let trendRate = null, trendDate = null;
    if (pts.length >= 2 && pts[pts.length - 1].date > pts[0].date) {
      const day0 = new Date(pts[0].date + 'T00:00:00Z').getTime();
      const xs = pts.map(w => (new Date(w.date + 'T00:00:00Z').getTime() - day0) / 86400000);
      const ys = pts.map(w => w.lbs);
      const n = xs.length;
      const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
      const den = xs.reduce((t, x) => t + (x - mx) * (x - mx), 0);
      if (den > 0) {
        const slope = xs.reduce((t, x, i) => t + (x - mx) * (ys[i] - my), 0) / den; // lbs/day
        trendRate = round1(slope * 7);
        if (trendRate && Math.sign(trendRate) === Math.sign(remaining)) {
          const weeks = remaining / trendRate;
          if (weeks <= 260) trendDate = addDaysISO(todayISO, weeks * 7);
        }
      }
    }
    return { reached: false, current, goal: p.goalWeightLbs, remaining, planDate, trendRate, trendDate };
  }

  // ----- custom food management -----
  function updateCustomFood(state, id, patch) {
    const s = clone(state);
    const i = s.customFoods.findIndex(f => f.id === id);
    if (i < 0) return state;
    const f = { ...s.customFoods[i], ...patch, id, custom: true };
    if (f.barcode != null) {
      const b = normalizeBarcode(f.barcode);
      if (b) f.barcode = b; else delete f.barcode;
    }
    s.customFoods[i] = f;
    return s;
  }

  // Diary entries keep their denormalized values, so deleting a food never
  // rewrites history — it just stops being searchable/scannable.
  function removeCustomFood(state, id) {
    const s = clone(state);
    s.customFoods = s.customFoods.filter(f => f.id !== id);
    s.recents = s.recents.filter(r => r !== id);
    return s;
  }

  function renameSavedMeal(state, id, name) {
    if (!name || !name.trim()) return state;
    const s = clone(state);
    const m = s.savedMeals.find(x => x.id === id);
    if (m) m.name = name.trim();
    return s;
  }

  function removeEntry(state, date, meal, entryId) {
    const s = clone(state);
    const d = ensureDay(s, date);
    d.meals[meal] = d.meals[meal].filter(e => e.entryId !== entryId);
    return s;
  }

  // Change the servings on an entry already in the diary — a mistyped count
  // shouldn't force a delete-and-relog. When the source food is still known the
  // values are recomputed from it (exact); otherwise they scale proportionally,
  // which is the best that can be done for quick-adds and imported rows.
  function setEntryServings(state, date, meal, entryId, servings, db) {
    const n = Math.max(0.25, Math.round(servings * 100) / 100);
    if (!isFinite(n)) return state;
    const s = clone(state);
    const list = ensureDay(s, date).meals[meal];
    const i = list.findIndex(e => e.entryId === entryId);
    if (i === -1) return state;
    const e = list[i];
    const src = e.foodId && [...s.customFoods, ...(db || [])].find(f => f.id === e.foodId);
    const next = { ...e, servings: n };
    if (e.amount > 0 && e.servings > 0) next.amount = Math.round(e.amount * n / e.servings * 100) / 100;
    if (src) {
      next.cal = Math.round(src.cal * n);
      next.c = round1(src.c * n); next.p = round1(src.p * n); next.f = round1(src.f * n);
      for (const m of MICROS) next[m] = round1((src[m] || 0) * n);
    } else {
      const k = n / (e.servings || 1);
      next.cal = Math.round(e.cal * k);
      next.c = round1(e.c * k); next.p = round1(e.p * k); next.f = round1(e.f * k);
      for (const m of MICROS) next[m] = round1((e[m] || 0) * k);
    }
    list[i] = next;
    return s;
  }

  // Change an entry's amount and/or unit ("150 g" -> "5 oz" -> "2 servings").
  // Values are recomputed from the source food; a unit switch needs the food
  // (it defines the conversion). Without it, only the amount can change, and
  // the entry scales proportionally like any quick-add.
  function setEntryAmount(state, date, meal, entryId, amount, unit, db) {
    const a = +amount;
    if (!(a > 0) || !isFinite(a)) return state;
    const list = day(state, date).meals[meal] || [];
    const e = list.find(x => x.entryId === entryId);
    if (!e) return state;
    const cur = UNIT_KEYS.includes(e.unit) && e.amount > 0 ? e.unit : 'serving';
    const want = unit || cur;
    const food = e.foodId && [...state.customFoods, ...(db || [])].find(f => f.id === e.foodId);
    // the food must still exist AND still support the unit (a custom food whose
    // serving lost its "(350g)" can't be weighed any more)
    const src = food && unitPer(state, food, want) != null ? food : null;
    if (!src) {
      if (want !== cur) return state;
      if (cur === 'serving') return setEntryServings(state, date, meal, entryId, a, db);
    }
    const s = clone(state);
    const l = ensureDay(s, date).meals[meal];
    const i = l.findIndex(x => x.entryId === entryId);
    if (!src) { // weighed entry whose food is gone or changed: scale by the amount ratio
      const k = a / e.amount;
      const next = { ...e, amount: Math.round(a * 100) / 100, servings: Math.round(e.servings * k * 10000) / 10000, cal: Math.round(e.cal * k) };
      for (const m of ['c', 'p', 'f', ...MICROS]) next[m] = round1((e[m] || 0) * k);
      l[i] = next;
      return s;
    }
    const pr = portion(state, src, a, want);
    if (!pr) return state;
    const next = { ...l[i], cal: pr.cal, c: pr.c, p: pr.p, f: pr.f };
    for (const m of MICROS) next[m] = pr[m];
    if (want === 'serving') {
      next.servings = Math.round(a * 100) / 100;
      delete next.unit; delete next.amount;
      if (cur !== 'serving') next.serving = foodServing(s, src); // was a unit entry: show the food's serving again
    } else {
      next.servings = Math.round(pr.servings * 10000) / 10000;
      next.unit = want; next.amount = Math.round(a * 100) / 100;
    }
    l[i] = next;
    return s;
  }

  // Edit a logged workout in place (name, minutes and/or calories).
  function updateExercise(state, date, entryId, patch) {
    const s = clone(state);
    const list = ensureDay(s, date).exercise;
    const i = list.findIndex(e => e.entryId === entryId);
    if (i === -1) return state;
    const e = list[i];
    const name = patch.name != null && String(patch.name).trim() ? String(patch.name).trim() : e.name;
    const minutes = patch.minutes != null && isFinite(+patch.minutes) ? Math.max(0, Math.round(+patch.minutes)) : e.minutes;
    const cal = patch.cal != null && isFinite(+patch.cal) && +patch.cal > 0 ? Math.round(+patch.cal) : e.cal;
    list[i] = { ...e, name, minutes, cal };
    return s;
  }

  function logExercise(state, date, name, minutes, calories) {
    const s = clone(state);
    ensureDay(s, date).exercise.push({ entryId: uid(), name, minutes, cal: Math.round(calories) });
    return s;
  }

  function removeExercise(state, date, entryId) {
    const s = clone(state);
    const d = ensureDay(s, date);
    d.exercise = d.exercise.filter(e => e.entryId !== entryId);
    return s;
  }

  const TOTAL_KEYS = ['cal', 'c', 'p', 'f', ...MICROS];
  function zeroTotals() { const t = {}; for (const k of TOTAL_KEYS) t[k] = 0; return t; }

  function mealTotals(state, date, meal) {
    // (e[k] || 0): entries logged before micronutrients existed have no micro fields
    return day(state, date).meals[meal].reduce((t, e) => {
      for (const k of TOTAL_KEYS) t[k] += e[k] || 0;
      return t;
    }, zeroTotals());
  }

  function dayTotals(state, date) {
    const meals = ['breakfast', 'lunch', 'dinner', 'snacks'];
    const food = meals.reduce((t, m) => {
      const mt = mealTotals(state, date, m);
      for (const k of TOTAL_KEYS) t[k] += mt[k];
      return t;
    }, zeroTotals());
    const logged = day(state, date).exercise.reduce((t, e) => t + e.cal, 0);
    const health = healthExercise(state, date);
    const exercise = logged + (health ? health.credit : 0);
    const goal = state.goals ? goalsForDate(state, date).calories : 0;
    return { food, exercise, health, goal, remaining: goal - food.cal + exercise };
  }

  // ----- Apple Health activity as exercise -----
  // The activity level describes the user's day OUTSIDE workouts (desk job …
  // physical work), and the calorie goal is resting energy × that factor.
  // Workouts — a run on the watch, a ride from Garmin Connect or Strava — are
  // not in it, so they're earned back in full, like exercise logged by hand.
  // Apple Health's daily "active energy" is all movement above resting:
  // workouts plus everyday moving around. The everyday part is earned only
  // beyond what the factor already budgets for it, so a normal day isn't
  // counted twice. Of the factor's total, about 10% goes to digesting food
  // (thermic effect of food), not movement:
  //   included = resting × (0.9 × factor − 1)
  // e.g. resting 1,700: sedentary ≈ 140, light ≈ 400, active ≈ 670, very ≈ 940.
  const TEF_SHARE = 0.1;
  function activityIncluded(p) {
    if (!p) return 0;
    const f = ACTIVITY[p.activity] || 1.2;
    return Math.max(0, Math.round(bmr(p) * ((1 - TEF_SHARE) * f - 1)));
  }
  // null when the date has no Health data, there's no profile, or it's off.
  //   workouts: that day's synced workouts, each earned in full
  //   movement: active energy − workouts − exercise logged by hand − included
  //             (never negative; logged exercise is subtracted so a session the
  //             watch saw as plain activity isn't counted twice)
  // With a measured burn applied (tdeeOverride) the measurement already holds
  // the user's real activity, workouts included, so nothing more is added. A
  // day whose full active energy was logged by the opt-in file import already
  // counts it as an exercise entry, so nothing is derived on top (imported).
  function healthExercise(state, date) {
    if (state.healthExercise === false || !state.profile) return null;
    const active = (state.burn && state.burn[date]) || 0;
    const synced = workoutsOn(state, date).map(w => withEnergy(state.profile, w));
    if (!(active > 0) && !synced.length) return null;
    const d = day(state, date);
    const logged = d.exercise.reduce((t, e) => t + e.cal, 0);
    const workoutKcal = synced.reduce((t, w) => t + w.kcal, 0);
    const none = w => ({ ...w, counted: 0 });
    const base = { active, workoutKcal, logged, included: null, movement: 0, credit: 0, measured: false, imported: false };
    if (d.exercise.some(e => e.src === 'health')) return { ...base, workouts: synced.map(none), imported: true };
    if (Number.isFinite(state.profile.tdeeOverride)) return { ...base, workouts: synced.map(none), measured: true };
    // A session logged by hand AND synced from a watch is one session: a hand
    // entry whose name says what kind it is ("Running, 6 mph", "Natación"…) is
    // paired with an unpaired synced workout of that kind the same day, and the
    // pair counts the larger of the two numbers, not both. Unpaired hand entries
    // are assumed to have been seen by the watch as plain movement, so they come
    // out of everyday movement (paired ones are already inside the workout).
    const pairedWith = {};
    let pairedLogged = 0;
    for (const e of d.exercise) {
      const types = exerciseKindTypes(e.name);
      const w = types && synced.find(x => !pairedWith[x.id] && types.includes(x.type));
      if (w) { pairedWith[w.id] = e; pairedLogged += e.cal; }
    }
    const workouts = synced.map(w => {
      const e = pairedWith[w.id];
      return e ? { ...w, counted: Math.max(0, w.kcal - e.cal), loggedAs: e.name } : { ...w, counted: w.kcal };
    });
    const workoutCredit = workouts.reduce((t, w) => t + w.counted, 0);
    const included = activityIncluded(state.profile);
    const movement = active > 0 ? Math.max(0, Math.round(active - workoutKcal - (logged - pairedLogged) - included)) : 0;
    return { ...base, workouts, included, movement, loggedApart: logged - pairedLogged, credit: workoutCredit + movement };
  }
  // the day's synced workouts, via a date index built once per workouts list
  // (dayTotals runs ~150 times per render; states are never mutated in place,
  // so a new list means a new index)
  function workoutsOn(state, date) {
    return (state.workouts || []).filter(w => w.date === date);
  }
  // what kind of session a hand-logged entry is, from its name in either
  // language (presets or free text) -> the HKWorkoutActivityTypes it matches
  // First match wins: golf before walk ("Golf, walking" is golf), elliptical
  // before bike ("Bicicleta elíptica" is the elliptical), bike before run and
  // walk ("Paseo en bici" is a ride), lifts before rowing ("Barbell rows")
  const EXERCISE_KINDS = [
    [/golf/, [21]],
    [/ellip|elipt/, [16]],
    [/cycl|bike|biking|\bbici|ciclis|spin/, [13]],
    [/\b(run|running|jog|jogging)|\bcorr|carrera|trot/, [37]],
    [/\bwalk|camin|paseo/, [52]],
    [/swim|\bnad|natac/, [46]],
    [/\bhik|sender|excursion/, [24]],
    [/lift|weight|strength|pesas|fuerza|\bgym|gimnasio|barbell|dumbbell|kettlebell|mancuern|deadlift|peso muerto|squat|sentadilla|bench press|press de banca/, [50, 20, 59]],
    [/hiit|circuit|crossfit|bootcamp/, [63, 11, 73]],
    [/stair|escalera|escaladora/, [44, 68]],
    [/\brow|\bremo\b/, [35]],
    [/jump rope|\brope|cuerda|comba/, [64]],
    [/yoga/, [57]],
    [/pilates/, [66]],
    [/basket|basquet|baloncesto/, [6]],
    [/soccer|futbol/, [41]],
    [/tennis|tenis/, [48]],
    [/danc|\bbail|zumba/, [14, 77, 78]],
  ];
  function exerciseKindTypes(name) {
    const n = deaccent(String(name || '').toLowerCase());
    const hit = EXERCISE_KINDS.find(([re]) => re.test(n));
    return hit ? hit[1] : null;
  }

  // HKWorkoutActivityType raw values -> [English, Spanish]; anything else is "Workout"
  const WORKOUT_TYPES = {
    37: ['Running', 'Carrera'], 52: ['Walking', 'Caminata'], 13: ['Cycling', 'Ciclismo'], 24: ['Hiking', 'Senderismo'],
    46: ['Swimming', 'Natación'], 16: ['Elliptical', 'Elíptica'], 35: ['Rowing', 'Remo'], 44: ['Stair climber', 'Escaladora'],
    68: ['Stairs', 'Escaleras'], 50: ['Strength training', 'Entrenamiento de fuerza'], 20: ['Functional training', 'Entrenamiento funcional'],
    63: ['HIIT', 'HIIT'], 11: ['Cross training', 'Entrenamiento cruzado'], 59: ['Core training', 'Entrenamiento de abdomen'],
    57: ['Yoga', 'Yoga'], 66: ['Pilates', 'Pilates'], 58: ['Barre', 'Barre'], 62: ['Flexibility', 'Flexibilidad'],
    73: ['Mixed cardio', 'Cardio mixto'], 77: ['Cardio dance', 'Baile cardio'], 78: ['Dance', 'Baile'], 14: ['Dance', 'Baile'],
    64: ['Jump rope', 'Saltar la cuerda'], 8: ['Boxing', 'Boxeo'], 65: ['Kickboxing', 'Kickboxing'], 28: ['Martial arts', 'Artes marciales'],
    41: ['Soccer', 'Fútbol'], 6: ['Basketball', 'Básquetbol'], 48: ['Tennis', 'Tenis'], 79: ['Pickleball', 'Pickleball'],
    21: ['Golf', 'Golf'], 51: ['Volleyball', 'Voleibol'], 5: ['Baseball', 'Béisbol'], 42: ['Softball', 'Sóftbol'],
    1: ['Football', 'Fútbol americano'], 9: ['Climbing', 'Escalada'], 31: ['Paddling', 'Piragüismo'], 45: ['Surfing', 'Surf'],
    60: ['Cross-country skiing', 'Esquí de fondo'], 61: ['Skiing', 'Esquí'], 67: ['Snowboarding', 'Snowboard'],
    72: ['Tai chi', 'Tai chi'], 69: ['Step training', 'Step'], 53: ['Water fitness', 'Ejercicio acuático'],
    70: ['Wheelchair walk', 'Paseo en silla de ruedas'], 71: ['Wheelchair run', 'Carrera en silla de ruedas'],
    74: ['Hand cycling', 'Ciclismo de mano'], 82: ['Triathlon', 'Triatlón'], 80: ['Cooldown', 'Enfriamiento'],
  };
  function workoutName(type, lang) {
    const n = WORKOUT_TYPES[type];
    return n ? n[lang === 'es' ? 1 : 0] : (lang === 'es' ? 'Entrenamiento' : 'Workout');
  }

  // Some apps save a workout to Apple Health without its calories. Rather than
  // show +0 for a real run, estimate the ACTIVE part from the Compendium MET of
  // the same activity in the presets above: (MET − 1) × kg × hours — the goal
  // already covers resting energy for those minutes, and Apple's workout
  // calories are active calories too. Unknown activities stay at 0 (est is
  // only set when an estimate was made). Everyday movement subtracts the
  // estimate like any other workout, so a day whose active energy already
  // holds the session isn't counted twice.
  const WORKOUT_MET = {
    37: 9.8, 52: 3.5, 13: 8, 24: 6, 46: 6, 16: 5, 35: 7, 44: 9, 68: 9,
    50: 3.5, 20: 3.5, 63: 8, 11: 8, 64: 11, 57: 2.5, 66: 3,
    6: 6.5, 41: 7, 48: 7.3, 14: 5.5, 77: 5.5, 78: 5.5, 21: 4.3,
  };
  function withEnergy(profile, w) {
    if (w.kcal > 0 || !WORKOUT_MET[w.type]) return w;
    const kg = ((profile && profile.weightLbs) || 170) * 0.453592;
    return { ...w, kcal: Math.max(0, Math.round((WORKOUT_MET[w.type] - 1) * kg * w.minutes / 60)), est: true };
  }

  // a synced workout, or null when it can't be one (bad times, absurd values)
  const WORKOUT_MAX_MIN = 24 * 60, WORKOUT_MAX_KCAL = 5000, WORKOUTS_KEPT = 1500;
  function cleanWorkout(w) {
    if (!w || typeof w !== 'object') return null;
    const start = Number(w.start), end = Number(w.end);
    if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return null;
    if (typeof w.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(w.date)) return null;
    const minutes = Math.round(Number(w.minutes) > 0 ? Number(w.minutes) : (end - start) / 60000);
    const kcal = Math.round(Number(w.kcal) || 0);
    if (minutes < 1 || minutes > WORKOUT_MAX_MIN || kcal < 0 || kcal > WORKOUT_MAX_KCAL) return null;
    return {
      id: String(w.id || `${start}-${end}`).slice(0, 64), date: w.date, start, end,
      type: Number.isFinite(Number(w.type)) ? Number(w.type) : 3000, minutes, kcal,
      source: String(w.source || '').slice(0, 60),
    };
  }
  // The same run often reaches Apple Health twice (the watch AND Garmin
  // Connect, or Garmin AND Strava). Workouts overlapping by more than half of
  // the shorter one are one session: keep a copy that recorded energy, then
  // the longest, then the one with more energy, so a session is counted once
  // and never loses its calories to a copy that has none.
  function dedupeWorkouts(list) {
    const kept = [];
    const byLength = list.slice().sort((a, b) => (b.kcal > 0) - (a.kcal > 0) ||
      (b.end - b.start) - (a.end - a.start) || b.kcal - a.kcal || a.id.localeCompare(b.id));
    for (const w of byLength) {
      const dup = kept.some(k =>
        Math.min(k.end, w.end) - Math.max(k.start, w.start) > 0.5 * Math.min(k.end - k.start, w.end - w.start));
      if (!dup) kept.push(w);
    }
    return kept.sort((a, b) => a.start - b.start);
  }

  function setHealthExercise(state, on) {
    const s = clone(state);
    s.healthExercise = !!on;
    return s;
  }
  // answer the one-time activity-level question: a level re-picks it (goals
  // recalc), null keeps the current one; either way it isn't asked again
  function reviewActivity(state, activity) {
    const s = activity && ACTIVITY[activity] ? updateProfile(state, { activity }) : clone(state);
    s.activityReview = false;
    return s;
  }

  function addCustomFood(state, food) {
    const s = clone(state);
    const f = { ...food, id: 'custom-' + uid(), custom: true };
    if (f.barcode != null) {
      const b = normalizeBarcode(f.barcode);
      if (b) f.barcode = b; else delete f.barcode;
    }
    s.customFoods.push(f);
    return { state: s, food: f };
  }

  // ----- barcodes -----
  // Canonical form: digits only, leading zeros stripped (a UPC-A is an EAN-13
  // with a leading zero, so both spellings of the same product compare equal).
  // Checksum is left to the scanner; manual typos just miss and fall through
  // to Create Food.
  function normalizeBarcode(code) {
    const digits = String(code == null ? '' : code).replace(/\D/g, '');
    if (digits.length < 6 || digits.length > 14) return null;
    return digits.replace(/^0+/, '') || null;
  }

  // UPC-E is a zero-suppressed UPC-A; scanners report the 8-digit compressed
  // form, which would never match the 12-digit codes products are listed under.
  // Expansion rule keys off the 6th body digit (GS1 spec). Returns null if the
  // input isn't a plausible UPC-E.
  function expandUPCE(code) {
    const d = String(code == null ? '' : code).replace(/\D/g, '');
    if (d.length !== 8 || (d[0] !== '0' && d[0] !== '1')) return null;
    const e = d.slice(1, 7), check = d[7], k = e[5];
    let mfr, item;
    if (k === '0' || k === '1' || k === '2') { mfr = e.slice(0, 2) + k + '00'; item = '00' + e.slice(2, 5); }
    else if (k === '3') { mfr = e.slice(0, 3) + '00'; item = '000' + e.slice(3, 5); }
    else if (k === '4') { mfr = e.slice(0, 4) + '0'; item = '0000' + e[4]; }
    else { mfr = e.slice(0, 5); item = '0000' + k; }
    return d[0] + mfr + item + check;
  }

  // Map an Open Food Facts API v2 product response to a food — per serving when
  // the label declares one, else per 100 g. OFF reports nutriments in grams, so
  // sodium/cholesterol convert to mg. Returns null when unusable (no calories,
  // no name), so the caller falls back to the offline create-it-once flow.
  // Spirits carry no nutrition label in the US (TTB, not FDA), so a scanned
  // bottle of vodka has no calories in any database. Ethanol is 7 kcal/g and a
  // standard pour is a known volume, so ABV gives an exact answer — and the
  // number people actually want is per shot, not per bottle.
  const ETHANOL_KCAL_PER_ML = 0.789 * 7;
  const POURS = {
    spirit: { ml: 44, label: '1.5 fl oz (44ml)' },
    wine: { ml: 147, label: '5 fl oz (147ml)' },
    beer: { ml: 355, label: '12 fl oz (355ml)' },
  };
  // spirit-type keywords that show up in almost every bottle name
  const DRINK_KINDS = [
    [/vodka/i, 'spirit', 40], [/tequila|mezcal/i, 'spirit', 40],
    [/whisk(e)?y|bourbon|scotch|rye\b/i, 'spirit', 40], [/\bgin\b/i, 'spirit', 40],
    [/\brum\b|ron\b/i, 'spirit', 40], [/brandy|cognac|armagnac/i, 'spirit', 40],
    [/liqueur|schnapps|amaretto|triple sec|licor/i, 'spirit', 20],
    [/wine|vino|champagne|prosecco|riesling|merlot|cabernet|chardonnay/i, 'wine', 12],
    [/beer|lager|\bale\b|\bipa\b|stout|pilsner|cerveza/i, 'beer', 5],
    [/cider|sidra/i, 'beer', 5], [/seltzer/i, 'beer', 5], [/sake/i, 'wine', 15],
  ];

  function drinkKindFrom(text) {
    for (const [re, pour, abv] of DRINK_KINDS) if (re.test(text)) return { pour, abv };
    return null;
  }

  // Build a per-standard-pour food from an OFF product that has no calories.
  // Returns null when the product doesn't look like a drink.
  function alcoholFromOFF(prod, name) {
    const n = (prod && prod.nutriments) || {};
    const text = [name, prod && prod.categories, prod && prod.generic_name].filter(Boolean).join(' ');
    const kind = drinkKindFrom(text);
    // OFF stores ABV as alcohol_100g (percent by volume)
    const abvRaw = [n.alcohol_100g, n.alcohol_value, n.alcohol].find(v => Number.isFinite(v) && v > 0);
    if (!kind && !Number.isFinite(abvRaw)) return null;
    const abv = Number.isFinite(abvRaw) ? abvRaw : kind.abv;
    if (!(abv > 0) || abv > 96) return null;
    // no keyword match: infer the pour from the strength
    const pourKey = kind ? kind.pour : (abv >= 20 ? 'spirit' : abv >= 7 ? 'wine' : 'beer');
    const pour = POURS[pourKey];
    const per100 = key => {
      const v = n[key + '_100g'];
      return Number.isFinite(v) ? (v / 100) * pour.ml : 0;
    };
    const c = round1(per100('carbohydrates')), p = round1(per100('proteins')), f = round1(per100('fat'));
    const cal = Math.round(pour.ml * (abv / 100) * ETHANOL_KCAL_PER_ML + 4 * c + 4 * p + 9 * f);
    if (!(cal > 0)) return null;
    return {
      name, serving: pour.label, cal, c, p, f,
      fib: round1(per100('fiber')), sug: round1(per100('sugars')), sat: round1(per100('saturated-fat')),
      sod: Math.round(per100('sodium') * 1000), chol: Math.round(per100('cholesterol') * 1000),
      alc: 1,
    };
  }

  function offProductToFood(json) {
    const prod = json && json.product;
    if (!prod || !prod.nutriments) return null;
    const n = prod.nutriments;
    // Many OFF entries carry energy only in kJ (the bare energy_* fields are
    // kJ by OFF convention); fall back to converting so those products don't
    // read as "no calories" and get misrouted to the alcohol estimator.
    const kcalAt = sfx => {
      const kc = n['energy-kcal' + sfx];
      if (Number.isFinite(kc)) return kc;
      const kj = n['energy' + sfx];
      return Number.isFinite(kj) ? kj / 4.184 : NaN;
    };
    const perServing = Number.isFinite(kcalAt('_serving'));
    const suffix = perServing ? '_serving' : '_100g';
    const cal = kcalAt(suffix);
    // product names often lead with the brand already ("Favorite Day Bakery
    // Banana Nut", brand "Favorite Day"): add the brand only when it's missing
    const brand = prod.brands ? String(prod.brands).split(',')[0].trim() : '';
    const pname = String(prod.product_name || '').trim();
    const offName = (brand && !hasWords(pname, brand) ? `${brand} ${pname}` : pname || brand).trim();
    // a bottle with no calorie data is usually a spirit — compute the shot
    if (!Number.isFinite(cal) || cal <= 0) {
      return offName ? alcoholFromOFF(prod, offName) : null;
    }
    const name = offName;
    if (!name) return null;
    let serving = perServing ? (prod.serving_size ? String(prod.serving_size) : '1 serving') : '100 g';
    // OFF often splits "1 bar" and its weight (serving_quantity) — join them so
    // the food can be logged by weight too
    const q = +prod.serving_quantity, qu = String(prod.serving_quantity_unit || 'g').toLowerCase();
    if (perServing && q > 0 && isFinite(q) && (qu === 'g' || qu === 'ml')) {
      const sz = servingSize(serving);
      if (sz.g == null && sz.ml == null) serving += ` (${round1(q)}${qu})`;
    }
    const g = key => { const v = n[key + suffix]; return Number.isFinite(v) ? round1(v) : 0; };
    const mg = key => { const v = n[key + suffix]; return Number.isFinite(v) ? Math.round(v * 1000) : 0; };
    return {
      name,
      serving,
      cal: Math.round(cal),
      c: g('carbohydrates'), p: g('proteins'), f: g('fat'),
      fib: g('fiber'), sug: g('sugars'), sat: g('saturated-fat'),
      sod: mg('sodium'), chol: mg('cholesterol'),
    };
  }

  function setTourDone(state) {
    const s = clone(state);
    s.tourDone = true;
    return s;
  }

  function setOnlineLookup(state, on) {
    const s = clone(state);
    s.onlineLookup = !!on;
    return s;
  }

  // net carbs = total carbs minus fiber (keto-style display)
  function netCarbs(foodTotals) {
    return Math.max(0, round1((foodTotals.c || 0) - (foodTotals.fib || 0)));
  }

  function setNetCarbs(state, on) {
    const s = clone(state);
    s.netCarbs = !!on;
    return s;
  }

  // full diary as CSV (food + exercise rows), spreadsheet-safe escaping
  function diaryCSV(state) {
    const esc = v => { const t = String(v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const rows = [['kind', 'date', 'meal', 'name', 'serving', 'servings', 'cal', 'carbs_g', 'protein_g', 'fat_g', 'fiber_g', 'sugar_g', 'sodium_mg', 'satfat_g', 'cholesterol_mg']];
    // What Apple Health earned goes under its own date, after what was logged
    // by hand, and only what was counted. Days with Health data but nothing
    // logged still count toward Remaining, so they're listed too, but only from
    // when tracking began: an imported export's years of history before that
    // aren't diary days.
    const diaryDates = Object.keys(state.diary);
    const firstDay = [state.profile && state.profile.startDate, ...diaryDates].filter(Boolean).sort()[0] || '';
    const healthDates = [...Object.keys(state.burn || {}), ...(state.workouts || []).map(w => w.date)].filter(d => d >= firstDay);
    for (const date of [...new Set([...diaryDates, ...healthDates])].sort()) {
      const d = state.diary[date];
      if (d) {
        for (const meal of ['breakfast', 'lunch', 'dinner', 'snacks']) {
          for (const e of d.meals[meal]) {
            rows.push(['food', date, meal, e.name, e.serving, e.servings, e.cal,
              e.c || 0, e.p || 0, e.f || 0, e.fib || 0, e.sug || 0, e.sod || 0, e.sat || 0, e.chol || 0]);
          }
        }
        for (const e of d.exercise) {
          rows.push(['exercise', date, '', e.name, e.minutes ? e.minutes + ' min' : '', 1, e.cal, 0, 0, 0, 0, 0, 0, 0, 0]);
        }
      }
      const h = healthExercise(state, date);
      if (!h || !h.credit) continue;
      for (const w of h.workouts) {
        if (w.counted) rows.push(['exercise', date, '', workoutName(w.type, state.lang), w.minutes + ' min', 1, w.counted, 0, 0, 0, 0, 0, 0, 0, 0]);
      }
      if (h.movement) rows.push(['exercise', date, '', state.lang === 'es' ? 'Movimiento diario (Apple Health)' : 'Everyday movement (Apple Health)', '', 1, h.movement, 0, 0, 0, 0, 0, 0, 0, 0]);
    }
    return rows.map(r => r.map(esc).join(',')).join('\n');
  }

  // Pro entitlement cache — the wrapper (StoreKit) is the source of truth and
  // re-injects on every launch; outside the wrapper the app is fully unlocked.
  function setPro(state, on) {
    const s = clone(state);
    s.pro = !!on;
    return s;
  }

  const THEMES = ['auto', 'light', 'dark'];
  function setTheme(state, theme) {
    const s = clone(state);
    s.theme = THEMES.includes(theme) ? theme : 'auto';
    return s;
  }
  // Color themes (Pro) recolor the app chrome only — header, primary buttons,
  // the goal bar. Data marks (carbs blue, protein orange, fat violet) never
  // change, so a ring always means the same thing.
  const ACCENTS = ['classic', 'midnight', 'forest', 'berry'];
  function setAccent(state, accent) {
    const s = clone(state);
    s.accent = ACCENTS.includes(accent) ? accent : 'classic';
    return s;
  }

  // ----- reminders (local notifications scheduled by the iPhone app) -----
  // Meal and weigh-in reminders are free; the "fast complete" alert comes with
  // the fasting timer (Pro). All off until the user turns one on, so iOS only
  // asks for notification permission in context.
  const REMINDER_KINDS = ['breakfast', 'lunch', 'snacks', 'dinner', 'weighIn'];
  const REMINDER_TIMES = { breakfast: '08:00', lunch: '12:30', snacks: '15:30', dinner: '18:30', weighIn: '07:00' };
  const REMINDER_DAYS = 7; // scheduled ahead and refreshed whenever the app opens: a week away and they stop
  const validTime = t => typeof t === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t);
  function defaultReminders() {
    const r = { fastEnd: false };
    for (const k of REMINDER_KINDS) r[k] = { on: false, at: REMINDER_TIMES[k] };
    return r;
  }
  function cleanReminders(x) {
    const r = defaultReminders();
    if (!x || typeof x !== 'object' || Array.isArray(x)) return r;
    for (const k of REMINDER_KINDS) {
      const v = x[k];
      if (v && typeof v === 'object') { r[k].on = v.on === true; if (validTime(v.at)) r[k].at = v.at; }
    }
    r.fastEnd = x.fastEnd === true;
    return r;
  }
  // kind: one of REMINDER_KINDS with {on?, at?}, or 'fastEnd' with a boolean
  function setReminder(state, kind, patch) {
    const s = clone(state);
    const r = cleanReminders(s.reminders);
    if (kind === 'fastEnd') r.fastEnd = patch === true;
    else if (REMINDER_KINDS.includes(kind) && patch && typeof patch === 'object') {
      if (typeof patch.on === 'boolean') r[kind].on = patch.on;
      if (validTime(patch.at)) r[kind].at = patch.at;
    }
    s.reminders = r;
    return s;
  }
  const REMINDER_TEXT = {
    en: {
      breakfast: ['Breakfast', 'Log it in a few taps, or scan the barcode.'],
      lunch: ['Lunch', 'What did you have? Log it while you remember.'],
      snacks: ['Snacks', 'Had a snack? Add it so your day adds up.'],
      dinner: ['Dinner', 'Log dinner and see where your day landed.'],
      weighIn: ['Morning weigh-in', 'Step on the scale before breakfast. Your trend line does the rest.'],
      fastEnd: ['Fast complete', h => `You made it to ${h} hours. Nice work.`],
    },
    es: {
      breakfast: ['Desayuno', 'Regístralo en unos toques, o escanea el código de barras.'],
      lunch: ['Comida', '¿Qué comiste? Regístralo mientras lo recuerdas.'],
      snacks: ['Snacks', '¿Comiste un snack? Agrégalo para que tu día cuadre.'],
      dinner: ['Cena', 'Registra tu cena y mira cómo terminó tu día.'],
      weighIn: ['Pesaje de la mañana', 'Súbete a la báscula antes de desayunar. Tu línea de tendencia hace el resto.'],
      fastEnd: ['Ayuno completado', h => `Llegaste a ${h} horas. ¡Bien hecho!`],
    },
  };
  // What the iPhone app should have scheduled, starting today (`today` ISO and
  // `nowMin` minutes after local midnight — from the caller; core never reads
  // the clock). Today skips anything already past or already done: a meal that
  // has entries, a weigh-in that's logged. Days ahead are all included. With
  // opts.fast, a running fast adds its "complete" alert (`at`, epoch ms).
  function reminderSchedule(state, today, nowMin, opts = {}) {
    const r = cleanReminders(state.reminders);
    const T = REMINDER_TEXT[state.lang === 'es' ? 'es' : 'en'];
    const pad = n => String(n).padStart(2, '0');
    const out = [];
    const days = Number.isFinite(opts.days) ? opts.days : REMINDER_DAYS;
    for (let i = 0; i < days; i++) {
      const date = addDaysISO(today, i);
      for (const k of REMINDER_KINDS) {
        if (!r[k].on) continue;
        const [hour, minute] = r[k].at.split(':').map(Number);
        if (i === 0) {
          if (hour * 60 + minute <= nowMin) continue;
          const done = k === 'weighIn' ? state.weights.some(w => w.date === today) : day(state, today).meals[k].length > 0;
          if (done) continue;
        }
        out.push({ id: `${k}-${date}`, kind: k, date, hour, minute, title: T[k][0], body: T[k][1] });
      }
    }
    out.sort((a, b) => `${a.date}${pad(a.hour)}${pad(a.minute)}`.localeCompare(`${b.date}${pad(b.hour)}${pad(b.minute)}`));
    if (opts.fast && r.fastEnd && state.fast) {
      out.push({ id: 'fast-end', kind: 'fastEnd', at: state.fast.start + state.fast.target * 3600000,
        title: T.fastEnd[0], body: T.fastEnd[1](state.fast.target) });
    }
    return out;
  }

  // ----- Home Screen / Lock Screen widget (iPhone app, Pro) -----
  // Everything the widget draws, computed here so the Swift side only lays it
  // out: the day's equation, macro totals vs goals (net carbs when that view is
  // on), and the next week's calorie goals — so a widget that hasn't heard from
  // the app since yesterday can still show today's goal with nothing eaten.
  function widgetSnapshot(state, date) {
    if (!state.profile || !state.goals) return null;
    const t = dayTotals(state, date), g = goalsForDate(state, date), r = Math.round;
    const goals = {};
    for (let i = 0; i < 8; i++) { const d = addDaysISO(date, i); goals[d] = r(goalsForDate(state, d).calories); }
    return {
      v: 1, date, lang: state.lang === 'es' ? 'es' : 'en',
      goal: r(t.goal), food: r(t.food.cal), exercise: r(t.exercise), left: r(t.remaining),
      carbs: r(state.netCarbs ? netCarbs(t.food) : t.food.c), netCarbs: !!state.netCarbs, carbsGoal: r(g.carbs),
      protein: r(t.food.p), proteinGoal: r(g.protein), fat: r(t.food.f), fatGoal: r(g.fat),
      goals,
    };
  }

  // ----- daily coach -----
  // One deterministic, rules-based insight for the day — the kind of nudge the
  // big trackers paywall. hour (0-23, local) is passed in so core stays
  // clock-free. First matching rule wins. Returns {text, tone} or null.
  function coachInsight(state, db, date, hour) {
    if (!state.profile || !state.goals) return null;
    const es = state.lang === 'es';
    const t = dayTotals(state, date);
    const g = goalsForDate(state, date);
    if (t.food.cal === 0) {
      const hi = state.profile.name ? `, ${state.profile.name}` : '';
      const streak = trendStats(state, date, 30).streak;
      if (streak >= 2) return {
        text: es ? `Aún no has registrado nada${hi} — mantén viva tu racha de ${streak} días.`
          : `Nothing logged yet${hi} — keep your ${streak}-day streak alive.`,
        tone: 'push',
      };
      return {
        text: hour < 11
          ? (es ? `Día nuevo${hi}. Registra el desayuno y los anillos empiezan a moverse.`
            : `Fresh day${hi}. Log breakfast and the rings start moving.`)
          : (es ? 'Aún no has registrado nada hoy — un registro rápido toma segundos.'
            : 'Nothing logged yet today — a quick add takes seconds.'),
        tone: 'push',
      };
    }
    if (t.remaining < 0) {
      const n = Math.abs(Math.round(t.remaining));
      return {
