          <div class="field"><label for="ob-wt">${O.cw} (${U().weight})</label><input id="ob-wt" type="number" min="${wMin()}" max="${wMax()}" step="0.1" value="${metric() ? 82 : 180}" required></div>
          <div class="field"><label for="ob-gw">${O.gw} (${U().weight})</label><input id="ob-gw" type="number" min="${wMin()}" max="${wMax()}" step="0.1" value="${metric() ? 77 : 170}" required></div>
        </div>
        <div class="field"><label for="ob-act">${O.act}</label>
          <select id="ob-act">${actKeys.map((k, i) => `<option value="${k}">${O.acts[i]}</option>`).join('')}</select></div>
        <div class="field"><label for="ob-rate">${O.rate}</label>
          <select id="ob-rate">${rateVals.map(v => `<option value="${v}" ${v === '-1' ? 'selected' : ''}>${rateLabel(+v)}</option>`).join('')}</select></div>
        <button class="btn" type="submit">${O.go}</button>
        <p class="hint">${O.hint}</p>
      </form>
      <label class="addrow obrestore" for="ob-restore">${es ? '¿Ya usas FuelRing en otro dispositivo? Restaura un respaldo' : 'Already use FuelRing on another device? Restore a backup'}</label>
      <input id="ob-restore" class="vh" type="file" accept=".json,application/json">
    </div>`;
  }
  function webHeroHTML(es) {
    const arcs = [[46, '#F07800', .78], [36, '#0078C8', .62], [26, '#7C4DBE', .46]]; // calories, carbs, fat
    return `<div class="webhero">
      <svg class="heroring" viewBox="0 0 120 120" aria-hidden="true">${arcs.map(([r, c, f], i) => {
        const C = 2 * Math.PI * r;
        return `<circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(127,140,160,.18)" stroke-width="8"/>
        <circle class="arc" style="--i:${i}" cx="60" cy="60" r="${r}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${(C * f).toFixed(1)} ${(C * (1 - f)).toFixed(1)}" transform="rotate(-90 60 60)"/>`;
      }).join('')}</svg>
      <h1>Fuel<em>Ring</em></h1>
      <p class="herotag">${es ? 'Calorías y macros en anillos que se llenan conforme comes.' : 'Calories and macros in rings that fill as you eat.'}</p>
      <ul class="heropoints"><li>${es ? 'Gratis' : 'Free'}</li><li>${es ? 'Sin cuenta' : 'No account'}</li><li>${es ? 'Se queda en tu dispositivo' : 'Stays on your device'}</li></ul>
      ${IS_IOS ? `<p class="hint" style="margin-top:10px">${es ? `¿Prefieres una app? La de iPhone suma el escáner de cámara gratis${iosHas('1.0.2') ? ', Apple Health y widgets' : ' y Apple Health'}.` : `Prefer an app? The iPhone app adds the free camera scanner${iosHas('1.0.2') ? ', Apple Health and widgets' : ' and Apple Health'}.`}</p>
      ${appStoreBadge('obAppStore', es ? 'Descargar en el App Store' : 'Download on the App Store')}` : ''}
    </div>`;
  }
  function bindOnboarding() {
    $('#ob-restore')?.addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) restoreFrom(f, false); });
    document.querySelectorAll('[data-oblang]').forEach(b => b.addEventListener('click', () => {
      state = Core.setLang(state, b.dataset.oblang); render();
    }));
    document.querySelectorAll('[data-obunits]').forEach(b => b.addEventListener('click', () => {
      state = Core.setUnits(state, b.dataset.obunits); render();
    }));
    $('#onbForm').addEventListener('submit', e => {
      e.preventDefault();
      const obName = $('#ob-name').value.trim();
      const profile = {
        ...(obName ? { name: obName } : {}),
        sex: $('#ob-sex').value,
        age: +$('#ob-age').value,
        heightIn: metric() ? Core.fromDisplayLength(state, $('#ob-cm').value) : +$('#ob-ft').value * 12 + +$('#ob-in').value,
        weightLbs: Core.fromDisplayWeight(state, $('#ob-wt').value),
        goalWeightLbs: Core.fromDisplayWeight(state, $('#ob-gw').value),
        activity: $('#ob-act').value,
        rateLbsPerWeek: +$('#ob-rate').value,
        startDate: Core.todayISO(),
      };
      set(Core.completeOnboarding(state, profile));
      toast(state.lang === 'es' ? `Meta diaria: ${fmt(state.goals.calories)} kcal` : `Daily goal: ${fmt(state.goals.calories)} kcal`);
      applyPendingHealth(); // health data that arrived during onboarding lands now
    });
  }

  // ---------- HEADER ----------
  function minibarHTML() {
    const t = Core.dayTotals(state, ui.date), over = t.remaining < 0;
    return `<div class="minibar" id="minibar" aria-hidden="true"><b>Fuel<em>Ring</em></b>
      <span>${esc(dateLabel(ui.date))} · <b class="${over ? 'over' : ''}">${fmt(Math.abs(t.remaining))}</b> ${over ? tr('over') : tr('left')}</span></div>`;
  }
  function minibarSync() {
    const h = document.querySelector('header'), m = $('#minibar');
    if (h && m) m.classList.toggle('show', h.getBoundingClientRect().bottom < 6);
  }
  if (WEB) document.addEventListener('scroll', minibarSync, { passive: true, capture: true }); // the body scrolls, not the window
  function headerHTML() {
    const t = Core.dayTotals(state, ui.date);
    const pct = Math.min(100, t.goal ? (t.food.cal / (t.goal + t.exercise)) * 100 : 0);
    const over = t.remaining < 0;
    return `<header>
      <div class="brand"><h1>Fuel<em>Ring</em></h1><span style="font-size:12px;opacity:.75">${(() => {
        const st = Core.trendStats(state, Core.todayISO(), 30).streak;
        return st >= 2 ? `<span id="streakChip" style="font-weight:800">🔥 ${st}</span> · ` : '';
      })()}${esc(dateLabel(ui.date))}</span></div>
      <div class="datebar">
        <button id="prevDay" aria-label="${tr('Previous day')}">‹</button>
        <span class="dlabel" style="position:relative">${esc(new Date(ui.date+'T12:00:00').toLocaleDateString(LOC(),{month:'long',day:'numeric',year:'numeric'}))} <span style="opacity:.55;font-size:11px">▾</span>
          <input type="date" id="dateJump" value="${ui.date}" aria-label="${tr('Jump to a date')}"
            style="position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0">
        </span>
        <button id="nextDay" aria-label="${tr('Next day')}">›</button>
      </div>
      <div class="equation" aria-label="${tr('Calories remaining equation')}">
        <div class="eq-part"><div class="n">${fmt(t.goal)}</div><div class="l">${tr('Goal')}${(() => {
          const sh = Core.goalsForDate(state, ui.date).shift; // goals by day: ▲ high day, ▼ lighter day
          return sh ? ` <span title="${tr(sh === 'high' ? 'High day' : 'Lighter day')}" aria-label="${tr(sh === 'high' ? 'High day' : 'Lighter day')}">${sh === 'high' ? '▲' : '▼'}</span>` : '';
        })()}</div></div>
        <span class="eq-op">−</span>
        <div class="eq-part"><div class="n">${fmt(t.food.cal)}</div><div class="l">${tr('Food')}</div></div>
        <span class="eq-op">+</span>
        <div class="eq-part"><div class="n">${fmt(t.exercise)}</div><div class="l">${tr('Exercise')}</div></div>
        <span class="eq-op">=</span>
        <div class="eq-part eq-remaining ${over?'over':''}"><div class="n" id="remaining">${fmt(t.remaining)}</div><div class="l">${tr('Remaining')}</div></div>
      </div>
      <div class="goalbar"><i class="${over?'over':''}" style="width:${pct}%"></i></div>
    </header>`;
  }

  // ---------- RING GAUGE ----------
  // Radial progress meter, 12 o'clock start, clockwise. kind: big|sm|mini.
  function ringSVG({ kind, pct, color, center, sub, label }) {
    const size = kind === 'big' ? 110 : kind === 'sm' ? 66 : 56;
    const st = kind === 'big' ? 10 : 7;
    const r = (size - st) / 2, c = size / 2;
    const C = 2 * Math.PI * r;
    const p = Math.max(0, Math.min(100, pct || 0));
    const dash = (p / 100) * C;
    return `<svg class="ring ring-${kind}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label || '')}">
      <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${st}"/>
      ${p > 0 ? `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${st}"
        stroke-dasharray="${dash.toFixed(1)} ${(C - dash).toFixed(1)}" stroke-dashoffset="${(C / 4).toFixed(1)}" stroke-linecap="round"/>` : ''}
      <text x="${c}" y="${sub ? c - 4 : c}" text-anchor="middle" dominant-baseline="central" class="ring-n">${center}</text>
      ${sub ? `<text x="${c}" y="${c + 14}" text-anchor="middle" dominant-baseline="central" class="ring-s">${esc(sub)}</text>` : ''}
    </svg>`;
  }

  // ---------- DIARY ----------
  const MEALS = [['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snacks','Snacks']];
  // [key, label, unit, isLimit] — isLimit values turn red past the target; fiber is a goal to reach
  const MICRO_ROWS = [['fib','Fiber','g',false],['sug','Sugar','g',true],['sod','Sodium','mg',true],['sat','Sat Fat','g',true],['chol','Cholesterol','mg',true]];
  function nutritionHTML(t) {
    const mt = Core.microTargets(state.profile, Core.goalsForDate(state, ui.date).calories);
    const rings = MICRO_ROWS.map(([k, label, unit, isLimit]) => {
      const val = t.food[k], target = mt[k];
      const over = isLimit && val > target;
      const reached = !isLimit && target && val >= target; // fiber goal met
      const color = over ? 'var(--red)' : reached ? 'var(--green)' : 'var(--blue)';
      return `<div class="nutring" id="nut-${k}">
        ${ringSVG({ kind: 'mini', pct: target ? (val / target) * 100 : 0, color, center: Math.round(val), label: `${tr(label)} ${Math.round(val)} of ${target}${unit}` })}
        <span class="nl">${tr(label)}</span>
        <span class="nv ${over?'over':''}"><b>${Math.round(val)}</b>/${target}${unit}</span>
      </div>`;
    }).join('');
    return `<button class="nut-toggle" id="nutToggle" aria-expanded="${ui.nutritionOpen}">${tr('Nutrition')} <span class="car">▾</span></button>
      ${ui.nutritionOpen ? `<div class="nutrings">${rings}</div>` : ''}`;
  }
  function diaryHTML() {
    const t = Core.dayTotals(state, ui.date);
    const g = Core.goalsForDate(state, ui.date);
    const over = t.remaining < 0;
    const macroRing = (label, val, goal, color) => `<div class="ringcell">
      ${ringSVG({ kind: 'sm', pct: goal ? (val / goal) * 100 : 0, color, center: Math.round(val), label: `${tr(label)} ${Math.round(val)} of ${goal} grams` })}
      <span class="rl">${tr(label)}</span>
      <span class="rv"><b>${Math.round(val)}</b>/${goal}g</span>
    </div>`;
    let html = `<div class="card"><div class="dash">
      <div class="ringcell" style="flex:0 0 auto">
        ${ringSVG({ kind: 'big', pct: t.goal + t.exercise ? (t.food.cal / (t.goal + t.exercise)) * 100 : 0,
          color: over ? 'var(--red)' : 'var(--green)', center: fmt(Math.abs(t.remaining)), sub: over ? tr('kcal over') : tr('kcal left'),
          label: `${fmt(Math.abs(t.remaining))} calories ${over ? 'over' : 'remaining'}` })}
        <span class="rl">${tr('Calories')}</span>
      </div>
      <div class="dash-macros">
        ${state.netCarbs
          ? macroRing('Net Carbs', Core.netCarbs(t.food), g.carbs, 'var(--blue)')
          : macroRing('Carbs', t.food.c, g.carbs, 'var(--blue)')}
        ${macroRing('Protein', t.food.p, g.protein, 'var(--orange)')}
        ${macroRing('Fat', t.food.f, g.fat, 'var(--viol)')}
      </div>
    </div>${nutritionHTML(t)}</div>`;
    // daily coach — only for today; yesterday doesn't need a pep talk
    if (ui.date === Core.todayISO()) {
      if (!isPro()) {
        html += `<button class="card coach" id="coachLocked" style="width:100%;text-align:left;border:1px solid var(--line);cursor:pointer">🔒 ${tr('Daily coach insights — see what your numbers say')} · <b style="color:var(--orange)">Pro</b></button>`;
      } else {
        const coach = Core.coachInsight(state, FOOD_DB, ui.date, new Date().getHours());
        if (coach) html += `<div class="card coach coach-${coach.tone}" id="coach">💡 ${esc(coach.text)}</div>`;
      }
    }
    html += installTipHTML(); // web only: install it / add it to the Home Screen, once
    // asked only where synced workouts could be counted twice: not before Pro
    // (the flag waits for it), and not with a measured burn (the level is unused)
    if (state.activityReview && workoutsSync() && !Number.isFinite(state.profile.tdeeOverride)) html += activityReviewHTML();
    // water — quick-tap tracker, Cronometer-style
    const cups = Core.waterFor(state, ui.date);
    const goalCups = state.waterGoal || 8;
    html += `<div class="card"><div class="dash" style="padding:10px 14px">
      <div class="ringcell" style="flex:0 0 auto">
        ${ringSVG({ kind: 'sm', pct: (cups / goalCups) * 100, color: 'var(--blue)', center: cups, label: `${cups} of ${goalCups} cups of water` })}
      </div>
      <div style="flex:1">
        <div class="rl" style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)">${tr('Water')}</div>
        <div class="hint" style="margin-top:2px"><span id="waterCount">${cups}</span>/${goalCups} ${tr('cups')}</div>
      </div>
      <div class="stepper" style="margin:0;gap:10px">
        <button id="waterDown" aria-label="${tr('Remove a cup of water')}">−</button>
        <button id="waterUp" aria-label="${tr('Add a cup of water')}">+</button>
      </div>
    </div></div>`;
    // last night's sleep (the night that ended on this day) — opens the Sleep area
    const night = (state.sleep || {})[ui.date];
    if (night) {
      html += `<button class="card sleepstrip" id="sleepStrip">
        <span style="font-size:20px">😴</span>
        <span style="flex:1;min-width:0"><b>${ui.date === Core.todayISO() ? tr('Last night') : tr('Sleep')} · ${sleepText(night.minutes)}</b>
          <span class="hint" style="display:block;margin-top:1px">${sleepClock(night.start)} – ${sleepClock(night.end)}${night.source ? ' · ' + esc(night.source) : ''}</span></span>
        <span style="color:var(--mut);font-size:18px">›</span>
      </button>`;
    }
    // weekly budget strip — real life is weekly, not daily: calories saved
    // earlier in the week are "banked" for the weekend. Factual, no judgment.
    const wb = Core.weekBudget(state, ui.date);
    const wbShown = wb ? wb.days.filter(d => d.logged && !d.future).length : 0;
    if (wb && wbShown > 0) {
      const isEs = state.lang === 'es';
      const bank = wb.banked >= 0
        ? (isEs ? `<b>+${fmt(wb.banked)}</b> kcal a favor esta semana` : `<b>+${fmt(wb.banked)}</b> kcal banked this week`)
        : (isEs ? `<b>${fmt(-wb.banked)}</b> kcal de más esta semana` : `<b>${fmt(-wb.banked)}</b> kcal over so far this week`);
      const dow = isEs ? ['D', 'L', 'M', 'M', 'J', 'V', 'S'] : ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const dots = wb.days.map((d, i) => `<span class="wbd ${d.today ? 'now' : d.future ? 'fut' : d.logged ? 'on' : ''}">${dow[i]}</span>`).join('');
      html += `<div class="card" id="weekBudget" style="padding:10px 14px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div>
            <div class="rl" style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)">${tr('This week')}</div>
            <div class="hint" style="margin-top:2px" id="wbBank">${bank} · ${wbShown} ${wbShown === 1 ? tr('day logged') : tr('days logged')}</div>
          </div>
          <div class="wbdots">${dots}</div>
        </div>
      </div>`;
    }
    const yd = new Date(ui.date + 'T12:00:00'); yd.setDate(yd.getDate() - 1);
    const yIso = Core.todayISO(yd);
    for (const [key, label] of MEALS) {
      const entries = Core.day(state, ui.date).meals[key];
      const mt = Core.mealTotals(state, ui.date, key);
      const yHas = Core.day(state, yIso).meals[key].length > 0;
      html += `<section class="card" aria-label="${tr(label)}">
        <div class="card-h"><h2>${tr(label)}</h2><span class="kcal">${fmt(mt.cal)} kcal</span></div>
        ${entries.length ? `<div class="mmac"><span><b>${Math.round(mt.c)}</b>g ${tr('Carbs')}</span><span><b>${Math.round(mt.p)}</b>g ${tr('Protein')}</span><span><b>${Math.round(mt.f)}</b>g ${tr('Fat')}</span></div>` : ''}
        ${entries.map(e => `<div class="entry tapme" data-editentry="${key}:${e.entryId}" role="button" tabindex="0" aria-label="${tr('Edit')} ${esc(e.name)}"><div><div class="en">${esc(e.name)}</div><div class="es">${esc(Core.entryUnitText(state, e) || `${e.serving} × ${e.servings}`)}</div></div>
          <div style="display:flex;align-items:center;gap:4px"><span class="ecal">${fmt(e.cal)}</span>
          <button class="del" data-del="${key}:${e.entryId}" aria-label="Remove ${esc(e.name)}">✕</button></div></div>`).join('')}
        <div class="mealrow">
          <button class="addrow" data-addmeal="${key}">${tr('+ Add Food')}</button>
          ${yHas ? `<button class="addrow tool" data-copymeal="${key}" aria-label="Copy yesterday's ${label}">${tr('⧉ Yesterday')}</button>` : ''}
          ${entries.length ? `<button class="addrow tool" data-savemeal="${key}" aria-label="Save ${label} as a meal">${tr('☆ Save meal')}</button>` : ''}
        </div>
      </section>`;
    }
    const ex = Core.day(state, ui.date).exercise;
    html += `<section class="card" aria-label="${tr('Exercise')}">
      <div class="card-h"><h2>${tr('Exercise')}</h2><span class="kcal">${fmt(t.exercise)} ${tr('kcal earned')}</span></div>
      ${ex.map(e => `<div class="entry${e.src === 'health' ? '' : ' tapme'}"${e.src === 'health' ? '' : ` data-editex="${e.entryId}" role="button" tabindex="0" aria-label="${tr('Edit')} ${esc(e.name)}"`}><div><div class="en">${esc(e.name)}</div><div class="es">${e.src === 'health' ? 'Apple Health' : e.minutes + ' min'}</div></div>
        <div style="display:flex;align-items:center;gap:4px"><span class="ecal" style="color:var(--green)">+${fmt(e.cal)}</span>
        <button class="del" data-delex="${e.entryId}" aria-label="Remove ${esc(e.name)}">✕</button></div></div>`).join('')}
      ${healthExRowsHTML(t.health)}
      <button class="addrow" data-addex="1">${tr('+ Add Exercise')}</button>
    </section>`;
    const hasFood = MEALS.some(([k]) => Core.day(state, ui.date).meals[k].length);
    html += `<div class="card">${hasFood ? `<button class="addrow" id="completeDay" style="text-align:center">${tr('✓ Complete diary')}</button>` : ''}
      <button class="addrow" id="shareDay" style="text-align:center">${tr('📤 Share day summary')}</button></div>`;
    return html;
  }

  // Asked once of users who picked a level under the old "workouts/week"
  // labels (Core.deserialize sets state.activityReview): workouts now count on
  // their own, so the level should describe the day without them. One tap
  // re-picks (goals recalc) — the current level is listed too, to keep it.
  function activityReviewHTML() {
    const es = state.lang === 'es', cur = state.profile.activity;
    const opts = es
      ? [['sedentary', 'Sedentario — casi todo el día sentado'], ['light', 'Poco activo — de pie parte del día'],
        ['active', 'Activo — de pie casi todo el día'], ['very', 'Muy activo — trabajo físico todo el día']]
      : [['sedentary', 'Sedentary — mostly sitting'], ['light', 'Lightly active — on your feet part of the day'],
        ['active', 'Active — on your feet most of the day'], ['very', 'Very active — physical work all day']];
    return `<div class="card" id="activityReview" style="padding:14px 14px 4px">
      <div style="font-weight:800;color:var(--navy)">${es ? 'Tus entrenamientos ahora cuentan solos' : 'Your workouts now count on their own'}</div>
      <p class="hint" style="margin-top:4px">${es
        ? 'Tu nivel de actividad ahora describe tu día sin contar el ejercicio, para que los entrenamientos no se cuenten dos veces. ¿Cuál se parece más a tu día?'
        : 'Your activity level now describes your day without workouts, so workouts aren’t counted twice. Which fits your day?'}</p>
      ${opts.map(([k, l]) => `<button class="addrow" data-actpick="${k}" style="text-align:left;padding-left:0${k === cur ? ';font-weight:800' : ''}">${l}${k === cur ? (es ? ' · actual' : ' · current') : ''}</button>`).join('')}
    </div>`;
  }

  // How a Garmin, Fitbit or Strava reaches FuelRing on an iPhone: through
  // Apple Health, which those apps write to once it's switched on in each of
  // them. (Since Aug 2026 the Fitbit app, now "Google Health", can write to
  // Apple Health; there is no direct Garmin/Fitbit/Strava connection — that
  // would mean accounts and servers, which FuelRing doesn't have.)
  function trackerGuideHTML() {
    const es = state.lang === 'es';
    const items = es ? [
      ['Apple Watch y iPhone', 'ya escriben en Apple Health; no hay que hacer nada.'],
      ['Garmin', 'en la app Garmin Connect: Configuración → Apps conectadas → Apple Health, y actívalo.'],
      ['Fitbit', 'en la app Google Health: Conexiones → Apps y servicios → Apple Health, y activa todas las categorías.'],
      ['Strava', 'Configuración → Aplicaciones, servicios y dispositivos → Salud → Enviar a Salud.'],
    ] : [
      ['Apple Watch and iPhone', 'already write to Apple Health — nothing to do.'],
      ['Garmin', 'in the Garmin Connect app: Settings → Connected Apps → Apple Health, and turn it on.'],
      ['Fitbit', 'in the Google Health app: Connections → Apps and services → Apple Health, and turn all categories on.'],
      ['Strava', 'Settings → Applications, Services, and Devices → Health → Send to Health.'],
    ];
    return `<details class="guide" id="trackerGuide"${ui.trackerGuideOpen ? ' open' : ''}>
      <summary>${es ? '¿Usas Garmin, Fitbit o Strava?' : 'Using Garmin, Fitbit or Strava?'}</summary>
      <p>${es ? 'FuelRing lee Apple Health, así que todo lo que esas apps guarden ahí llega solo:' : 'FuelRing reads Apple Health, so anything those apps save there comes in on its own:'}</p>
      <ul>${items.map(([who, how]) => `<li><b>${who}</b> — ${how}</li>`).join('')}</ul>
      <p>${es
        ? 'Luego toca “Sincronizar con Apple Health”. Si dos apps guardan el mismo entrenamiento, cuenta una vez. ¿Usas un reloj y también traes el iPhone? En la app Salud, en Pasos → Fuentes de datos y acceso, pon primero la app de tu reloj para que sus números ganen.'
        : 'Then tap “Sync with Apple Health”. If two apps save the same workout, it counts once. Wearing a tracker and carrying your iPhone too? In the Health app, under Steps → Data Sources & Access, put your tracker’s app first so its numbers win.'}</p>
    </details>`;
  }

  // What Apple Health earned (Core.healthExercise): each synced workout in
  // full, then everyday movement beyond the activity level. Derived from the
  // synced data, not diary entries (nothing to edit or delete; a re-sync
  // replaces it), and shown with its arithmetic so a small or zero number
  // never reads as a broken sync.
  function healthExRowsHTML(h) {
    if (!h || h.imported) return ''; // the imported "Active energy" entry already shows that day
    const es = state.lang === 'es';
    const inMeasured = es ? 'ya incluido en tu gasto medido' : 'already in your measured burn';
    const row = (attrs, name, how, kcal) => `<div class="entry" ${attrs}><div><div class="en">${esc(name)}</div><div class="es">${how}</div></div>
      <div style="display:flex;align-items:center;gap:4px"><span class="ecal" style="color:var(--green)">+${fmt(kcal)}</span></div></div>`;
    const handNote = es ? 'ya registrado a mano' : 'also logged by hand';
    let html = h.workouts.map(w => row(`data-hkw="${esc(w.id)}"`, Core.workoutName(w.type, state.lang),
      `${fmt(w.minutes)} min · ${esc(w.source || 'Apple Health')}${w.est ? (es ? ' · estimado' : ' · estimated') : ''}${w.loggedAs ? ' · ' + handNote : ''}${h.measured ? ' · ' + inMeasured : ''}`,
      w.counted)).join('');
    if (h.active > 0) {
      const how = h.measured
        ? `${fmt(h.active)} kcal ${es ? 'activas' : 'active'} · ${inMeasured}`
        : `${fmt(h.active)} kcal ${es ? 'activas' : 'active'}`
          + (h.workoutKcal ? ` − ${fmt(h.workoutKcal)} ${es ? 'en entrenamientos' : 'in workouts'}` : '')
          + (h.loggedApart ? ` − ${fmt(h.loggedApart)} ${es ? 'registradas' : 'logged'}` : '')
          + ` − ${fmt(h.included)} ${es ? 'ya en tu meta' : 'already in your goal'}`;
      html += row('id="healthEx"', tr('Everyday movement'), how, h.movement);

    return html;

  // ---------- PROGRESS ----------
  function weekChartSVG(days, goal) {
    const W = 420, H = 120, P = 20, gap = 2;
    // with goals by day each bar is judged against its own day's goal, and the
    // single goal line becomes a tick per day
    const goals = days.map(d => d.goal != null ? d.goal : goal);
    const even = goals.every(x => x === goals[0]);
    const max = Math.max(...goals, ...days.map(d => d.cal)) * 1.1 || 1;
    const bw = (W - 2 * P) / 7 - gap;
    const y = v => H - P - (v / max) * (H - 2 * P);
    const gy = y(goal);
    const DOW = state.lang === 'es' ? ['Do','Lu','Ma','Mi','Ju','Vi','Sá'] : ['Su','Mo','Tu','We','Th','Fr','Sa'];
    const dow = iso => DOW[new Date(iso + 'T12:00:00').getDay()];
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calories per day, last 7 days">
      ${days.map((d, i) => {
        const x = P + i * (bw + gap) + gap / 2;
        const h = Math.max(0, H - P - y(d.cal));
        return `<rect x="${x.toFixed(1)}" y="${y(d.cal).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3"
          fill="${d.cal > goals[i] ? 'var(--red)' : 'var(--blue)'}"><title>${d.date}: ${d.cal} kcal</title></rect>
        ${even ? '' : `<line x1="${(x - 1).toFixed(1)}" y1="${y(goals[i]).toFixed(1)}" x2="${(x + bw + 1).toFixed(1)}" y2="${y(goals[i]).toFixed(1)}" stroke="var(--orange)" stroke-width="2"/>`}
        <text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--mut)">${dow(d.date)}</text>`;
      }).join('')}
      ${even ? `<line x1="${P}" y1="${y(goals[0]).toFixed(1)}" x2="${W - P}" y2="${y(goals[0]).toFixed(1)}" stroke="var(--orange)" stroke-dasharray="5 4" stroke-width="1.5"/>
      <text x="${W - P}" y="${(y(goals[0]) - 5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--orange)">${tr('goal')}</text>` : ''}
    </svg>`;
  }
  function trendChartSVG(series, goal) {
    const W = 420, H = 130, P = 18;
    const max = Math.max(goal, ...series.map(d => d.cal), ...series.map(d => d.goal || 0)) * 1.1 || 1;
    const n = series.length;
    const bw = Math.max(1.5, (W - 2 * P) / n - 1);
    const y = v => H - P - (v / max) * (H - 2 * P);
    const gy = y(goal);
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calories per day, last ${n} days">
      ${series.map((d, i) => {
        const x = P + i * ((W - 2 * P) / n);
        const h = Math.max(0, H - P - y(d.cal));
        return d.cal ? `<rect x="${x.toFixed(1)}" y="${y(d.cal).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1"
          fill="${d.cal > (d.goal != null ? d.goal : goal) ? 'var(--red)' : 'var(--blue)'}"><title>${d.date}: ${d.cal} kcal</title></rect>` : '';
      }).join('')}
      <line x1="${P}" y1="${gy.toFixed(1)}" x2="${W - P}" y2="${gy.toFixed(1)}" stroke="var(--orange)" stroke-dasharray="5 4" stroke-width="1.5"/>
      <text x="${W - P}" y="${(gy - 5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--orange)">${tr('goal')}</text>
      <text x="${P}" y="${H - 4}" font-size="9" fill="var(--mut)">${series[0].date}</text>
      <text x="${W - P}" y="${H - 4}" text-anchor="end" font-size="9" fill="var(--mut)">${series[series.length - 1].date}</text>
    </svg>`;
  }
  function trendsHTML(days) {
    const t = Core.trendStats(state, ui.date, days);
    const g = state.goals;
    const calOver = t.avgCal > g.calories;
    return `<div class="card">
      <div class="card-h"><h2>${tr('Last')} ${days} ${tr('days')}</h2><span class="kcal">${t.daysLogged}/${days} ${tr('days logged')}</span></div>
      <div class="dash" id="trendDash">
        <div class="ringcell">
          ${ringSVG({ kind: 'sm', pct: g.calories ? (t.avgCal / g.calories) * 100 : 0, color: calOver ? 'var(--red)' : 'var(--green)',
            center: fmt(t.avgCal), label: `average ${t.avgCal} of ${g.calories} calories` })}
          <span class="rl">${tr('Avg kcal')}</span><span class="rv"><b>${fmt(t.avgCal)}</b>/${fmt(g.calories)}</span>
        </div>
        <div class="ringcell">
          ${ringSVG({ kind: 'sm', pct: (t.daysLogged / days) * 100, color: 'var(--blue)',
            center: Math.round((t.daysLogged / days) * 100) + '%', label: `${t.daysLogged} of ${days} days logged` })}
          <span class="rl">${tr('Consistency')}</span><span class="rv"><b>${t.daysLogged}</b>/${days} ${tr('days')}</span>
        </div>
        <div class="ringcell">
          ${ringSVG({ kind: 'sm', pct: Math.min(100, (t.streak / 30) * 100), color: 'var(--orange)',
            center: t.streak, label: `${t.streak} day logging streak` })}
          <span class="rl">${tr('Streak')}</span><span class="rv"><b>${t.streak}</b> ${t.streak === 1 ? tr('day') : tr('days')}</span>
        </div>
      </div>
      <div class="chart-wrap" style="padding-top:0">${trendChartSVG(t.series, g.calories)}</div>
    </div>
    <div class="card">
      <div class="card-h"><h2>${tr('Weight')}</h2><span class="kcal">${t.weightChange != null ? (t.weightChange > 0 ? '+' : '') + dW(t.weightChange) + ' ' + U().weight + ' ' + tr('in range') : tr('not enough weigh-ins')}</span></div>
      <div class="chart-wrap">${weightChartSVG(t.weightsInRange, state.profile.goalWeightLbs)}</div>
    </div>`;
  }
  // ---------- SLEEP ----------
  // Sleep comes from Apple Health (live sync): Apple Watch, Fitbit via the
  // Google Health app, Oura, Garmin… Core.sleepRange does the math; the
  // Progress card shows the week and opens the Sleep area (ui.tab 'sleep'),
  // which the diary's last-night strip opens too.
  const sleepText = m => {
    const h = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0');
    if (!h) return state.lang === 'es' ? `${m % 60} min` : `${m % 60}m`; // a nap reads "30m", not "0h 30m"
    return state.lang === 'es' ? `${h} h ${mm} min` : `${h}h ${mm}m`;
  };
  const sleepClock = ms => new Date(ms).toLocaleTimeString(LOC(), { hour: 'numeric', minute: '2-digit' });
  const clockOfDay = min => sleepClock(new Date(2000, 0, 1, Math.floor(min / 60), min % 60).getTime());
  const STAGES = () => state.lang === 'es'
    ? [['deep', 'Profundo', 'var(--deep)'], ['core', 'Esencial', 'var(--blue)'], ['rem', 'REM', 'var(--viol)'], ['awake', 'Despierto', 'var(--orange)']]
    : [['deep', 'Deep', 'var(--deep)'], ['core', 'Core', 'var(--blue)'], ['rem', 'REM', 'var(--viol)'], ['awake', 'Awake', 'var(--orange)']];
  // one night: ring vs 7 h, duration, bed–wake, source, nap (+ stages)
  function sleepNightHTML(date, n, big) {
    const es = state.lang === 'es';
    const when = date === Core.todayISO() ? tr('Last night')
      : new Date(date + 'T12:00:00').toLocaleDateString(LOC(), { weekday: 'short', month: 'short', day: 'numeric' });
    const stages = STAGES().filter(([k]) => k !== 'awake' && n[k] > 0);
    return `<div class="dash">
        <div class="ringcell" style="flex:0 0 auto">
          ${ringSVG({ kind: big ? 'big' : 'sm', pct: (n.minutes / 420) * 100, color: 'var(--viol)',
            center: `${Math.floor(n.minutes / 60)}:${String(n.minutes % 60).padStart(2, '0')}`, label: `${sleepText(n.minutes)} ${es ? 'de sueño' : 'of sleep'}` })}
        </div>
        <div style="flex:1;min-width:0">
          <div class="rl" style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)">${esc(when)}</div>
          <div style="font-size:${big ? 26 : 20}px;font-weight:800;color:var(--ink);line-height:1.2">${sleepText(n.minutes)}</div>
          <div class="hint" style="margin-top:2px">${sleepClock(n.start)} – ${sleepClock(n.end)}${n.source ? ' · ' + esc(n.source) : ''}${n.nap ? ` · +${sleepText(n.nap)} ${es ? 'de siesta' : 'nap'}` : ''}</div>
          ${!big && stages.length ? `<div class="hint" style="margin-top:2px" id="sleepStages">${stages.map(([k, l]) => `${l} ${sleepText(n[k])}`).join(' · ')}</div>` : ''}
        </div>
      </div>`;
  }
  // the night's stages as one bar (big view only, when the tracker records stages)
  function stageBarHTML(n) {
    const parts = STAGES().filter(([k]) => n[k] > 0);
    if (!parts.some(([k]) => k !== 'awake')) return '';
    return `<div class="stagebar" id="sleepStageBar" role="img" aria-label="${esc(parts.map(([k, l]) => `${l} ${sleepText(n[k])}`).join(', '))}">
        ${parts.map(([k, , c]) => `<span style="flex:${n[k]};background:${c}"></span>`).join('')}</div>
      <div class="stagelegend">${parts.map(([k, l, c]) => `<span><i style="background:${c}"></i>${l} ${sleepText(n[k])}</span>`).join('')}</div>`;
  }
  // a bar per night against the 7-hour line (weekday labels for a week, dates for longer)
  function sleepChartSVG(r) {
    const n = r.nights.length, W = 420, H = 120, P = 20, gap = n > 7 ? 1 : 2;
    const max = Math.max(r.target, ...r.nights.map(x => x.minutes)) * 1.1;
    const bw = Math.max(1.5, (W - 2 * P) / n - gap);
    const y = v => H - P - (v / max) * (H - 2 * P);
    const DOW = state.lang === 'es' ? ['Do','Lu','Ma','Mi','Ju','Vi','Sá'] : ['Su','Mo','Tu','We','Th','Fr','Sa'];
    // longer ranges: a date every week (30) or month (90), counted back from the last night
    const label = (x, i) => n <= 7 ? DOW[new Date(x.date + 'T12:00:00').getDay()]
      : (n - 1 - i) % (n > 30 ? 30 : 7) === 0 ? x.date.slice(5).replace('-', '/') : '';
    const ty = y(r.target);
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(tr('Sleep'))}, ${n}">
      ${r.nights.map((x, i) => {
        const bx = P + i * (bw + gap) + gap / 2, t = label(x, i);
        return `${x.minutes ? `<rect x="${bx.toFixed(1)}" y="${y(x.minutes).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, H - P - y(x.minutes)).toFixed(1)}" rx="${n > 7 ? 1 : 3}"
          fill="var(--viol)"><title>${x.date}: ${sleepText(x.minutes)}</title></rect>` : ''}
        ${t ? `<text x="${(bx + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--mut)">${t}</text>` : ''}`;
      }).join('')}
      <line x1="${P}" y1="${ty.toFixed(1)}" x2="${W - P}" y2="${ty.toFixed(1)}" stroke="var(--orange)" stroke-dasharray="5 4" stroke-width="1.5"/>
      <text x="${W - P}" y="${(ty - 5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--orange)">${r.target / 60} h</text>
    </svg>`;
  }
  // Progress: the week at a glance; "See all" (or the card itself) opens the Sleep area
  function sleepHTML() {
    const wk = Core.sleepRange(state, ui.date, 7);
    const hasAny = Object.keys(state.sleep || {}).length > 0;
    if (!wk.count) {
      if (!hasAny && !window.ReactNativeWebView) return ''; // the file version can't sync sleep
      return `<button class="card sleepstrip" id="sleepTeaser">
        <span style="font-size:20px">😴</span>
        <span style="flex:1;min-width:0"><b>${tr('Sleep')}</b><span class="hint" style="display:block;margin-top:1px">${hasAny
          ? tr('No sleep recorded this week')
          : tr('See your nights from Apple Health or Google Health')}</span></span>
        <span style="color:var(--mut);font-size:18px">›</span>
      </button>`;
    }
    const n = wk.recorded[0];
    return `<div class="card" id="sleepCard">
      <div class="card-h"><h2>${tr('Sleep')}</h2><button class="kcal" id="sleepOpen" style="background:none;border:0;cursor:pointer;color:var(--blue);font:inherit;font-weight:700">${tr('See all')} ›</button></div>
      ${sleepNightHTML(n.date, n, false)}
      <div class="chart-wrap" style="padding-top:0">${sleepChartSVG(wk)}</div>
      <p class="hint" style="padding:0 14px 12px;margin-top:0">${tr('7-night avg')} ${sleepText(wk.avg)} · ${tr('Adults need 7 or more hours of sleep a night.')}</p>
    </div>`;
  }
  // the Sleep area
  function sleepPageHTML() {
    const es = state.lang === 'es';
    const range = ui.sleepRange || 'week';
    const back = `<button class="addrow" id="sleepBack" style="padding:12px 2px 0;border:0">‹ ${tr('Progress')}</button>`;
    if (!Object.keys(state.sleep || {}).length) {
      const steps = es ? [
        ['Fitbit', 'en la app Google Health: Conexiones → Apps y servicios → Apple Health, y activa todas las categorías.'],
        ['Apple Watch', 'en la app Salud, configura Sueño y usa el reloj para dormir.'],
        ['Oura, Garmin y otros', 'activa Apple Health en su app.'],
      ] : [
        ['Fitbit', 'in the Google Health app: Connections → Apps and services → Apple Health, and turn all categories on.'],
        ['Apple Watch', 'set up Sleep in the Health app and wear the watch to bed.'],
        ['Oura, Garmin and others', 'turn on Apple Health in their app.'],
      ];
      return back + `<div class="card" id="sleepEmpty" style="padding:18px 16px">
        <div style="font-size:30px">😴</div>
        <div style="font-weight:800;color:var(--navy);font-size:17px;margin-top:4px">${tr('No sleep yet')}</div>
        <p class="hint">${tr('Your nights show up here from Apple Health — whatever your watch or ring saves there.')}</p>
        <ul class="hint" style="padding-left:18px;margin:6px 0 0">${steps.map(([w, h]) => `<li style="margin:5px 0"><b style="color:var(--ink)">${w}</b> — ${h}</li>`).join('')}</ul>
        ${window.ReactNativeWebView
          ? `<p class="hint">${tr('Then tap “Sync with Apple Health” in Settings and allow Sleep.')}</p>
             <button class="btn sec" id="sleepToSettings">${tr('Open Apple Health settings')}</button>`
          : `<p class="hint">${tr('Sleep syncs in the FuelRing iPhone app.')}</p>`}
      </div>`;
    }
    const days = range === 'week' ? 7 : +range;
    const r = Core.sleepRange(state, ui.date, days);
    const seg = `<div class="seg" style="margin-top:10px">${[['week', tr('Week')], ['30', tr('30 Days')], ['90', tr('90 Days')]]
      .map(([k, l]) => `<button data-srange="${k}" class="${range === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    const last = r.recorded[0];
    const hero = last
      ? `<div class="card" id="sleepHero" style="padding-bottom:12px">${sleepNightHTML(last.date, last, true)}<div style="padding:0 14px">${stageBarHTML(last)}</div></div>`
      : `<div class="card" style="padding:14px"><p class="hint" style="margin:0">${tr('No sleep recorded in this range.')}</p></div>`;
    const stat = (v, l) => `<div><div class="bignum" style="font-size:22px">${v}</div><div class="sl">${l}</div></div>`;
    const stats = r.count ? `<div class="card" id="sleepStats"><div class="stat-row" style="flex-wrap:wrap;row-gap:12px">
        ${stat(sleepText(r.avg), tr('Average'))}
        ${stat(`${r.atTarget}/${r.count}`, tr('Nights 7 h+'))}
      </div><div class="stat-row" style="padding-top:0">
        ${stat(clockOfDay(r.avgBed), tr('Avg bedtime'))}
        ${stat(clockOfDay(r.avgWake), tr('Avg wake-up'))}
      </div>
      <div class="chart-wrap" style="padding-top:0">${sleepChartSVG(r)}</div></div>` : '';
    const list = r.count ? `<section class="card" id="sleepNights" aria-label="${tr('Nights')}">
        <div class="card-h"><h2>${tr('Nights')}</h2><span class="kcal">${r.count}</span></div>
        ${r.recorded.map(n => `<div class="entry"><div><div class="en">${esc(new Date(n.date + 'T12:00:00').toLocaleDateString(LOC(), { weekday: 'short', month: 'short', day: 'numeric' }))}</div>
          <div class="es">${sleepClock(n.start)} – ${sleepClock(n.end)}${n.source ? ' · ' + esc(n.source) : ''}${n.nap ? ` · +${sleepText(n.nap)} ${es ? 'de siesta' : 'nap'}` : ''}</div></div>
          <span class="ecal" style="white-space:nowrap;color:${n.minutes >= r.target ? 'var(--viol)' : 'var(--mut)'}">${sleepText(n.minutes)}</span></div>`).join('')}
      </section>` : '';
    return back + seg + hero + stats + list +
      `<p class="hint" style="padding:0 6px 16px">${tr('Adults need 7 or more hours of sleep a night.')} ${tr('Your nights show up here from Apple Health — whatever your watch or ring saves there.')}</p>`;
  }
  function progressHTML() {
    const RANGES = [['week', tr('Week')], ['30', tr('30 Days')], ['90', tr('90 Days')]];
    const seg = `<div class="seg" style="margin-top:12px">${RANGES.map(([k, l]) =>

    const checkin = `<div class="card" style="padding:14px">
      <div class="field"><label for="ci-wt">${tr('Weight check-in')} (${U().weight})</label><input id="ci-wt" type="number" step="0.1" min="${wMin()}" max="${wMax()}" value="${dW(cur)}"></div>

    </div>`;
    if (ui.range !== 'week' && !isPro()) ui.range = 'week'; // entitlement revoked mid-view
    if (ui.range !== 'week') return seg + trendsHTML(+ui.range) + checkin;
    const start = w.length ? w[0].lbs : cur;
    const goal = state.profile.goalWeightLbs;
    const wk = Core.weeklyStats(state, ui.date);

    const calOver = wk.avgCal > g.calories;
    const steps = Core.latestSteps(state);
    return seg + `<div class="card">
      <div class="card-h"><h2>${tr('This week')}</h2><span class="kcal">${wk.daysLogged}/7 ${tr('days logged')}</span></div>

        </div>
        <div class="ringcell">
          ${ringSVG({ kind: 'sm', pct: g.protein ? (wk.avgProtein / g.protein) * 100 : 0, color: 'var(--orange)',
            center: wk.avgProtein, label: `average ${wk.avgProtein} of ${g.protein} grams protein` })}

        </div>
        ${steps ? `<div class="ringcell" id="stepsRing">

        ${(() => { const burn = Core.latestBurn(state); return burn ? `<div class="ringcell" id="burnRing">

        </div>` : ''; })()}
      </div>
      <div class="chart-wrap" style="padding-top:0">${weekChartSVG(wk.days, g.calories)}</div>
    </div>
    ${sleepHTML()}
    ${weeklyNutritionHTML()}
    ${(() => {
      const b = Core.streakBadge(wk.daysLogged >= 0 ? Core.trendStats(state, ui.date, 90).streak : 0);

      return `<div class="card" id="streakCard">
        <div class="card-h"><h2>${tr('Streak')}</h2><span class="kcal">${b.earned ? '🏅 ' + tr(b.earned.label) : tr('first badge at 3 days')}</span></div>
        <div class="dash">
          <div class="ringcell" style="flex:0 0 auto">
            ${ringSVG({ kind: 'sm', pct: b.next ? (b.streak / b.next.days) * 100 : 100, color: 'var(--orange)',
              center: '🔥' + b.streak, label: `${b.streak} day logging streak` })}
          </div>
          <div style="flex:1">
            <div class="rl" style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)">${state.lang === 'es' ? `Racha de ${b.streak} ${b.streak === 1 ? 'día' : 'días'}` : `${b.streak}-day streak`}</div>
            <div class="hint" style="margin-top:2px">${b.next ? `${b.daysToNext} ${b.daysToNext === 1 ? tr('day') : tr('days')} ${tr('to')} 🏅 ${tr(b.next.label)}` : tr('Legend — the top badge. Respect.')}</div>
          </div>
        </div>
      </div>`;
    })()}
    ${fastingHTML()}
    <div class="card"><div class="stat-row">
        <div><div class="bignum">${dW(cur)}</div><div class="sl">${tr('Current')} (${U().weight})</div></div>
        <div><div class="bignum" style="color:var(--mut)">${dW(start)}</div><div class="sl">${tr('Start')}</div></div>
        <div><div class="bignum" style="color:var(--orange)">${dW(goal)}</div><div class="sl">${tr('Goal')}</div></div>
      </div>
      <div class="chart-wrap">${weightChartSVG(w, goal)}</div>
    </div>
    ${(() => {
      const fc = Core.goalForecast(state, Core.todayISO());
      if (!fc) return '';
      const fmt = d => new Date(d + 'T12:00:00').toLocaleDateString(LOC(), { month: 'short', day: 'numeric', year: 'numeric' });
      const signed = n => (n > 0 ? '+' : '') + dW(n);
      const isEs = state.lang === 'es', u = U().weight;
      if (fc.reached) return `<div class="card" id="forecastCard" style="padding:14px"><b>${tr("🎉 You're at your goal weight.")}</b>
        <p class="hint" style="margin:4px 0 0">${tr('Nice work — adjust your goal in Settings if you want a new target.')}</p></div>`;
      const lines = [];
      if (fc.planDate) lines.push(isEs
        ? `Con tu plan (${signed(state.profile.rateLbsPerWeek)} ${u}/sem) llegas a <b>${dW(fc.goal)} ${u}</b> alrededor del <b>${fmt(fc.planDate)}</b>.`
        : `On your plan (${signed(state.profile.rateLbsPerWeek)} ${u}/wk) you reach <b>${dW(fc.goal)} ${u}</b> around <b>${fmt(fc.planDate)}</b>.`);
      if (!isPro()) lines.push(isEs
        ? `<span id="forecastLocked" style="cursor:pointer">🔒 Ver cuándo llega tu <b>tendencia real de peso</b> · <b style="color:var(--orange)">Pro</b></span>`
        : `<span id="forecastLocked" style="cursor:pointer">🔒 See when your <b>actual weigh-in trend</b> gets you there · <b style="color:var(--orange)">Pro</b></span>`);
      else if (fc.trendRate == null) lines.push(tr('Weigh in weekly and your actual trend forecast appears here.'));
      else if (fc.trendDate) lines.push(isEs
        ? `Tu tendencia real (${signed(fc.trendRate)} ${u}/sem) llega alrededor del <b>${fmt(fc.trendDate)}</b>.`
        : `Your actual trend (${signed(fc.trendRate)} ${u}/wk) gets there around <b>${fmt(fc.trendDate)}</b>.`);
      else lines.push(isEs
        ? `Ojo: tu tendencia reciente (${signed(fc.trendRate)} ${u}/sem) se aleja de tu meta.`
        : `Heads up: your recent trend (${signed(fc.trendRate)} ${u}/wk) is moving away from your goal.`);
      return `<div class="card" id="forecastCard" style="padding:14px">
        <div class="rl" style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)">${tr('Goal forecast')}</div>
        ${lines.map(l => `<p class="hint" style="margin:6px 0 0;color:var(--ink)">${l}</p>`).join('')}
      </div>`;
    })()}
    ${(() => {
      // Adaptive TDEE — the measured "real burn" (MacroFactor's flagship idea,
      // computed fully on-device). The apply/clear choice is always explicit.
      const isEs = state.lang === 'es';
      const head = `<div class="rl" style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)">${tr('Your real burn')}</div>`;
      if (!isPro()) return `<div class="card" id="tdeeCard" style="padding:14px">${head}
        <p class="hint" style="margin:6px 0 0"><span id="tdeeLocked" style="cursor:pointer">🔒 ${isEs
          ? 'Mide tu gasto calórico real con tus propios registros y pesajes — no una fórmula'
          : 'Measure your actual daily burn from your own logs and weigh-ins — not a formula'} · <b style="color:var(--orange)">Pro</b></span></p></div>`;
      const a = Core.adaptiveTDEE(state, Core.todayISO());
      if (!a) return '';
      if (!a.ready) {
        const msg = a.reason === 'logging'
          ? (isEs ? `Registra ${a.needLogged - a.logged} ${a.needLogged - a.logged === 1 ? 'día' : 'días'} más (de los últimos ${a.window}) y tu gasto real aparecerá aquí.`
                  : `Log ${a.needLogged - a.logged} more ${a.needLogged - a.logged === 1 ? 'day' : 'days'} (of the last ${a.window}) and your measured burn appears here.`)
          : a.reason === 'weighins'
          ? (isEs ? `Pésate al menos dos veces, con ${a.needSpan}+ días de separación, para medir tu gasto real.`
                  : `Weigh in at least twice, ${a.needSpan}+ days apart, to measure your real burn.`)
          : (isEs ? 'Tus datos recientes se ven inusuales — sigue registrando y pesándote.'
                  : 'Your recent data looks unusual — keep logging and weighing in.');
        return `<div class="card" id="tdeeCard" style="padding:14px">${head}
          <p class="hint" style="margin:6px 0 0">${msg}</p></div>`;
      }
      const basis = isEs
        ? `Según ${a.logged} días registrados y ${a.deltaLbs >= 0 ? '+' : ''}${dW(a.deltaLbs)} ${U().weight} de tendencia en ${a.span} días.`
        : `From ${a.logged} logged days and a ${a.deltaLbs >= 0 ? '+' : ''}${dW(a.deltaLbs)} ${U().weight} trend change over ${a.span} days.`;
      const applied = a.applied != null;
      const stale = applied && Math.abs(a.applied - a.tdee) >= 50;
      return `<div class="card" id="tdeeCard" style="padding:14px">${head}
        <div class="stat-row" style="margin-top:8px">
          <div><div class="bignum" style="color:var(--mut)">${fmt(a.formula)}</div><div class="sl">${tr('Formula')}</div></div>
          <div><div class="bignum" id="tdeeMeasured">${fmt(a.tdee)}</div><div class="sl">${tr('Measured')}</div></div>
        </div>
        <p class="hint" style="margin:8px 0 0">${basis}</p>
        ${applied
          ? `<p class="hint" style="margin:6px 0 0">${isEs
              ? `Tu meta usa tu gasto medido (${fmt(a.applied)} kcal).`
              : `Your goal uses your measured burn (${fmt(a.applied)} kcal).`}${stale ? (isEs ? ' Ha cambiado — vuelve a aplicar para actualizarla.' : " It's changed — re-apply to update.") : ''}</p>
            ${stale ? `<button class="btn sec" id="tdeeApply" style="margin-top:8px">${tr('Apply to my goal')}</button>` : ''}
            <button class="addrow" id="tdeeClear" style="text-align:center">${tr('Use formula again')}</button>`
          : `<button class="btn sec" id="tdeeApply" style="margin-top:8px">${tr('Apply to my goal')}</button>`}
      </div>`;
    })()}
    <div class="card" style="padding:14px">
      <div class="field"><label for="ci-wt">${tr('Weight check-in')} (${U().weight})</label><input id="ci-wt" type="number" step="0.1" min="${wMin()}" max="${wMax()}" value="${dW(cur)}"></div>
      <button class="btn" id="ci-btn">${tr("Log today's weight")}</button>
      <p class="hint">${tr('Check-ins update your calorie goal to match your new weight — weigh in about once a week.')}</p>
    </div>
    ${measurementsHTML()}`;
  }

  // Weekly nutrition report: each nutrient's 7-day average against its target,
  // where the calories came from, and a tap-to-chart view of any one nutrient.
  // [key, label, unit, kind]: 'limit' turns red when over, 'reach' green when met
  const REPORT_ROWS = [['cal', 'Calories', 'kcal', 'limit'], ['c', 'Carbs', 'g', 'macro'], ['p', 'Protein', 'g', 'reach'],
    ['f', 'Fat', 'g', 'macro'], ['fib', 'Fiber', 'g', 'reach'], ['sug', 'Sugar', 'g', 'limit'], ['sod', 'Sodium', 'mg', 'limit'],
    ['sat', 'Sat Fat', 'g', 'limit'], ['chol', 'Cholesterol', 'mg', 'limit']];
  const MACRO_COLOR = { c: 'var(--blue)', p: 'var(--orange)', f: 'var(--viol)' };
  const nutColor = (key, kind, val, target) =>
    kind === 'limit' && val > target ? 'var(--red)' : kind === 'reach' && target && val >= target ? 'var(--green)' : (MACRO_COLOR[key] || 'var(--blue)');
  function weeklyNutritionHTML() {
    const r = Core.weeklyNutrition(state, ui.date);
    if (!r) return '';
    const head = `<div class="card-h"><h2>${tr('Nutrition this week')}</h2><span class="kcal">${r.daysLogged}/7 ${tr('days logged')}</span></div>`;
    if (!r.daysLogged) return `<div class="card" id="nutWeek">${head}<p class="empty-meal">${tr('Log food this week to see your nutrition averages.')}</p></div>`;
    if (!REPORT_ROWS.some(x => x[0] === ui.nutrient)) ui.nutrient = 'p';
    const bar = pct => `<div class="msplit">${['c', 'p', 'f'].map(k => `<i style="width:${pct[k]}%;background:${MACRO_COLOR[k]}"></i>`).join('')}</div>`;
    const split = r.pct ? `<div style="padding:8px 0 6px">
        <div class="msplit-row"><span class="rl">${tr('You')}</span>${bar(r.pct)}</div>
        ${r.goalPct ? `<div class="msplit-row"><span class="rl">${tr('Goal')}</span>${bar(r.goalPct)}</div>` : ''}
        <p class="hint" style="margin:4px 14px 0">${tr('Calories from')}: ${['c', 'p', 'f'].map(k =>
          `<b style="color:${MACRO_COLOR[k]}">${tr(k === 'c' ? 'Carbs' : k === 'p' ? 'Protein' : 'Fat')} ${r.pct[k]}%</b>${r.goalPct ? ` / ${r.goalPct[k]}%` : ''}`).join(' · ')}</p>
      </div>` : '';
    const rows = REPORT_ROWS.map(([k, label, unit, kind]) => {
      const val = r.avg[k], target = r.target[k];
      const color = nutColor(k, kind, val, target);
      const shown = fmt(val);
      return `<button class="mrow nrow ${k === ui.nutrient ? 'on' : ''}" data-nutrient="${k}">
        <span class="ml">${tr(label)}</span>
        <span class="nbar"><i style="width:${target ? Math.min(100, Math.round(val / target * 100)) : 0}%;background:${color}"></i></span>
        <span class="mv ${kind === 'limit' && val > target ? 'over' : ''}">${shown}<small>/${fmt(target)} ${unit}</small></span>
      </button>`;
    }).join('');
    const sel = REPORT_ROWS.find(x => x[0] === ui.nutrient);
    return `<div class="card" id="nutWeek">${head}
      <p class="hint" style="margin:0 14px">${tr('Daily averages over the days you logged.')}</p>
      ${split}${rows}
      <div class="chart-wrap">${nutrientChartSVG(r.days, sel)}</div>
    </div>`;
  }
  // one nutrient across the 7 days, each bar against that day's own target
  function nutrientChartSVG(days, [key, label, unit, kind]) {
    const W = 420, H = 120, P = 20, gap = 2;
    const max = Math.max(...days.map(d => Math.max(d[key], d.target[key]))) * 1.1 || 1;
    const bw = (W - 2 * P) / 7 - gap;
    const y = v => H - P - (v / max) * (H - 2 * P);
    const DOW = state.lang === 'es' ? ['Do','Lu','Ma','Mi','Ju','Vi','Sá'] : ['Su','Mo','Tu','We','Th','Fr','Sa'];
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${tr(label)}, ${tr('This week')}">
      ${days.map((d, i) => {
        const x = P + i * (bw + gap) + gap / 2, v = d[key], tgt = d.target[key];
        return `${v > 0 ? `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, H - P - y(v)).toFixed(1)}" rx="3"
            fill="${nutColor(key, kind, v, tgt)}"><title>${d.date}: ${Math.round(v)} ${unit}</title></rect>` : ''}
          <line x1="${(x - 1).toFixed(1)}" y1="${y(tgt).toFixed(1)}" x2="${(x + bw + 1).toFixed(1)}" y2="${y(tgt).toFixed(1)}" stroke="var(--orange)" stroke-width="2" stroke-dasharray="4 3"/>
          <text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--mut)">${DOW[new Date(d.date + 'T12:00:00').getDay()]}</text>`;
      }).join('')}
      <text x="${W - P}" y="12" text-anchor="end" font-size="10" fill="var(--mut)">${tr(label)} (${unit})</text>
    </svg>`;
  }

  // Intermittent fasting — a local timer; times come from the device clock here
  // and are passed into Core, which never reads the clock itself.
  const hm = ms => { const m = Math.floor(ms / 60000); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
  // durations in prose read as "12 h 59 min" — "12:59" looks like a clock time
  const dur = ms => { const m = Math.floor(ms / 60000); return `${Math.floor(m / 60)} h ${m % 60} min`; };
  function fastingHTML() {
    const es = state.lang === 'es';
    const head = `<div class="rl" style="font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)">${tr('Intermittent fasting')}</div>`;
    if (!isPro() && !state.fast) return `<div class="card" id="fastCard" style="padding:14px">${head}
      <p class="hint" style="margin:6px 0 0"><span id="fastLocked" style="cursor:pointer">🔒 ${es
        ? 'Ayuno 16:8, 18:6 o 20:4 con temporizador en vivo e historial'
        : 'Fast 16:8, 18:6 or 20:4 with a live timer and history'} · <b style="color:var(--orange)">Pro</b></span></p></div>`;
    const st = Core.fastStatus(state, Date.now());
    const stats = Core.fastStats(state);
    const hist = stats.recent.length ? `<div style="margin-top:10px">${stats.recent.map(f => `<div class="entry" style="padding:6px 0">
        <div class="es">${new Date(f.start).toLocaleDateString(LOC(), { weekday: 'short', month: 'short', day: 'numeric' })}</div>
        <div class="es"><b>${f.hours} h</b> / ${f.target} h ${f.hit ? '✓' : ''}</div></div>`).join('')}</div>
      <p class="hint" style="margin:6px 0 0">${es
        ? `${stats.count} ${stats.count === 1 ? 'ayuno' : 'ayunos'} · ${stats.completed} ${stats.completed === 1 ? 'completo' : 'completos'} · promedio ${stats.avgH} h · récord ${stats.longestH} h`
        : `${stats.count} ${stats.count === 1 ? 'fast' : 'fasts'} · ${stats.completed} completed · avg ${stats.avgH} h · longest ${stats.longestH} h`}</p>` : '';
    if (st) {
      const ends = new Date(st.endsAt).toLocaleTimeString(LOC(), { hour: 'numeric', minute: '2-digit' });
      return `<div class="card" id="fastCard" style="padding:14px">${head}
        <div class="dash" style="padding:8px 0 0">
          <div class="ringcell" style="flex:0 0 auto" id="fastRing">${ringSVG({ kind: 'sm', pct: st.pct, color: st.done ? 'var(--green)' : 'var(--orange)', center: hm(st.elapsedMs), label: `${hm(st.elapsedMs)} of ${st.target} hours fasted` })}</div>
          <div style="flex:1">
            <div style="font-weight:800" id="fastElapsed">${dur(st.elapsedMs)} ${es ? 'en ayuno' : 'fasted'}</div>
            <div class="hint" id="fastRemain" style="margin-top:2px">${st.done
              ? (es ? `🎉 Meta de ${st.target} h cumplida` : `🎉 ${st.target} h goal reached`)
              : (es ? `Faltan ${dur(st.remainingMs)} · meta ${st.target} h a las ${ends}` : `${dur(st.remainingMs)} to go · ${st.target} h goal at ${ends}`)}</div>
          </div>
        </div>
        ${fastNotifyHTML()}
        <button class="btn sec" id="fastEnd" style="margin-top:10px">${tr('End fast')}</button>${hist}</div>`;
    }
    const plan = ui.fastPlan || (state.fasts.length ? state.fasts[state.fasts.length - 1].target : 16);
    return `<div class="card" id="fastCard" style="padding:14px">${head}
      <div class="seg" style="margin-top:8px">${Core.fastPlans().map(h => `<button type="button" data-fastplan="${h}" class="${h === plan ? 'on' : ''}">${h}:${24 - h}</button>`).join('')}</div>
      <div class="field"><label for="fastAgo">${tr('Started')}</label><select id="fastAgo">
        ${[0, 1, 2, 3, 4].map(h => `<option value="${h}">${h === 0 ? tr('Now') : es ? `Hace ${h} h` : `${h} h ago`}</option>`).join('')}
      </select></div>
      ${fastNotifyHTML()}
      <button class="btn sec" id="fastStart" style="margin-top:10px">${es ? `Empezar ayuno de ${plan} h` : `Start ${plan} h fast`}</button>
      <p class="hint" id="fastCaution">${es
        ? 'No es consejo médico. Consulta a tu médico antes de ayunar, sobre todo si estás embarazada, tienes diabetes o tomas medicamentos.'
        : 'Not medical advice. Check with your doctor before fasting, especially if you\'re pregnant, have diabetes or take medication.'}</p>${hist}</div>`;
  }
  // "notify me when it's done" — a local notification the iPhone app schedules
  function fastNotifyHTML() {
    if (!window.ReactNativeWebView) return '';
    return `<label class="checkline" style="margin-top:10px"><input id="fastNotify" type="checkbox" ${state.reminders.fastEnd && isPro() ? 'checked' : ''}> ${tr("Notify me when it's done")}</label>`;
  }
  // Settings → Reminders (iPhone app only: the file version can't notify)
  function remindersHTML() {
    const r = state.reminders;
    const rows = [['breakfast', tr('Breakfast')], ['lunch', tr('Lunch')], ['snacks', tr('Snacks')], ['dinner', tr('Dinner')], ['weighIn', tr('Morning weigh-in')]];
    return `<h2 class="sect">${tr('Reminders')}</h2>
    <div class="card" style="padding:10px 14px 14px" id="remCard">
      ${rows.map(([k, label]) => `<div class="remrow">
        <label class="checkline"><input type="checkbox" data-rem="${k}" ${r[k].on ? 'checked' : ''}> ${label}</label>
        <input type="time" data-remat="${k}" value="${r[k].at}" aria-label="${esc(label)} — ${tr('time')}"></div>`).join('')}
      <label class="checkline" style="margin-top:10px"><input type="checkbox" id="remFast" ${r.fastEnd && isPro() ? 'checked' : ''}> ${isPro() ? '' : '🔒 '}${tr('Tell me when my fast is done')}${isPro() ? '' : ' · <b style="color:var(--orange)">Pro</b>'}</label>
      ${ui.notifOff ? `<p class="hint" id="notifOff" style="color:var(--red)">${tr('Notifications are off for FuelRing. Turn them on in the iPhone Settings app → FuelRing → Notifications.')}</p>` : ''}
      <p class="hint">${tr("A reminder skips a meal you've already logged. Open FuelRing at least once a week to keep them coming.")}</p>
    </div>`;
  }
  // Settings → Widgets: where to find them (the widget itself shows a locked card without Pro)
  function widgetsHTML() {
    return `<h2 class="sect">${tr('Widgets')}</h2>
    <div class="card" style="padding:14px" id="widgetCard"><p class="hint" style="margin:0">${isPro()
      ? tr('See calories left and your macros on your Home Screen and Lock Screen: touch and hold the Home Screen, tap Edit → Add Widget, and pick FuelRing.')

  // keep the running timer current without a full re-render (which would
  // steal focus from whatever the user is typing)
  setInterval(() => {
    const st = state.fast && Core.fastStatus(state, Date.now());
    if (!st || !$('#fastCard')) return;
    const card = $('#fastCard');
    if (st.done && !card.dataset.done) { // goal just reached: full re-render for the 🎉 state, unless the user is typing
      card.dataset.done = '1';
      const a = document.activeElement;
      if (!a || !/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return render();
    }
    $('#fastElapsed').textContent = `${dur(st.elapsedMs)} ${state.lang === 'es' ? 'en ayuno' : 'fasted'}`;
    const ends = new Date(st.endsAt).toLocaleTimeString(LOC(), { hour: 'numeric', minute: '2-digit' });
    if (!st.done) $('#fastRemain').textContent = state.lang === 'es'
      ? `Faltan ${dur(st.remainingMs)} · meta ${st.target} h a las ${ends}` : `${dur(st.remainingMs)} to go · ${st.target} h goal at ${ends}`;
    $('#fastRing').innerHTML = ringSVG({ kind: 'sm', pct: st.pct, color: st.done ? 'var(--green)' : 'var(--orange)', center: hm(st.elapsedMs), label: `${hm(st.elapsedMs)} of ${st.target} hours fasted` });
  }, 30000);

  function measurementsHTML() {
    const metrics = Core.bodyMetrics();
    const rows = metrics.map(m => ({ m, st: Core.measurementStats(state, m.key) })).filter(x => x.st);
    if (!rows.length) {
      return `<div class="card" id="bodyCard">
        <div class="card-h"><h2>${tr('Measurements')}</h2></div>

    const series = Core.measurementSeries(state, ui.metric).map(pt => ({ date: pt.date, lbs: pt.value }));

  // same visual language as the weight chart, without the goal line
  function measureChartSVG(points, unit) {
    const W = 420, H = 150, P = 26;
    const vals = points.map(p => p.lbs);
    const min = Math.min(...vals) - 1, max = Math.max(...vals) + 1;
    const x = i => P + (i / (points.length - 1)) * (W - 2 * P);
    const y = v => H - P - ((v - min) / (max - min || 1)) * (H - 2 * P);
    const pts = points.map((p, i) => `${x(i)},${y(p.lbs)}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${tr('Measurements')}">
      <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>
      ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.lbs)}" r="3.5" fill="var(--navy)"/>`).join('')}
      <text x="${P}" y="${H - 6}" font-size="10" fill="var(--mut)">${points[0].date}</text>
      <text x="${W - P}" y="${H - 6}" text-anchor="end" font-size="10" fill="var(--mut)">${points[points.length - 1].date}</text>
      <text x="${W - P}" y="16" text-anchor="end" font-size="10" fill="var(--mut)">${unit}</text>
    </svg>`;
  }

  // MFP's end-of-day moment: "if every day were like today…"
  function completeModalHTML() {

    else {

      const head = es
        ? `Si todos los días fueran como hoy, en ${pr.weeks} semanas pesarías <b id="projWeight">${dW(pr.projected)} ${u}</b>.`
        : `If every day were like today, you'd weigh <b id="projWeight">${dW(pr.projected)} ${u}</b> in ${pr.weeks} weeks.`;
      const detail = es
        ? `${ch > 0 ? '+' : ''}${ch} ${u} desde ${dW(pr.current)} ${u} · ${fmt(pr.net)} kcal netas contra ~${fmt(pr.maintenance)} kcal de mantenimiento.`

  function weightChartSVG(weights, goalLbs) {
    if (weights.length < 2) return `<p class="hint">${tr('Log a few check-ins to see your trend here.')}</p>`;
    const W = 420, H = 160, P = 26;
    // smoothed trend over the FULL history, mapped onto whatever slice this
    // chart shows — daily weigh-ins bounce with water; the trend line is the
    // honest reading, so raw points fade back once there's enough data
    const showTrend = weights.length >= 3;
    const tmap = showTrend ? Object.fromEntries(Core.trendWeight(state.weights).map(w => [w.date, w.trend])) : {};
    const trendVals = showTrend ? weights.map(w => tmap[w.date]).filter(Number.isFinite) : [];
    const vals = weights.map(w => w.lbs).concat([goalLbs], trendVals);
    const min = Math.min(...vals) - 2, max = Math.max(...vals) + 2;
    const x = i => P + (i / (weights.length - 1)) * (W - 2 * P);
    const y = v => H - P - ((v - min) / (max - min)) * (H - 2 * P);
    const pts = weights.map((w, i) => `${x(i)},${y(w.lbs)}`).join(' ');
    const tpts = showTrend ? weights.map((w, i) => Number.isFinite(tmap[w.date]) ? `${x(i)},${y(tmap[w.date])}` : null).filter(Boolean).join(' ') : '';
    const gy = y(goalLbs);
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${tr('Weight trend chart')}">
      <line x1="${P}" y1="${gy}" x2="${W-P}" y2="${gy}" stroke="var(--orange)" stroke-dasharray="5 4" stroke-width="1.5"/>
      <text x="${W-P}" y="${gy-5}" text-anchor="end" font-size="10" fill="var(--orange)">${tr('goal')} ${dW(goalLbs)}</text>
      <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="${showTrend ? 1.5 : 2.5}" ${showTrend ? 'opacity=".35"' : ''} stroke-linejoin="round"/>
      ${weights.map((w,i)=>`<circle cx="${x(i)}" cy="${y(w.lbs)}" r="${showTrend ? 2.5 : 3.5}" fill="var(--navy)" ${showTrend ? 'opacity=".45"' : ''}/>`).join('')}
      ${showTrend ? `<polyline id="trendLine" points="${tpts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>` : ''}
      <text x="${P}" y="${H-6}" font-size="10" fill="var(--mut)">${weights[0].date}</text>
      <text x="${W-P}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--mut)">${weights[weights.length-1].date}</text>
    </svg>`;
  }

  // ---------- SETTINGS ----------
  // fixed gram targets don't move with the calorie goal, so say when they disagree
  function gramsNote(mg, goalCal) {
    const kcal = Core.macroGramsCal(mg), diff = kcal - goalCal, es = state.lang === 'es';
    const base = es ? `Tus macros suman ${fmt(kcal)} kcal; tu meta es ${fmt(goalCal)} kcal.` : `Your macros add up to ${fmt(kcal)} kcal; your goal is ${fmt(goalCal)} kcal.`;
    if (Math.abs(diff) <= 50) return base;
    return base + ' ' + (es ? `Diferencia de ${fmt(Math.abs(diff))} kcal — los gramos se quedan fijos aunque cambie tu meta.`
      : `That's ${fmt(Math.abs(diff))} kcal ${diff > 0 ? 'over' : 'under'} — grams stay fixed even when your goal changes.`);
  }
  // Calorie goals by day (Pro): pick the days that get more; the rest give it back
  const DAY_NAMES = { en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], es: ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'] };
  const dayName = i => DAY_NAMES[state.lang === 'es' ? 'es' : 'en'][i];
  function dayGoalsNote(days, boost) {
    const es = state.lang === 'es';
    if (!days.length) return es ? 'La misma meta todos los días. Toca los días en que quieres más calorías.'
      : 'Same goal every day. Tap the days you want more calories on.';
    if (days.length === 7) return tr('Pick 1 to 6 days for more calories');
    const plan = Core.dayShiftPlan({ ...state, profile: { ...state.profile, dayShift: { days, boost } } });
    if (!plan) {
      const floor = state.profile.sex === 'male' ? '1,500' : '1,200';
      return es ? `Tu meta ya está en el mínimo (${floor} kcal), así que los otros días no pueden bajar.`
        : `Your goal is already at the minimum (${floor} kcal), so the other days can't go lower.`;
    }
    // Monday-first for reading, so a weekend reads "Sat, Sun"
    const names = plan.days.slice().sort((a, b) => (a + 6) % 7 - (b + 6) % 7).map(dayName).join(', ');
    return es
      ? `${names}: <b>${fmt(plan.high)}</b> kcal · los demás días: <b>${fmt(plan.low)}</b> kcal · la semana suma lo mismo.${plan.capped ? ' Ajustado para que ningún día baje del mínimo.' : ''}`
      : `${names}: <b>${fmt(plan.high)}</b> kcal · other days: <b>${fmt(plan.low)}</b> kcal · same weekly total.${plan.capped ? ' Trimmed so no day drops below the minimum.' : ''}`;
  }
  function dayGoalsHTML(p) {
    const es = state.lang === 'es';
    const sh = Core.validDayShift(p.dayShift) ? p.dayShift : null;
    const label = `<label>${tr('Calorie goals by day')}</label>`;
    if (!isPro() && !sh) return `<div class="field">${label}
      <p class="hint" style="margin:0"><span id="dayGoalsLocked" style="cursor:pointer">🔒 ${es
        ? 'Come más los días que lo necesitas — la semana suma lo mismo'
        : 'Eat more on the days you need it — the week adds up the same'} · <b style="color:var(--orange)">Pro</b></span></p></div>`;
    const DOW = es ? ['D', 'L', 'M', 'M', 'J', 'V', 'S'] : ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const sel = sh ? sh.days : [], boost = sh ? sh.boost : 300;
    const opts = [100, 150, 200, 250, 300, 400, 500];
    if (!opts.includes(boost)) opts.push(boost);
    return `<div class="field">${label}
      <div class="wbdots daypick" role="group" aria-label="${tr('Days with more calories')}">${DOW.map((l, i) =>
        `<button type="button" class="wbd ${sel.includes(i) ? 'on' : ''}" data-dayhigh="${i}" aria-pressed="${sel.includes(i)}" aria-label="${dayName(i)}">${l}</button>`).join('')}</div>
      <select id="st-boost" style="margin-top:8px" aria-label="${tr('Calorie goals by day')}">${opts.sort((a, b) => a - b).map(b =>
        `<option value="${b}" ${b === boost ? 'selected' : ''}>+${b} kcal ${es ? 'esos días' : 'on those days'}</option>`).join('')}</select>
      <p class="hint" id="dayGoalsNote">${dayGoalsNote(sel, boost)}</p></div>`;
  }

  // Health info & sources (App Review 1.4.1: health calculations must show
  // their methodology and sources, and remind people to check with a doctor).
  // Every figure here is what Core actually uses — keep the two in step.
  function sourcesHTML() {
    const es = state.lang === 'es';
    const items = es ? [
      ['Meta de calorías', 'gasto en reposo con la ecuación de Mifflin–St Jeor × un factor de actividad para tu día sin contar el ejercicio (1.2 sedentario a 1.725 muy activo), ±500 kcal al día por cada lb a la semana.', 'Mifflin MD, St Jeor ST, et al. Am J Clin Nutr 1990;51(2):241–7.'],
      ['Mínimos', 'nunca menos de 1,200 kcal (mujeres) / 1,500 kcal (hombres): el extremo bajo de los rangos de 1,200–1,500 / 1,500–1,800 kcal de la guía de obesidad AHA/ACC/TOS de 2013.', 'Jensen MD, et al. Circulation 2014;129(25 Suppl 2):S102–38.'],
      ['Proyecciones de peso', 'unas 3,500 kcal por libra; es una aproximación, y la pérdida real se frena a medida que el cuerpo se adapta.', 'Wishnofsky M. Am J Clin Nutr 1958;6(5):542–6.'],
      ['Macros y fibra', 'el reparto 50/20/30 de inicio está dentro de los rangos aceptables de macronutrientes; fibra 38/25 g (30/21 g desde los 51).', 'Institute of Medicine. Dietary Reference Intakes for Energy and Macronutrients, 2005.'],
      ['Azúcar', 'límite de 36 g (hombres) / 25 g (mujeres), de los límites de azúcar añadido de la AHA; FuelRing cuenta todo el azúcar, así que la fruta y la leche también suman.', 'Johnson RK, et al. Circulation 2009;120(11):1011–20.'],
      ['Sodio, grasa saturada, colesterol', 'menos de 2,300 mg de sodio (1,500 mg desde los 51), grasa saturada bajo el 10% de las calorías, colesterol bajo 300 mg.', 'Dietary Guidelines for Americans 2020–2025 y 2010 (USDA, HHS).'],
      ['Calorías del ejercicio', 'MET × peso (kg) × horas.', 'Ainsworth BE, et al. 2011 Compendium of Physical Activities. Med Sci Sports Exerc 2011;43(8):1575–81.'],
      ['Ejercicio de Apple Health', 'los entrenamientos cuentan completos (uno guardado sin calorías se estima como (MET − 1) × peso (kg) × horas); el movimiento diario solo cuenta por encima de lo que tu factor de actividad ya incluye: gasto en reposo × (0.9 × factor − 1), dejando cerca del 10% de la energía diaria para digerir los alimentos (efecto térmico de los alimentos).', 'Westerterp KR. Diet induced thermogenesis. Nutr Metab (Lond) 2004;1(1):5.'],
      ['Alcohol', '7 kcal por gramo de alcohol (factores de Atwater).', 'USDA Agriculture Handbook No. 74.'],
      ['Sueño', 'los adultos necesitan 7 horas o más por noche de forma regular (consenso de la AASM y la Sleep Research Society).', 'Watson NF, et al. Sleep 2015;38(6):843–4.'],
    ] : [
      ['Calorie goal', 'resting energy by the Mifflin–St Jeor equation × an activity factor for your day outside workouts (1.2 sedentary to 1.725 very active), ±500 kcal a day per lb a week.', 'Mifflin MD, St Jeor ST, et al. Am J Clin Nutr 1990;51(2):241–7.'],
      ['Minimums', 'never below 1,200 kcal (women) / 1,500 kcal (men): the low ends of the 1,200–1,500 / 1,500–1,800 kcal ranges in the 2013 AHA/ACC/TOS obesity guideline.', 'Jensen MD, et al. Circulation 2014;129(25 Suppl 2):S102–38.'],
      ['Weight projections', 'about 3,500 kcal per pound. It\'s an approximation; real loss slows as the body adapts.', 'Wishnofsky M. Am J Clin Nutr 1958;6(5):542–6.'],
      ['Macros & fiber', 'the default 50/20/30 split sits inside the Acceptable Macronutrient Distribution Ranges; fiber 38/25 g (30/21 g at 51+).', 'Institute of Medicine. Dietary Reference Intakes for Energy and Macronutrients, 2005.'],
      ['Sugar', '36 g (men) / 25 g (women), from the AHA\'s added-sugar limits. FuelRing counts all sugars, so fruit and milk count too.', 'Johnson RK, et al. Circulation 2009;120(11):1011–20.'],
      ['Sodium, saturated fat, cholesterol', 'under 2,300 mg sodium (1,500 mg at 51+), saturated fat under 10% of calories, cholesterol under 300 mg.', 'Dietary Guidelines for Americans 2020–2025 and 2010 (USDA, HHS).'],
      ['Exercise calories', 'MET × body weight (kg) × hours.', 'Ainsworth BE, et al. 2011 Compendium of Physical Activities. Med Sci Sports Exerc 2011;43(8):1575–81.'],
      ['Apple Health exercise', 'workouts count in full (one saved without calories is estimated as (MET − 1) × body weight (kg) × hours); everyday movement counts only beyond what your activity factor already includes: resting energy × (0.9 × factor − 1), leaving about 10% of daily energy for digesting food (the thermic effect of food).', 'Westerterp KR. Diet induced thermogenesis. Nutr Metab (Lond) 2004;1(1):5.'],
      ['Alcohol', '7 kcal per gram of alcohol (Atwater factors).', 'USDA Agriculture Handbook No. 74.'],
      ['Sleep', 'adults need 7 or more hours a night on a regular basis (American Academy of Sleep Medicine and Sleep Research Society consensus).', 'Watson NF, et al. Sleep 2015;38(6):843–4.'],

    return `<h2 class="sect">${tr('Health info & sources')}</h2>
    <div class="card" style="padding:14px" id="sourcesCard">
      <p class="hint" style="margin-top:0"><b style="color:var(--ink)">${tr('Not medical advice.')}</b> ${es

  // ---------- ADD FOOD / EXERCISE MODAL ----------
  function mealRowsHTML(meals) {
    return meals.map(m => {
      const batch = m.servings || 1;
      const sub = batch > 1
        ? (state.lang === 'es' ? `receta · rinde ${batch} porciones · ${fmt(Math.round(Core.savedMealCal(m) / batch))} kcal c/u`
          : `recipe · makes ${batch} servings · ${fmt(Math.round(Core.savedMealCal(m) / batch))} kcal each`)
        : `${m.items.length} ${m.items.length === 1 ? tr('item') : tr('items')} · ${tr('saved meal')}`;
      return `<div class="fresult" data-pickmeal="${m.id}" role="button" tabindex="0">
      <div><div class="fn">🍽 ${esc(m.name)}</div><div class="fs">${sub}</div></div>
      <div style="display:flex;align-items:center;gap:6px"><span class="fc">${fmt(Core.savedMealCal(m))}</span>
      <button class="del" data-delmeal="${m.id}" aria-label="Delete saved meal ${esc(m.name)}">✕</button></div>
    </div>`;
    }).join('');
  }
  function mealServingHTML() {
    const m = state.savedMeals.find(x => x.id === ui.selMealId);
    if (!m) return '';
    const batch = m.servings || 1, n = ui.mealCount;
    const scale = n / batch;
    const total = Core.savedMealCal(m);
    return `<div class="selfood">
      <div class="fn">🍽 ${esc(m.name)}</div>
      <div class="fs" style="color:var(--mut);font-size:13px">${state.lang === 'es' ? `la receta rinde ${batch} porciones · ${fmt(total)} kcal en total` : `recipe makes ${batch} servings · ${fmt(total)} kcal total`}</div>
      <div class="stepper">
        <button id="msDown" aria-label="${tr('Fewer servings')}">−</button>
        <input id="msInput" type="number" step="0.25" min="0.25" value="${n}" aria-label="${tr('Servings to log')}">
        <button id="msUp" aria-label="${tr('More servings')}">+</button>
      </div>
      <div class="macro-preview"><span><b>${fmt(Math.round(total * scale))}</b> ${state.lang === 'es' ? `kcal por ${n} ${n === 1 ? 'porción' : 'porciones'}` : `kcal for ${n} serving${n === 1 ? '' : 's'}`}</span></div>
      <button class="btn" id="confirmMeal">${tr('Add to')} ${tr(MEALS.find(x => x[0] === ui.modal)[1])}</button>
      <button class="addrow" id="backToSearch" style="text-align:center">${tr('‹ Back to search')}</button>
    </div>`;
  }
  function modalHTML() {
    if (ui.modal === 'exercise') return exerciseModalHTML();
