        text: es ? `${n} kcal de más hoy — una caminata recupera parte, y mañana empiezas de cero.`
          : `${n} kcal over today — a walk earns some back, and tomorrow starts clean.`,
        tone: 'warn',
      };
    }
    // Alcohol is the one thing that fills the calorie ring while leaving every
    // macro ring flat — without saying so, the day reads as a bug. Purely
    // factual: what share it was, and what those calories don't bring with them.
    const drinkCal = day(state, date).meals && (() => {
      let cal = 0;
      for (const meal of ['breakfast', 'lunch', 'dinner', 'snacks']) {
        for (const e of day(state, date).meals[meal]) {
          const src = e.foodId && [...state.customFoods, ...db].find(f => f.id === e.foodId);
          if (src && src.alc) cal += e.cal;
        }
      }
      return cal;
    })();
    if (drinkCal >= 250 && drinkCal / t.food.cal >= 0.15) {
      const pct = Math.round((drinkCal / t.food.cal) * 100);
      return {
        text: es ? `Las bebidas son el ${pct}% de las calorías de hoy (${drinkCal} kcal) — no traen proteína ni fibra, así que el resto del día las tiene que aportar.`
          : `Drinks are ${pct}% of today's calories (${drinkCal} kcal) — they bring no protein or fiber, so the rest of the day has to.`,
        tone: 'push',
      };
    }

    const mt = microTargets(state.profile, g.calories);
    if (t.food.sug > mt.sug) {
      return {
        text: es ? `El azúcar ya pasó el límite de hoy (${Math.round(t.food.sug)}/${mt.sug}g) — mejor agua en vez del próximo dulce.`
          : `Sugar's past today's limit (${Math.round(t.food.sug)}/${mt.sug}g) — maybe water instead of the next sweet thing.`,
        tone: 'warn',
      };
    }
    if (hour < 17 && t.food.sod >= mt.sod * 0.75 && t.food.sod <= mt.sod) {
      const pct = Math.round((t.food.sod / mt.sod) * 100);
      return {
        text: es ? `El sodio ya va en ${pct}% del límite diario — que la cena lleve poca sal.`
          : `Sodium's already at ${pct}% of the daily limit — keep dinner light on salt.`,
        tone: 'warn',
      };
    }
    const proteinGap = g.protein - t.food.p;
    if (t.remaining >= 150 && proteinGap >= 15) {
      const pick = [...state.customFoods, ...db]
        .filter(f => f.p >= 10 && f.cal <= t.remaining)
        .sort((a, b) => b.p - a.p)[0];
      const pickName = pick ? (es ? (pick.es || pick.name) : pick.name) : '';
      return {
        text: pick
          ? (es ? `Te faltan ${Math.round(proteinGap)}g de proteína y quedan ${Math.round(t.remaining)} kcal — ${pickName} (${Math.round(pick.p)}g) cubre buena parte.`
            : `${Math.round(proteinGap)}g of protein to go, ${Math.round(t.remaining)} kcal left — ${pickName} (${Math.round(pick.p)}g) covers a chunk.`)
          : (es ? `Te faltan ${Math.round(proteinGap)}g de proteína con ${Math.round(t.remaining)} kcal restantes.`
            : `${Math.round(proteinGap)}g of protein to go with ${Math.round(t.remaining)} kcal left.`),
        tone: 'push',
      };
    }
    if (t.remaining <= Math.max(150, g.calories * 0.08)) {
      return {
        text: es ? `Quedan ${Math.round(t.remaining)} kcal — casi cierras el día. Buen ritmo.`
          : `${Math.round(t.remaining)} kcal left — nearly a wrap. Nicely paced.`,
        tone: 'good',
      };
    }
    const fibGap = mt.fib - t.food.fib;
    if (fibGap > 0 && fibGap <= mt.fib * 0.25) {
      return {
        text: es ? `${Math.round(fibGap)}g más de fibra y llegas a la meta de hoy.`
          : `${Math.round(fibGap)}g more fiber hits today's goal.`,
        tone: 'push',
      };
    }
    return {
      text: es ? `Quedan ${Math.round(t.remaining)} kcal y ${Math.max(0, Math.round(proteinGap))}g de proteína — vas muy bien.`
        : `${Math.round(t.remaining)} kcal and ${Math.max(0, Math.round(proteinGap))}g protein left — right on track.`,
      tone: 'good',
    };
  }

  // Custom foods win over the seed DB, so a user's own product (or a correction
  // of a bad seed entry) always takes precedence.
  function lookupBarcode(state, db, code) {
    const canon = normalizeBarcode(code);
    if (!canon) return null;
    return [...state.customFoods, ...db].find(f => f.barcode && normalizeBarcode(f.barcode) === canon) || null;
  }

  // recents-boosted search
  // accent-insensitive fold so "platano" finds "Plátano" (and vice versa)
  function deaccent(s) {
    return s.normalize ? s.normalize('NFD').replace(/[\u0300-\u036f]/g, '') : s;
  }
  // `words` appears in `text` as whole words, ignoring case, accents and punctuation
  function hasWords(text, words) {
    const norm = s => ` ${deaccent(String(s).toLowerCase()).replace(/[^a-z0-9]+/g, ' ').trim()} `;
    const w = norm(words);
    return w.trim() !== '' && norm(text).includes(w);
  }

  function searchFoods(state, db, query) {
    const all = [...state.customFoods, ...db];
    const q = deaccent(query.trim().toLowerCase());
    if (!q) {
      // empty query -> recents
      return state.recents.map(id => all.find(f => f.id === id)).filter(Boolean).slice(0, 12);
    }
    // try the query as typed plus singular forms, so "bananas" finds "Banana"
    const variants = [q];
    if (q.length > 3 && q.endsWith('es')) variants.push(q.slice(0, -2));
    if (q.length > 2 && q.endsWith('s')) variants.push(q.slice(0, -1));
    // multi-word queries also match with the words in any order ("chicken rice")
    const singulars = t => {
      const v = [t];
      if (t.length > 3 && t.endsWith('es')) v.push(t.slice(0, -2));
      if (t.length > 2 && t.endsWith('s')) v.push(t.slice(0, -1));
      return v;
    };
    const tokens = q.split(/\s+/).filter(Boolean);
    const customIds = new Set(state.customFoods.map(f => f.id));
    const scoreName = name => {
      let score = -1;
      for (const v of variants) {
        let sc = -1;
        if (name.startsWith(v)) sc = 3;
        else if (name.split(/\s+/).some(w => w.startsWith(v))) sc = 2;
        else if (name.includes(v)) sc = 1;
        if (sc > score) score = sc;
      }
      if (tokens.length > 1 && score < 2) {
        const words = name.split(/\s+/);
        const allHit = tokens.every(t =>
          singulars(t).some(v => words.some(w => w.startsWith(v)) || name.includes(v)));
        if (allHit) score = 2;
      }
      return score;
    };
    const scored = all
      .map((f, ord) => {
        // both languages always searchable: "pollo" works in English mode too
        let score = scoreName(deaccent(f.name.toLowerCase()));
        if (f.es) score = Math.max(score, scoreName(deaccent(f.es.toLowerCase())));
        // the user's own foods outrank seed matches; recents outrank both
        if (score > 0 && customIds.has(f.id)) score += 2;
        if (score > 0 && state.recents.includes(f.id)) score += 2;
        return { f, score, ord };
      })
      .filter(x => x.score > 0)
      // equal scores break by seed order, not alphabet: the curated staples sit
      // at the front of the DB, so "pollo" surfaces grilled chicken breast
      // before the long tail of chicken dishes no matter how big the DB grows
      .sort((a, b) => b.score - a.score || a.ord - b.ord);
    return scored.map(x => x.f).slice(0, 40); // cap scales with the 1,000+ food DB — "pollo" alone matches 100+
  }

  // last 7 days ending endDate; averages count only days with food logged
  // ----- trend weight (smoothed) -----
  // Raw weigh-ins bounce a couple of pounds with water; the smoothed line is
  // the honest reading. Time-aware EWMA: each day of gap moves the trend 10%
  // of the way to the new reading (half-life ~6.6 days), so sparse weekly
  // weigh-ins and daily smart-scale users both smooth sensibly.
  function trendWeight(weights) {
    const sorted = [...weights].sort((a, b) => a.date.localeCompare(b.date));
    const out = [];
    let trend = null, prevDate = null;
    for (const w of sorted) {
      if (trend === null) trend = w.lbs;
      else {
        const gap = Math.max(1, Math.round(
          (new Date(w.date + 'T12:00:00') - new Date(prevDate + 'T12:00:00')) / 86400000));
        trend += (1 - Math.pow(0.9, gap)) * (w.lbs - trend);
      }
      prevDate = w.date;
      out.push({ date: w.date, lbs: w.lbs, trend: Math.round(trend * 10) / 10 });
    }
    return out;
  }

  // ----- adaptive TDEE: the measured "real burn" -----
  // Energy balance over the window: intake − expenditure = Δweight × 3500.
  // Rearranged: measured TDEE = avg logged intake − Δtrend-weight × 3500/day.
  // Gated on completeness — a half-logged week must not produce a fake number
  // (unlogged days mean unknown intake, not zero intake). Uses the SMOOTHED
  // trend at both ends so one watery weigh-in can't swing the estimate.
  const ADAPT_WINDOW = 28, ADAPT_MIN_LOGGED = 20, ADAPT_MIN_SPAN = 14;
  function adaptiveTDEE(state, today) {
    if (!state.profile) return null;
    let intake = 0, logged = 0;
    for (let i = 0; i < ADAPT_WINDOW; i++) {
      const d = new Date(today + 'T12:00:00'); d.setDate(d.getDate() - i);
      const t = dayTotals(state, todayISO(d));
      if (t.food.cal > 0) { intake += t.food.cal; logged++; }
    }
    const base = { window: ADAPT_WINDOW, logged, needLogged: ADAPT_MIN_LOGGED, needSpan: ADAPT_MIN_SPAN };
    if (logged < ADAPT_MIN_LOGGED) return { ...base, ready: false, reason: 'logging' };
    const startD = new Date(today + 'T12:00:00'); startD.setDate(startD.getDate() - (ADAPT_WINDOW - 1));
    const startIso = todayISO(startD);
    const tw = trendWeight(state.weights).filter(w => w.date >= startIso && w.date <= today);
    if (tw.length < 2) return { ...base, ready: false, reason: 'weighins' };
    const first = tw[0], last = tw[tw.length - 1];
    const span = Math.round((new Date(last.date + 'T12:00:00') - new Date(first.date + 'T12:00:00')) / 86400000);
    if (span < ADAPT_MIN_SPAN) return { ...base, ready: false, reason: 'weighins' };
    const deltaLbs = Math.round((last.trend - first.trend) * 10) / 10;
    const measured = Math.round(intake / logged - (deltaLbs / span) * 3500);
    if (measured < 800 || measured > 8000) return { ...base, ready: false, reason: 'implausible' };
    return {
      ...base, ready: true, tdee: measured, formula: Math.round(tdee(state.profile)),
      deltaLbs, span, applied: Number.isFinite(state.profile.tdeeOverride) ? state.profile.tdeeOverride : null,
    };
  }

  // Apply the measured burn to the goal (or clear back to the formula). The
  // choice is always explicit — FuelRing never quietly moves the goal.
  function setTdeeOverride(state, val) {
    const s = clone(state);
    if (!s.profile) return s;
    if (Number.isFinite(val)) s.profile.tdeeOverride = Math.round(val);
    else delete s.profile.tdeeOverride;
    s.goals = goalsFor(s.profile);
    return s;
  }

  // ----- weekly budget: bank calories across the week -----
  // Week starts Sunday. "Banked" sums (goal − food + exercise) over LOGGED
  // days before today — an unlogged day says nothing about what you ate, so
  // it banks nothing. Purely factual; the diary strip passes no judgment.
  function weekBudget(state, today) {
    if (!state.goals) return null;
    const d0 = new Date(today + 'T12:00:00');
    const start = new Date(d0); start.setDate(start.getDate() - start.getDay());
    const days = [];
    let banked = 0, loggedDays = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(d.getDate() + i);
      const iso = todayISO(d);
      const t = dayTotals(state, iso);
      const logged = t.food.cal > 0;
      days.push({ date: iso, net: Math.round(t.remaining), logged, today: iso === today, future: iso > today });
      if (iso < today && logged) { banked += t.remaining; loggedDays++; }
    }
    return { start: todayISO(start), days, banked: Math.round(banked), loggedDays };
  }

  function weeklyStats(state, endDate) {
    const days = [];
    const d0 = new Date(endDate + 'T12:00:00');
    for (let i = 6; i >= 0; i--) {
      const d = new Date(d0); d.setDate(d.getDate() - i);
      const iso = todayISO(d);
      const t = dayTotals(state, iso);
      days.push({ date: iso, cal: t.food.cal, p: t.food.p, goal: t.goal, logged: t.food.cal > 0 });
    }
    const logged = days.filter(x => x.logged);
    const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
    return {
      days,
      daysLogged: logged.length,
      avgCal: Math.round(avg(logged.map(x => x.cal))),
      avgProtein: Math.round(avg(logged.map(x => x.p))),
    };
  }

  // ----- weekly nutrition report -----
  // The 7 days ending endDate: each day's intake and that day's targets, the
  // average over LOGGED days (an unlogged day isn't a zero-calorie day), the
  // average target, and the share of calories from each macro vs the goal's.
  const REPORT_KEYS = ['cal', 'c', 'p', 'f', ...MICROS];
  function weeklyNutrition(state, endDate) {
    if (!state.profile || !state.goals) return null;
    const d0 = new Date(endDate + 'T12:00:00');
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(d0); d.setDate(d.getDate() - i);
      const iso = todayISO(d);
      const t = dayTotals(state, iso), g = goalsForDate(state, iso);
      const row = { date: iso, logged: t.food.cal > 0,
        target: { cal: g.calories, c: g.carbs, p: g.protein, f: g.fat, ...microTargets(state.profile, g.calories) } };
      for (const k of REPORT_KEYS) row[k] = k === 'cal' ? t.food.cal : round1(t.food[k] || 0);
      days.push(row);
    }
    const logged = days.filter(d => d.logged);
    const mean = (list, get) => list.length ? list.reduce((a, d) => a + get(d), 0) / list.length : 0;
    const avg = {}, target = {};
    for (const k of REPORT_KEYS) {
      avg[k] = k === 'cal' ? Math.round(mean(logged, d => d.cal)) : round1(mean(logged, d => d[k]));
      target[k] = Math.round(mean(days, d => d.target[k]));
    }
    const split = (c, p, f) => {
      const total = c * 4 + p * 4 + f * 9;
      if (!(total > 0)) return null;
      const pc = Math.round(c * 4 / total * 100), pp = Math.round(p * 4 / total * 100);
      return { c: pc, p: pp, f: 100 - pc - pp };
    };
    return { days, daysLogged: logged.length, avg, target,
      pct: split(avg.c, avg.p, avg.f), goalPct: split(target.c, target.p, target.f) };
  }

  // long-range stats for the last `days` days ending endDate (inclusive)
  function trendStats(state, endDate, days) {
    const series = [];
    const d0 = new Date(endDate + 'T12:00:00');
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(d0); d.setDate(d.getDate() - i);
      const iso = todayISO(d);
      const t = dayTotals(state, iso), cal = t.food.cal;
      series.push({ date: iso, cal, goal: t.goal, logged: cal > 0 });
    }
    const logged = series.filter(x => x.logged);
    const avgCal = logged.length ? Math.round(logged.reduce((a, b) => a + b.cal, 0) / logged.length) : 0;
    // consecutive logged days ending at endDate; an unlogged endDate (today so
    // far) doesn't break the streak, it just doesn't count yet
    let streak = 0, i = series.length - 1;
    if (i >= 0 && !series[i].logged) i--;
    for (; i >= 0 && series[i].logged; i--) streak++;
    const weightsInRange = state.weights.filter(w => w.date >= series[0].date && w.date <= endDate);
    const weightChange = weightsInRange.length >= 2
      ? round1(weightsInRange[weightsInRange.length - 1].lbs - weightsInRange[0].lbs) : null;
    return { series, daysLogged: logged.length, avgCal, streak, weightChange, weightsInRange };
  }

  // streak badge ladder (gamified retention; streak from trendStats)
  const STREAK_TIERS = [[3, 'Starter'], [7, 'Steady'], [14, 'Committed'], [30, 'Champion'], [90, 'Legend']];
  function streakBadge(streak) {
    let earned = null, next = null;
    for (const [days, label] of STREAK_TIERS) {
      if (streak >= days) earned = { days, label };
      else { next = { days, label }; break; }
    }
    return { streak, earned, next, daysToNext: next ? next.days - streak : 0 };
  }

  // most recent day with active-energy burn (Move ring), or null
  function latestBurn(state) {
    const dates = Object.keys(state.burn || {}).sort();
    if (!dates.length) return null;
    const date = dates[dates.length - 1];
    return { date, kcal: state.burn[date] };
  }

  // most recent day with imported steps, or null
  function latestSteps(state) {
    const dates = Object.keys(state.steps || {}).sort();
    if (!dates.length) return null;
    const date = dates[dates.length - 1];
    return { date, count: state.steps[date] };
  }

  // ----- sleep (Apple Health sleep analysis, from live sync) -----
  // Sample values (HKCategoryValueSleepAnalysis): 0 in bed, 1 asleep
  // (unspecified), 2 awake, 3 core, 4 deep, 5 REM. A night belongs to the day
  // you wake up: a sample counts toward the local date of its end + 6 h, so
  // anything ending after 6 PM is the next morning's night and a 2 PM nap is
  // today's. "minutes" is the main sleep (asleep stretches under an hour
  // apart), so "last night" and the 7-night average aren't padded by naps;
  // naps are kept apart in "nap". Each source is totalled on its own (overlaps
  // merged) and the source with the most sleep that night is used — two
  // devices are never added together. "In bed" alone never counts.
  const HOUR_MS = 3600000, SLEEP_ASLEEP = [1, 3, 4, 5], SLEEP_KEPT = 400;
  const SLEEP_TARGET_MIN = 420; // 7 h — adults need 7+ h a night (AASM/SRS consensus, Watson 2015)
  function mergeSpans(spans) {
    const out = [];
    for (const [a, b] of spans.slice().sort((x, y) => x[0] - y[0])) {
      const last = out[out.length - 1];
      if (last && a <= last[1]) last[1] = Math.max(last[1], b);
      else out.push([a, b]);
    }
    return out;
  }
  const spanMinutes = spans => Math.round(spans.reduce((t, [a, b]) => t + (b - a), 0) / 60000);
  // One sleep is a session: asleep stretches less than SLEEP_GAP apart, so an
  // hour or two awake at 3 AM is still the same night. A session belongs to the
  // day it ends on (+6 h), so a 1 PM–9 PM day sleep isn't split at 6 PM. Per
  // source and day the longest session is the night (bed, wake, stages) and the
  // others are naps; the source with the most sleep that night wins (devices
  // are never added).
  const SLEEP_GAP = 3 * HOUR_MS;
  function sleepNights(samples) {
    const bySource = {};
    for (const x of samples || []) {
      if (!x || typeof x !== 'object') continue;
      const start = Number(x.start), end = Number(x.end), v = Number(x.value);
      if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start || end - start > 24 * HOUR_MS) continue;
      if (!Number.isInteger(v) || v < 0 || v > 5) continue;
      const source = String(x.source || '').slice(0, 60);
      (bySource[source] = bySource[source] || []).push([start, end, v]);
    }
    const nights = {};
    for (const [source, list] of Object.entries(bySource)) {
      const sessions = [];
      for (const [a, b] of mergeSpans(list.filter(x => SLEEP_ASLEEP.includes(x[2])).map(x => [x[0], x[1]]))) {
        const last = sessions[sessions.length - 1];
        if (last && a - last.end < SLEEP_GAP) { last.end = b; last.ms += b - a; }
        else sessions.push({ start: a, end: b, ms: b - a });
      }
      const byDay = {};
      for (const x of sessions) {
        const date = todayISO(new Date(x.end + 6 * HOUR_MS));
        (byDay[date] = byDay[date] || []).push(x);
      }
      for (const [date, daySessions] of Object.entries(byDay)) {
        const minutes = Math.min(1440, Math.round(daySessions.reduce((t, x) => t + x.ms, 0) / 60000));
        if (!minutes) continue;
        const main = daySessions.reduce((m, x) => (x.ms > m.ms ? x : m));
        // stages are counted inside the main sleep only (clipped to it)
        const stage = v => spanMinutes(mergeSpans(list.filter(x => x[2] === v)
          .map(x => [Math.max(x[0], main.start), Math.min(x[1], main.end)]).filter(([a, b]) => b > a)));
        const night = Math.min(minutes, Math.round(main.ms / 60000));
        const n = { minutes: night, nap: minutes - night, start: main.start, end: main.end, source,
          deep: stage(4), rem: stage(5), core: stage(3), awake: stage(2) };
        if (!nights[date] || n.minutes > nights[date].minutes) nights[date] = n;
      }
    }
    return nights;
  }
  function cleanNight(n) {
    if (!n || typeof n !== 'object') return null;
    const minutes = Math.round(Number(n.minutes));
    if (!(minutes >= 1 && minutes <= 1440) || !Number.isFinite(n.start) || !Number.isFinite(n.end) || n.end <= n.start) return null;
    const m = k => Math.max(0, Math.min(1440, Math.round(Number(n[k]) || 0)));
    return { minutes, nap: m('nap'), start: n.start, end: n.end, source: String(n.source || '').slice(0, 60),
      deep: m('deep'), rem: m('rem'), core: m('core'), awake: m('awake') };
  }
  // The `days` nights ending on `date` (oldest first) for the Sleep area.
  // Averages count only nights with sleep recorded — a night the tracker was
  // off is unknown, not 0. Bedtime is averaged as minutes after 6 PM, so 11 PM
  // and 1 AM average to midnight (not noon); both clock averages come back as
  // minutes after midnight. recorded: the nights with data, newest first.
  function sleepRange(state, date, days = 7) {
    const nights = [], recorded = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(date + 'T12:00:00'); d.setDate(d.getDate() - i);
      const iso = todayISO(d);
      const n = (state.sleep || {})[iso];
      nights.push({ date: iso, minutes: n ? n.minutes : 0 });
      if (n) recorded.unshift({ date: iso, ...n });
    }
    const count = recorded.length;
    const mean = xs => xs.reduce((t, x) => t + x, 0) / xs.length;
    const clock = ms => { const t = new Date(ms); return t.getHours() * 60 + t.getMinutes(); };
    return {
      nights, recorded, count, target: SLEEP_TARGET_MIN,
      avg: count ? Math.round(mean(recorded.map(n => n.minutes))) : 0,
      atTarget: recorded.filter(n => n.minutes >= SLEEP_TARGET_MIN).length,
      avgBed: count ? (Math.round(mean(recorded.map(n => (clock(n.start) + 360) % 1440))) + 1080) % 1440 : null,
      avgWake: count ? Math.round(mean(recorded.map(n => clock(n.end)))) : null,
    };
  }
  // the Progress card's week (same numbers as the Sleep area's Week view)
  function sleepWeek(state, date) {
    const r = sleepRange(state, date, 7);
    return { nights: r.nights, count: r.count, target: r.target, avg: r.avg };
  }

  // weight check-in: record + recalc goal at new weight
  function checkInWeight(state, date, lbs) {
    const s = clone(state);
    s.weights = s.weights.filter(w => w.date !== date);
    s.weights.push({ date, lbs });
    s.weights.sort((a, b) => a.date.localeCompare(b.date));
    if (s.profile) {
      s.profile.weightLbs = lbs;
      s.goals = goalsFor(s.profile);
    }
    return s;
  }

  // ----- body measurements -----
  // Weight alone hides recomposition: people lose inches while the scale stalls.
  // inches for circumferences, percent for body fat.
  const BODY_METRICS = [
    { key: 'waist', unit: 'in', max: 90 },
    { key: 'chest', unit: 'in', max: 90 },
    { key: 'hips', unit: 'in', max: 90 },
    { key: 'arm', unit: 'in', max: 40 },
    { key: 'thigh', unit: 'in', max: 50 },
    { key: 'neck', unit: 'in', max: 30 },
    { key: 'bodyFat', unit: '%', max: 75 },
  ];
  const BODY_KEYS = BODY_METRICS.map(m => m.key);
  function bodyMetrics() { return BODY_METRICS.map(m => ({ ...m })); }

  // Upsert one date's measurements. Only the metrics present in `patch` change,
  // so logging just a waist doesn't wipe a chest recorded earlier that day.
  function logMeasurement(state, date, patch) {
    const s = clone(state);
    if (!Array.isArray(s.body)) s.body = [];
    const clean = {};
    for (const m of BODY_METRICS) {
      const v = patch[m.key];
      if (v === '' || v == null) continue;
      // hundredths, not tenths: a metric entry arrives as cm / 2.54, and tenths
      // of an inch would drift it (83 cm -> 32.7 in -> 83.1 cm)
      const n = Math.round(parseFloat(v) * 100) / 100;
      if (isFinite(n) && n > 0 && n <= m.max) clean[m.key] = n;
    }
    const existing = s.body.find(e => e.date === date);
    if (existing) Object.assign(existing, clean);
    else if (Object.keys(clean).length) s.body.push({ date, ...clean });
    // a date with every metric cleared drops out entirely
    s.body = s.body.filter(e => BODY_KEYS.some(k => typeof e[k] === 'number'));
    s.body.sort((a, b) => a.date.localeCompare(b.date));
    return s;
  }

  function removeMeasurement(state, date) {
    const s = clone(state);
    s.body = (s.body || []).filter(e => e.date !== date);
    return s;
  }

  // every recorded value for one metric, oldest first
  function measurementSeries(state, key) {
    return (state.body || [])
      .filter(e => typeof e[key] === 'number')
      .map(e => ({ date: e.date, value: e[key] }))
      .sort((a, b) => a.date.localeCompare(b.date));
  }

  function latestMeasurement(state, key) {
    const series = measurementSeries(state, key);
    return series.length ? series[series.length - 1] : null;
  }

  // {latest, first, change} for a metric, or null when nothing is recorded
  function measurementStats(state, key) {
    const series = measurementSeries(state, key);
    if (!series.length) return null;
    const first = series[0], latest = series[series.length - 1];
    return {
      key,
      latest: latest.value,
      latestDate: latest.date,
      first: first.value,
      firstDate: first.date,
      change: series.length > 1 ? round1(latest.value - first.value) : null,
      count: series.length,
    };
  }

  function updateProfile(state, patch) {
    const s = clone(state);
    s.profile = { ...s.profile, ...patch };
    if (s.profile.macroSplit && !validMacroSplit(s.profile.macroSplit)) delete s.profile.macroSplit;
    if (!validMacroGrams(s.profile.macroGrams)) delete s.profile.macroGrams; // also how % mode clears it
    if (validDayShift(s.profile.dayShift)) {
      s.profile.dayShift = { days: s.profile.dayShift.days.slice().sort((a, b) => a - b), boost: Math.round(s.profile.dayShift.boost) };
    } else delete s.profile.dayShift; // an empty or invalid choice means "same goal every day"
    s.goals = goalsFor(s.profile);
    return s;
  }

  // ----- Apple Health import -----
  const HEALTH_TYPES = {
    HKQuantityTypeIdentifierBodyMass: 'weight',
    HKQuantityTypeIdentifierActiveEnergyBurned: 'energy',
    HKQuantityTypeIdentifierStepCount: 'steps',
  };

  // Incremental parser for Apple Health export.xml. Feed the file in order:
  //   parseHealthRecords('', chunk1) -> { carry, weights:[{date,lbs}], energy:{date:kcal} }
  //   parseHealthRecords(prev.carry, chunk2) -> ...
  // Pure string work — the caller owns file IO. carry holds the tail after the
  // last complete tag so a <Record> split across chunk boundaries isn't lost.
  function parseHealthRecords(carry, chunk) {
    const text = carry + chunk;
    const cut = text.lastIndexOf('>') + 1;
    const scan = text.slice(0, cut);
    const weights = [], energyBySrc = {}, stepsBySrc = {};
    const attr = (tag, name) => { const m = tag.match(new RegExp(name + '="([^"]*)"')); return m ? m[1] : null; };
    const add = (into, date, src, v) => { const d = into[date] = into[date] || {}; d[src] = (d[src] || 0) + v; };
    const re = /<Record\b[^>]*>/g;
    let m;
    while ((m = re.exec(scan))) {
      const tag = m[0];
      const kind = HEALTH_TYPES[attr(tag, 'type')];
      if (!kind) continue;
      const date = (attr(tag, 'startDate') || '').slice(0, 10);
      const value = parseFloat(attr(tag, 'value'));
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !isFinite(value)) continue;
      if (kind === 'weight') {
        weights.push({ date, lbs: round1(attr(tag, 'unit') === 'kg' ? value * LB_PER_KG : value) });
      } else {
        // the export holds every device's records (iPhone AND watch count the
        // same steps and calories), so they're totalled per source here and
        // collapsed to one source per day — never added together
        add(kind === 'energy' ? energyBySrc : stepsBySrc, date, attr(tag, 'sourceName') || '', value);
      }
    }
    return { carry: text.slice(cut), weights, energyBySrc, stepsBySrc,
      energy: collapseSources(energyBySrc), steps: collapseSources(stepsBySrc) };
  }
  // {date: {source: total}} -> {date: the largest single source's total}. The
  // Health app merges devices by priority; the device that recorded the most
  // is the closest stand-in that never double counts.
  function collapseSources(bySrc) {
    const out = {};
    for (const [date, srcs] of Object.entries(bySrc || {})) {
      const vals = Object.values(srcs).filter(Number.isFinite);
      if (vals.length) out[date] = Math.max(...vals);
    }
    return out;
  }

  // Merge parsed Health data into state. Manual weigh-ins win: dates already in
  // s.weights are never overwritten. Energy days are replaced on re-import
  // (src:'health' entries), so importing the same export twice doesn't duplicate.
  // opts: { logEnergy: bool, since: 'YYYY-MM-DD' (skip energy before this) }
  function importHealth(state, data, opts = {}) {
    const s = clone(state);
    const byDate = {};
    for (const w of data.weights || []) byDate[w.date] = w.lbs; // later records win within the export
    let addedWeights = 0;
    for (const [date, lbs] of Object.entries(byDate)) {
      if (s.weights.some(x => x.date === date)) continue;
      s.weights.push({ date, lbs });
      addedWeights++;
    }
    if (addedWeights && s.profile) {
      s.weights.sort((a, b) => a.date.localeCompare(b.date));
      s.profile.weightLbs = s.weights[s.weights.length - 1].lbs;
      s.goals = goalsFor(s.profile);
    }
    // daily active energy is ALWAYS kept as "burn" (Move ring; dayTotals earns
    // back the part beyond the activity level — healthExercise). opts.logEnergy
    // additionally logs the full amount as exercise entries.
    let burnDays = 0;
    if (data.energy) {
      if (!s.burn) s.burn = {};
      for (const [date, kcal] of Object.entries(data.energy)) {
        if (Math.round(kcal) < 1) continue;
        s.burn[date] = Math.round(kcal);
        burnDays++;
      }
    }
    // workouts replace everything synced from `since` on (the wrapper's read
    // window), so a workout deleted in Health disappears here too. The wrapper
    // omits `workouts` entirely when it couldn't read them — never [] — so a
    // failed or not-yet-allowed read can't wipe what's stored.
    const syncSince = typeof data.since === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(data.since) ? data.since : null;
    let workoutsChanged = false;
    if (Array.isArray(data.workouts)) {
      const fresh = data.workouts.map(cleanWorkout).filter(Boolean);
      const since = syncSince || fresh.reduce((m, w) => (m && m < w.date ? m : w.date), null);
      const before = s.workouts || [];
      const merged = dedupeWorkouts([...(since ? before.filter(w => w.date < since) : before), ...fresh]);
      const next = merged.slice(-WORKOUTS_KEPT);
      workoutsChanged = JSON.stringify(next) !== JSON.stringify(before);
      s.workouts = next;
    }
    // sleep: nights AFTER `since` are replaced (the night ending on `since`
    // itself began the evening before the read window, so it's partial and the
    // earlier sync's copy is kept). Same rule as workouts: no `sleep` key, no change.
    let sleepChanged = false;
    if (Array.isArray(data.sleep)) {
      const nights = sleepNights(data.sleep);
      const before = s.sleep || {};
      const keep = Object.entries(before).filter(([d]) => !syncSince || d <= syncSince);
      const add = Object.entries(nights).filter(([d]) => !syncSince || d > syncSince);
      const merged = {};
      for (const [d, n] of [...keep, ...add]) merged[d] = n;
      const next = Object.fromEntries(Object.entries(merged).sort(([a], [b]) => a.localeCompare(b)).slice(-SLEEP_KEPT));
      sleepChanged = JSON.stringify(next) !== JSON.stringify(before);
      s.sleep = next;
    }
    let stepDays = 0;
    if (data.steps) {
      if (!s.steps) s.steps = {};
      for (const [date, n] of Object.entries(data.steps)) {
        if (Math.round(n) < 1) continue;
        s.steps[date] = Math.round(n); // device data: latest import wins, naturally idempotent
        stepDays++;
      }
    }
    let energyDays = 0;
    if (opts.logEnergy) {
      for (const [date, cal] of Object.entries(data.energy || {})) {
        if (opts.since && date < opts.since) continue;
        if (Math.round(cal) < 1) continue;
        const d = ensureDay(s, date);
        d.exercise = d.exercise.filter(e => e.src !== 'health');
        d.exercise.push({ entryId: uid(), name: 'Active energy', minutes: 0, cal: Math.round(cal), src: 'health' });
        energyDays++;
      }
    }
    return { state: s, addedWeights, energyDays, stepDays, burnDays, workoutsChanged, sleepChanged };
  }

  // ----- backup nudge -----
  function markExported(state, date) {
    const s = clone(state);
    s.lastExportAt = date;
    return s;
  }

  // true when there's data worth backing up and no export for `every` days or
  // more (30 by default; the web app asks every 14, since clearing a browser's
  // website data takes the diary with it)
  function needsBackupNudge(state, today, every = 30) {
    if (!state.profile) return false;
    const hasData = Object.keys(state.diary).length >= 3 || state.weights.length >= 3 || state.customFoods.length > 0;
    if (!hasData) return false;
    const last = state.lastExportAt || state.profile.startDate;
    if (!last) return false;
    const days = Math.round((new Date(today + 'T12:00:00') - new Date(last + 'T12:00:00')) / 86400000);
    return days >= every;
  }

  // ===== IMPORT FROM ANOTHER TRACKER (MyFitnessPal / Cronometer CSV) =====
  // Header-driven, not position-driven: both apps change their column order and
  // set between versions, and users export different subsets. Anything we can't
  // recognize is skipped rather than guessed at.

  // RFC-4180-ish CSV: quoted fields may contain commas, newlines and "" escapes.
  function parseCSV(text) {
    const src = String(text).replace(/^﻿/, ''); // strip BOM
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < src.length; i++) {
      const ch = src[i];
      if (quoted) {
        if (ch === '"') {
          if (src[i + 1] === '"') { field += '"'; i++; }
          else quoted = false;
        } else field += ch;
        continue;
      }
      if (ch === '"') { quoted = true; continue; }
      if (ch === ',') { row.push(field); field = ''; continue; }
      if (ch === '\r') continue;
      if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; continue; }
      field += ch;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  // "Saturated Fat (g)" -> "saturated fat";  "Energy (kcal)" -> "energy"
  function normHeader(h) {
    return String(h).toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/[^a-z0-9 ]+/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }

  const CSV_FIELDS = {
    date: ['date', 'day', 'entry date'],
    meal: ['meal', 'group', 'category', 'meal name'],
    name: ['food name', 'food', 'name', 'item', 'product', 'description'],
    amount: ['amount', 'servings', 'quantity', 'serving', 'serving size'],
    cal: ['calories', 'energy', 'kcal', 'calories kcal'],
    c: ['carbohydrates', 'carbs', 'carbohydrate', 'total carbohydrate'],
    p: ['protein'],
    f: ['fat', 'total fat', 'total lipid'],
    fib: ['fiber', 'dietary fiber', 'fibre'],
    sug: ['sugar', 'sugars', 'total sugars'],
    sod: ['sodium'],
    sat: ['saturated fat', 'saturated', 'sat fat'],
    chol: ['cholesterol'],
    metric: ['metric', 'measure', 'measurement', 'type'],
    unit: ['unit', 'units'],
    value: ['amount', 'value', 'weight'],
    exercise: ['exercise', 'exercise name', 'activity', 'workout'],
    burned: ['calories burned', 'energy burned', 'calories'],
    minutes: ['minutes', 'duration', 'exercise minutes', 'time'],
  };

  // metric-name -> our body key, for both the metric-row and column layouts
  const BODY_ALIASES = [
    [/^waist/, 'waist'], [/^chest|^bust/, 'chest'], [/^hips?/, 'hips'],
    [/^(bicep|arm)/, 'arm'], [/^thigh/, 'thigh'], [/^neck/, 'neck'],
    [/^body ?fat|^bf( |$)/, 'bodyFat'],
  ];
  function bodyKeyFrom(label) {
    const t = normHeader(label);
    for (const [re, key] of BODY_ALIASES) if (re.test(t)) return key;
    return null;
  }

  // map logical field -> column index, preferring an exact header match
  function mapColumns(header) {
    const norm = header.map(normHeader);
    const idx = {};
    for (const [key, candidates] of Object.entries(CSV_FIELDS)) {
      for (const cand of candidates) {
        const i = norm.indexOf(cand);
        if (i !== -1) { idx[key] = i; break; }
      }
    }
    return idx;
  }

  const MEAL_ALIASES = {
    breakfast: 'breakfast', desayuno: 'breakfast', morning: 'breakfast',
    lunch: 'lunch', comida: 'lunch', almuerzo: 'lunch', midday: 'lunch',
    dinner: 'dinner', cena: 'dinner', supper: 'dinner', evening: 'dinner',
    snack: 'snacks', snacks: 'snacks', 'snacks other': 'snacks', other: 'snacks',
  };
  function mealKeyFrom(raw) {
    const k = normHeader(raw);
    if (MEAL_ALIASES[k]) return MEAL_ALIASES[k];
    for (const [alias, meal] of Object.entries(MEAL_ALIASES)) if (k.startsWith(alias)) return meal;
    return 'snacks'; // custom Cronometer groups land in snacks rather than vanishing
  }

  // accepts 2026-07-30, 07/30/2026, 30/07/2026 (day-first only when unambiguous)
  function normalizeCSVDate(raw) {
    const t = String(raw).trim();
    let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${String(+m[2]).padStart(2, '0')}-${String(+m[3]).padStart(2, '0')}`;
    m = t.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{4})/);
    if (m) {
      let a = +m[1], b = +m[2];
      const [mon, day] = a > 12 ? [b, a] : [a, b]; // 30/07 -> day-first
      if (mon < 1 || mon > 12 || day < 1 || day > 31) return null;
      return `${m[3]}-${String(mon).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }
    return null;
  }

  function num(v) {
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
    return isFinite(n) ? n : 0;
  }

  // One CSV -> whatever it happens to contain. Returns {} sections it can't find.
  function parseTrackerCSV(text) {
    const rows = parseCSV(text);
    if (rows.length < 2) return { foods: [], weights: [], exercises: [] };
    const idx = mapColumns(rows[0]);
    const body = rows.slice(1);
    const foods = [], weights = [], exercises = [], measurements = [];
    if (idx.date == null) return { foods, weights, exercises, measurements };

    const hasFood = idx.cal != null && (idx.name != null || idx.meal != null);
    const hasExercise = idx.exercise != null;
    const metricIsWeight = idx.metric != null;
    const weightCol = (() => {
      const i = rows[0].findIndex(h => /^weight/i.test(normHeader(h)));
      return i === -1 ? null : i;
    })();
    // MFP-style measurement exports put each metric in its own column
    const bodyCols = rows[0].map((h, i) => [i, bodyKeyFrom(h)]).filter(([, k]) => k);

    for (const r of body) {
      const date = normalizeCSVDate(r[idx.date]);
      if (!date) continue;

      if (hasExercise) {
        const name = (r[idx.exercise] || '').trim();
        const cal = idx.burned != null ? Math.round(num(r[idx.burned])) : 0;
        if (name && cal > 0) {
          exercises.push({ date, name, minutes: idx.minutes != null ? Math.round(num(r[idx.minutes])) : 0, cal });
        }
        continue;
      }

      if (metricIsWeight) {
        const bodyKey = bodyKeyFrom(r[idx.metric] || '');
        if (bodyKey) {
          const v = num(r[idx.value != null ? idx.value : idx.metric + 1]);
          if (v > 0) {
            const unit = idx.unit != null ? String(r[idx.unit]) : '';
            // circumferences export in cm from metric-unit accounts
            const inches = bodyKey !== 'bodyFat' && /cm/i.test(unit) ? v / 2.54 : v;
            measurements.push({ date, key: bodyKey, value: round1(inches) });
          }
          continue;
        }
        if (!/weight|peso|body mass/i.test(r[idx.metric] || '')) continue;
        const unit = idx.unit != null ? String(r[idx.unit]) : '';
        let lbs = num(r[idx.value != null ? idx.value : idx.metric + 1]);
        if (/kg/i.test(unit)) lbs = lbs * LB_PER_KG;
        if (lbs > 0) weights.push({ date, lbs: round1(lbs) });
        continue;
      }

      if (bodyCols.length && !hasFood) {
        for (const [col, key] of bodyCols) {
          const v = num(r[col]);
          if (v <= 0) continue;
          const inches = key !== 'bodyFat' && /cm/i.test(rows[0][col]) ? v / 2.54 : v;
          measurements.push({ date, key, value: round1(inches) });
        }
      }

      if (weightCol != null && !hasFood) {
        let lbs = num(r[weightCol]);
        if (/kg/i.test(rows[0][weightCol])) lbs = lbs * LB_PER_KG;
        if (lbs > 0) weights.push({ date, lbs: round1(lbs) });
        continue;
      }
      if (bodyCols.length && !hasFood) continue;

      if (hasFood) {
        const cal = Math.round(num(r[idx.cal]));
        const meal = idx.meal != null ? mealKeyFrom(r[idx.meal]) : 'snacks';
        // daily/meal summary exports have no food column — keep the row, name it
        // after its meal so the calories still land on the right day
        let name = idx.name != null ? String(r[idx.name]).trim() : '';
        if (!name) name = idx.meal != null ? String(r[idx.meal]).trim() : '';
        if (!name) name = 'Imported entry';
        if (cal <= 0 && !name) continue;
        const entry = {
          date, meal, name,
          serving: idx.amount != null && String(r[idx.amount]).trim() ? String(r[idx.amount]).trim() : 'imported',
          cal,
          c: round1(idx.c != null ? num(r[idx.c]) : 0),
          p: round1(idx.p != null ? num(r[idx.p]) : 0),
          f: round1(idx.f != null ? num(r[idx.f]) : 0),
        };
        for (const m of MICROS) entry[m] = round1(idx[m] != null ? num(r[idx[m]]) : 0);
        foods.push(entry);
      }
    }
    return { foods, weights, exercises, measurements };
  }

  // Merge several CSVs (a whole export) into one payload.
  function parseTrackerFiles(texts) {
    const out = { foods: [], weights: [], exercises: [], measurements: [] };
    for (const t of texts) {
      const r = parseTrackerCSV(t);
      out.foods.push(...r.foods);
      out.weights.push(...r.weights);
      out.exercises.push(...r.exercises);
      out.measurements.push(...(r.measurements || []));
    }
    return out;
  }

  // Merge into state. Idempotent: re-importing the same export adds nothing,
  // and nothing the user logged in FuelRing is ever overwritten.
  function importTracker(state, parsed, opts = {}) {
    const s = clone(state);
    const since = opts.since || null;
    let addedFoods = 0, addedWeights = 0, addedExercises = 0, skipped = 0;
    const days = new Set();

    for (const e of parsed.foods || []) {
      if (since && e.date < since) { skipped++; continue; }
      const d = ensureDay(s, e.date);
      const list = d.meals[e.meal] || d.meals.snacks;
      if (list.some(x => x.name === e.name && x.cal === e.cal && x.serving === e.serving)) { skipped++; continue; }
      const entry = { entryId: uid(), foodId: null, name: e.name, serving: e.serving, servings: 1, cal: e.cal, c: e.c, p: e.p, f: e.f, src: 'import' };
      for (const m of MICROS) entry[m] = e[m] || 0;
      list.push(entry);
      addedFoods++; days.add(e.date);
    }

    const byDate = {};
    for (const w of parsed.weights || []) byDate[w.date] = w.lbs;
    for (const [date, lbs] of Object.entries(byDate)) {
      if (since && date < since) { skipped++; continue; }
      if (s.weights.some(x => x.date === date)) { skipped++; continue; } // never overwrite
      s.weights.push({ date, lbs });
      addedWeights++;
    }
    s.weights.sort((a, b) => a.date.localeCompare(b.date));

    for (const x of parsed.exercises || []) {
      if (since && x.date < since) { skipped++; continue; }
      const d = ensureDay(s, x.date);
      if (d.exercise.some(e => e.name === x.name && e.cal === x.cal && e.minutes === x.minutes)) { skipped++; continue; }
      d.exercise.push({ entryId: uid(), name: x.name, minutes: x.minutes, cal: x.cal, src: 'import' });
      addedExercises++; days.add(x.date);
    }

    let addedMeasurements = 0;
    for (const m of parsed.measurements || []) {
      if (since && m.date < since) { skipped++; continue; }
      const existing = (s.body || []).find(e => e.date === m.date);
      if (existing && typeof existing[m.key] === 'number') { skipped++; continue; } // never overwrite
      const next = logMeasurement(s, m.date, { [m.key]: m.value });
      s.body = next.body;
      addedMeasurements++;
    }

    // a fresh weigh-in history should move the goal to match reality
    if (addedWeights && s.profile && s.weights.length) {
      s.profile.weightLbs = s.weights[s.weights.length - 1].lbs;
      s.goals = goalsFor(s.profile);
    }

    // localStorage is ~5MB on Safari/WKWebView. A decade of heavy logging can
    // exceed that, and a save that throws would silently lose the whole import
    // on next launch. Keep the most recent history instead, and say so. Days the
    // user logged in FuelRing themselves are never trimmed — only imported ones.
    const budget = opts.maxBytes == null ? 4 * 1024 * 1024 : opts.maxBytes;
    let trimmedDays = 0, oldestKept = null;
    if (budget > 0) {
      let size = serialize(s).length;
      if (size > budget) {
        const isImportedOnly = date => {
          const d = s.diary[date];
          if (!d) return false;
          const foods = ['breakfast', 'lunch', 'dinner', 'snacks'].reduce((acc, m) => acc.concat(d.meals[m] || []), []);
          if (!foods.length && !d.exercise.length) return true; // empty shell
          return foods.every(e => e.src === 'import') && d.exercise.every(e => e.src === 'import');
        };
        const trimmable = Object.keys(s.diary).filter(isImportedOnly).sort(); // oldest first
        let i = 0;
        while (size > budget && i < trimmable.length) {
          // estimate how many days to drop so this converges in a few passes
          const dayCount = Math.max(1, Object.keys(s.diary).length);
          const perDay = Math.max(1, Math.round(size / dayCount));
          const batch = Math.max(1, Math.min(trimmable.length - i, Math.ceil((size - budget) / perDay) + 1));
          for (let k = 0; k < batch && i < trimmable.length; k++) { delete s.diary[trimmable[i++]]; trimmedDays++; }
          size = serialize(s).length;
        }
        if (trimmedDays) {
          const left = Object.keys(s.diary).sort();
          oldestKept = left.length ? left[0] : null;
        }
      }
    }

    return { state: s, addedFoods, addedWeights, addedExercises, addedMeasurements, days: days.size, skipped, trimmedDays, oldestKept };
  }

  // ----- share -----
  // plain-text one-day summary for sharing (clipboard / share sheet)
  function dayShareText(state, date) {
    const isEs = state.lang === 'es';
    const t = dayTotals(state, date);
    const d = day(state, date);
    const lines = [
      `FuelRing — ${date}`,
      isEs ? `Meta ${t.goal} − Comida ${t.food.cal} + Ejercicio ${t.exercise} = Restante ${t.remaining}`
        : `Goal ${t.goal} − Food ${t.food.cal} + Exercise ${t.exercise} = Remaining ${t.remaining}`,
    ];
    const labels = isEs
      ? { breakfast: 'Desayuno', lunch: 'Comida', dinner: 'Cena', snacks: 'Snacks' }
      : { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snacks: 'Snacks' };
    for (const [key, label] of Object.entries(labels)) {
      const entries = d.meals[key];
      if (!entries.length) continue;
      lines.push('', `${label} — ${mealTotals(state, date, key).cal} kcal`);
      for (const e of entries) lines.push(`  • ${e.name} — ${entryUnitText(state, e) || `${e.servings} × ${e.serving}`} — ${e.cal} kcal`);
    }
    const h = t.health && t.health.credit ? t.health : null;
    if (d.exercise.length || h) {
      lines.push('', isEs ? `Ejercicio — ${t.exercise} kcal ganadas` : `Exercise — ${t.exercise} kcal earned`);
      for (const e of d.exercise) lines.push(`  • ${e.name}${e.minutes ? ` — ${e.minutes} min` : ''} — +${e.cal} kcal`);
      if (h) {
        for (const w of h.workouts) if (w.counted) lines.push(`  • ${workoutName(w.type, state.lang)} — ${w.minutes} min — +${w.counted} kcal`);
        if (h.movement) lines.push(`  • ${isEs ? 'Movimiento diario' : 'Everyday movement'} — +${h.movement} kcal`);
      }
    }
    if (state.goals) {
      const dg = goalsForDate(state, date);
      lines.push('', `Macros: C ${Math.round(t.food.c)}/${dg.carbs}g · P ${Math.round(t.food.p)}/${dg.protein}g · F ${Math.round(t.food.f)}/${dg.fat}g`);
    }
    return lines.join('\n');
  }

  // ----- recent / frequent foods -----
  // The foods you actually eat, ranked by how many times they're in the diary.
  // Counted from the diary itself (not a stored tally), so deleting an entry or
  // importing history is reflected with no bookkeeping. Ties go to recency.
  function frequentFoods(state, db, limit = 12) {
    const counts = {};
    for (const d of Object.values(state.diary)) {
      for (const list of Object.values(d.meals || {})) {
        for (const e of list) if (e.foodId) counts[e.foodId] = (counts[e.foodId] || 0) + 1;
      }
    }
    const byId = new Map([...state.customFoods, ...db].map(f => [f.id, f]));
    const rec = id => { const i = state.recents.indexOf(id); return i < 0 ? Infinity : i; };
    return Object.keys(counts)
      .filter(id => byId.has(id))
      .sort((a, b) => counts[b] - counts[a] || rec(a) - rec(b))
      .slice(0, limit)
      .map(id => ({ ...byId.get(id), timesLogged: counts[id] }));
  }

  // ----- quick add -----
  // Calories plus optional macros. With macros but no calories, calories come
  // from the macros (Atwater 4/4/9) — that's how people quick-add off a label.
  // Returns a food-shaped object for logFood, or null when there's nothing to log.
  // lang picks the macro letters for the entry's serving line (fat is G in Spanish:
  // grasa); entries are denormalized in the language they were logged in.
  function quickAddFood({ name, cal, c, p, f, lang } = {}) {
    const num = v => { const n = parseFloat(v); return Number.isFinite(n) && n > 0 ? round1(n) : 0; };
    const m = { c: num(c), p: num(p), f: num(f) };
    let kcal = Math.round(num(cal));
    if (!kcal) kcal = Math.round(m.c * 4 + m.p * 4 + m.f * 9);
    if (kcal < 1) return null;
    const label = [m.c && `${m.c}g C`, m.p && `${m.p}g P`, m.f && `${m.f}g ${lang === 'es' ? 'G' : 'F'}`].filter(Boolean).join(' · ');
    return { name: String(name || '').trim() || 'Quick add', serving: label ? `${kcal} kcal · ${label}` : `${kcal} kcal`, cal: kcal, ...m };
  }

  // ----- complete diary: 5-week projection -----
  // "If every day were like today, you'd weigh X in 5 weeks." Net calories vs
  // maintenance (the measured burn if the user applied one, else the formula),
  // 3500 kcal per lb. tooLow flags a net under the 1200/1500 floor — the
  // projection is not a recommendation to eat that little.
  function weightProjection(state, date, weeks = 5) {
    const p = state.profile;
    if (!p) return null;
    const t = dayTotals(state, date);
    if (t.food.cal <= 0) return null;
    const net = t.food.cal - t.exercise;
    const maintenance = Number.isFinite(p.tdeeOverride) ? p.tdeeOverride : tdee(p);
    const current = state.weights.length ? state.weights[state.weights.length - 1].lbs : p.weightLbs;
    const change = round1((net - maintenance) * weeks * 7 / 3500);
    return {
      weeks, net: Math.round(net), maintenance: Math.round(maintenance),
      current, change, projected: round1(current + change),
      tooLow: net < (p.sex === 'male' ? 1500 : 1200),
    };
  }

  // ----- intermittent fasting -----
  // Times are epoch ms passed in by the caller (core never reads the clock).
  // Plans are fasting hours: 13 (13:11), 16 (16:8), 18 (18:6), 20 (20:4).
  const FAST_PLANS = [13, 16, 18, 20];
  const HOUR = 3600000;
  function fastPlans() { return FAST_PLANS.slice(); }
  function startFast(state, nowMs, target = 16) {
    if (state.fast || !Number.isFinite(nowMs)) return state;
    const s = clone(state);
    s.fast = { start: nowMs, target: FAST_PLANS.includes(target) ? target : 16 };
    return s;
  }
  // Ends the running fast and files it in history. Anything under a minute is a
  // mis-tap, not a fast, so it's dropped rather than recorded.
  function endFast(state, nowMs) {
    if (!state.fast) return state;
    const s = clone(state);
    const { start, target } = s.fast;
    s.fast = null;
    if (nowMs - start >= 60000) {
      s.fasts = [...(s.fasts || []), { start, end: nowMs, target }].slice(-60);
    }
    return s;
  }
  function fastStatus(state, nowMs) {
    const f = state.fast;
    if (!f) return null;
    const elapsed = Math.max(0, nowMs - f.start);
    const goalMs = f.target * HOUR;
    return {
      start: f.start, target: f.target, elapsedMs: elapsed,
      remainingMs: Math.max(0, goalMs - elapsed), endsAt: f.start + goalMs,
      pct: Math.min(100, Math.round(elapsed / goalMs * 100)), done: elapsed >= goalMs,
    };
  }
  function fastStats(state) {
    const list = state.fasts || [];
    const hours = f => (f.end - f.start) / HOUR;
    return {
      count: list.length,
      completed: list.filter(f => hours(f) >= f.target).length,
      longestH: list.length ? round1(Math.max(...list.map(hours))) : 0,
      avgH: list.length ? round1(list.reduce((t, f) => t + hours(f), 0) / list.length) : 0,
      recent: list.slice(-7).reverse().map(f => ({ ...f, hours: round1(hours(f)), hit: hours(f) >= f.target })),
    };
  }

  // ----- persistence -----
  function serialize(state) { return JSON.stringify(state); }
  function deserialize(str) {
    const s = JSON.parse(str);
    if (!s || ![1, 2, 3, 4, 5, 6, 7].includes(s.version)) throw new Error('bad state');
    if (s.version === 1) { // v1 -> v2 is purely additive
      s.savedMeals = [];
      s.steps = {};
      s.lastExportAt = null;
      s.version = 2;
    }
    if (s.version === 2) { // v2 -> v3: water tracking
      s.water = s.water || {};
      s.version = 3;
    }
    if (s.version === 3) { // v3 -> v4: active-energy burn (Move ring)
      s.burn = s.burn || {};
      s.version = 4;
    }
    if (s.version === 4) { // v4 -> v5: body measurements
      s.body = Array.isArray(s.body) ? s.body : [];
      s.version = 5;
    }
    if (s.version === 5) { // v5 -> v6: intermittent fasting
      s.fasts = Array.isArray(s.fasts) ? s.fasts : [];
      s.fast = null;
      s.version = 6;
    }
    if (s.version === 6) { // v6 -> v7: Apple Health workouts and sleep
      s.workouts = Array.isArray(s.workouts) ? s.workouts : [];
      // Before v7 the levels read "Lightly active — 1–3 workouts/week" etc., so
      // a non-sedentary level already budgets for workouts that now count on
      // their own. Ask once (diary card) rather than double count — or quietly
      // move anyone's goal.
      if (s.profile && s.profile.activity && s.profile.activity !== 'sedentary') s.activityReview = true;
      s.sleep = s.sleep && typeof s.sleep === 'object' && !Array.isArray(s.sleep) ? s.sleep : {};
      s.version = 7;
    }
    // structural check so a truncated/hand-edited backup fails loudly here
    // instead of half-loading and crashing later
    const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
    if (!(s.profile === null || isObj(s.profile)) ||
        !(s.goals === null || isObj(s.goals)) ||
        !Array.isArray(s.customFoods) || !Array.isArray(s.recents) ||
        !Array.isArray(s.weights) || !isObj(s.diary) ||
        !Array.isArray(s.savedMeals) || !isObj(s.steps) || !isObj(s.water) || !isObj(s.burn) ||
        !Array.isArray(s.body) || !Array.isArray(s.fasts) || !Array.isArray(s.workouts)) throw new Error('bad state');
    s.workouts = dedupeWorkouts(s.workouts.map(cleanWorkout).filter(Boolean)); // a hand-edited row just drops
    const nights = {};
    for (const [d, n] of Object.entries(isObj(s.sleep) ? s.sleep : {})) {
      const c = /^\d{4}-\d{2}-\d{2}$/.test(d) && cleanNight(n);
      if (c) nights[d] = c;
    }
    s.sleep = nights;
    const okFast = f => isObj(f) && Number.isFinite(f.start) && FAST_PLANS.includes(f.target);
    if (!(s.fast === null || okFast(s.fast))) s.fast = null; // a corrupt timer just stops
    s.fasts = s.fasts.filter(f => okFast(f) && Number.isFinite(f.end) && f.end > f.start);
    if (typeof s.lastExportAt !== 'string') s.lastExportAt = null;
    if (typeof s.onlineLookup !== 'boolean') s.onlineLookup = true; // pref added post-v3; default on
    if (!THEMES.includes(s.theme)) s.theme = 'auto';
    if (typeof s.netCarbs !== 'boolean') s.netCarbs = false;
    if (typeof s.healthExercise !== 'boolean') s.healthExercise = true; // pref added post-v6
    if (typeof s.activityReview !== 'boolean') s.activityReview = false;

  const tr = s => state.lang === 'es' ? (TR[s] || s) : s;
  const LOC = () => state.lang === 'es' ? 'es-MX' : undefined;
  const fdName = f => Core.foodName(state, f);
  const fdServ = f => Core.foodServing(state, f);

  function toast(msg, ms = 1600) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
  }
  // Inside the iOS app a WKWebView can't download: an <a download> click would
  // navigate the whole app to the raw file, with no way back. There the wrapper
  // takes the text, writes the file and opens the share sheet (Save to Files,
  // AirDrop, Mail…). The double-clicked file downloads as it always has.
  function saveFile(name, mime, text) {
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'saveFile', name, text }));
      return true;
    }
    // the web app on a phone: the share sheet (Save to Files, AirDrop, Drive,
    // Mail) where the browser can share that kind of file; a download otherwise
    if (WEB && (IS_IOS || IS_ANDROID) && navigator.canShare && typeof File === 'function') {
      try {
        const f = new File([text], name, { type: mime });
        if (navigator.canShare({ files: [f] })) {
          navigator.share({ files: [f] }).catch(err => { if (!err || err.name !== 'AbortError') download(name, mime, text); });
          return true;
        }
      } catch (e) { /* fall back to a download */ }
    }
    return download(name, mime, text);
  }
  function download(name, mime, text) {
    if (typeof URL.createObjectURL !== 'function') return false;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; a.click();
    URL.revokeObjectURL(a.href);
    return true;
  }

  function dateLabel(iso) {
    const today = Core.todayISO();
    const d = new Date(iso + 'T12:00:00');
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (iso === today) return tr('Today');
    if (iso === Core.todayISO(y)) return tr('Yesterday');
    return d.toLocaleDateString(LOC(), { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function shiftDate(days) {
    const d = new Date(ui.date + 'T12:00:00'); d.setDate(d.getDate() + days);
    ui.date = Core.todayISO(d); render();
  }

  // ---------- BARCODE SCANNER ----------
  let scanStream = null, scanTimer = null;
  function stopScan() {
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  }
  async function handleBarcode(code) {
    const canon = Core.normalizeBarcode(code);
    if (!canon) return toast(tr('Enter a valid barcode number'));
    const hit = Core.lookupBarcode(state, FOOD_DB, canon);
    if (hit) {
      pickFood(hit); ui.scanBarcode = null; ui.scanPrefill = null; render();
      toast(`${tr('Found')}: ${fdName(hit)}`);
      return;
    }
    // opt-out online lookup (Open Food Facts); fails silently into the offline flow
    if (state.onlineLookup !== false && typeof fetch === 'function') {
      toast(tr('Not saved yet — searching online…'));
      const food = await fetchOpenFoodFacts(canon);
      if (!MEALS.some(m => m[0] === ui.modal)) return; // sheet closed while fetching
      if (food) {
        ui.scanBarcode = canon; ui.scanPrefill = food; ui.modalTab = 'create'; render();
        toast(food.alc ? tr('Estimated for a standard pour — adjust if yours is bigger')
          : tr('Found online — check the values, then save'));
        return;
      }
    }
    if (!MEALS.some(m => m[0] === ui.modal)) return;
    ui.scanBarcode = canon; ui.scanPrefill = null; ui.modalTab = 'create'; render();
    toast(tr("Not found — save it once and it's linked"));
  }

  async function fetchOpenFoodFacts(code) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(
        `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,serving_size,nutriments`,
        { signal: ctrl.signal });
      clearTimeout(t);
      if (!res.ok) return null;
      return Core.offProductToFood(await res.json());
    } catch (e) { return null; }
  }
  // Native-app bridge: inside the Expo wrapper there is no BarcodeDetector, but
  // the wrapper can run the phone's real camera scanner and inject the result
  // via window.__onNativeBarcode (see EXPO-HANDOFF.md).
  window.__onNativeBarcode = code => {
    if (MEALS.some(m => m[0] === ui.modal)) handleBarcode(String(code));
  };
  // ---------- PRO (in-app purchase, wrapper-only) ----------
  // Inside the wrapper, the wrapper injects the StoreKit entitlement on every
  // launch. The double-clicked file has everything unlocked. The web app is
  // the free tier: Pro is bought and kept in the iPhone app (a website can't
  // sell it or check an Apple purchase without accounts), so a pro flag that
  // arrives in a restored backup unlocks nothing here.
  function isPro() {
    if (window.ReactNativeWebView) return state.pro === true;
    return !WEB;
  }
  // workouts arrive only through live Health sync: the iPhone app, with Pro
  function workoutsSync() {
    return !!window.ReactNativeWebView && isPro() && state.healthExercise !== false;
  }
  const FREE_MEAL_LIMIT = 3;
  window.__onEntitlements = e => {
    const unlocked = !state.pro && !!(e && e.pro);
    state = Core.setPro(state, !!(e && e.pro));
    // A purchase or restore landing while the sheet is open: close it and say
    // so, rather than leave "Unlock Pro" on screen for something now owned.
    if (unlocked && ui.modal === 'pro') { ui.modal = null; toast(tr('FuelRing Pro unlocked — thank you!'), 3000); }
    save(); render();
    // The wrapper injects health data and the entitlement concurrently on
    // launch; if the health payload lost that race it's buffered — apply it
    // the moment Pro lands instead of waiting for the next foreground.
    applyPendingHealth();
  };
  window.__onProducts = p => {
    if (p && p.price) { window.__proPrice = String(p.price); if (ui.modal === 'pro') render(); }
  };
  // How a store action the wrapper ran for the page ended. Never silent: a Buy
  // or Restore tap that ends with nothing on screen reads as a broken button.
  // {action:'restore', pro} | {action:'purchase'|'restore', error:true}.
  // A user cancelling the purchase sheet sends nothing — that needs no reply.
  window.__onStoreResult = r => {
    if (!r) return;
    if (r.error) toast(r.action === 'restore' ? tr("Couldn't reach the App Store") : tr("Purchase didn't go through — try again"), 3500);
    else if (r.action === 'restore') toast(r.pro ? tr('Purchase restored') : tr('No purchase found to restore'), 3500);
  };
  function openPro() { ui.modal = 'pro'; render(); }

  // ---------- WEB EDITION: Pro → the iPhone app, install, keeping the diary safe ----------
  // The App Store's US price, shown only to US-English browsers; everywhere
  // else the App Store shows its own local price, so the page names none.
  const webProPrice = () => state.lang !== 'es' && /^en-us$/i.test(navigator.language || '') ? '$9.99' : '';

      : `One payment${price ? ' of ' + price : ''} in the FuelRing iPhone app — never a subscription. Everything else here stays free.`) + ' ' +

  // Chrome (Android, computers) offers its own install prompt: keep it for our
  // Install button. iPhone Safari has none — there it's Share → Add to Home Screen.
  let installPrompt = null;
  if (WEB) {
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (state.profile) render(); });

  function installNow() {
    if (!installPrompt) return;
    const p = installPrompt;
    installPrompt = null;
    p.prompt();
    if (p.userChoice) p.userChoice.then(r => { if (r && r.outcome === 'accepted') toast(tr('Installing FuelRing…')); render(); }).catch(() => {});

  // A browser may clear a website's storage to make room (and Safari clears it
  // after 7 days without a visit, unless the site is on the Home Screen), so
  // ask to keep it, and say so where it matters. Once is enough.
  let persistAsked = false;
  function keepStorage() {
    if (!WEB || persistAsked || !state.profile) return;
    persistAsked = true;
